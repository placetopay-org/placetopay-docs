name: SEO Metadata Check

on:
  pull_request:
    paths:
      - 'src/pages/**'
      - 'src/mdx/pageInfo.mjs'
      - 'scripts/auditSeoMeta.mjs'
  push:
    branches: ['main']
    paths:
      - 'src/pages/**'
      - 'src/mdx/pageInfo.mjs'
      - 'scripts/auditSeoMeta.mjs'

permissions:
  contents: read

jobs:
  seo-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Check every page has an H1 title and a description
        run: npm run check:seo-meta
