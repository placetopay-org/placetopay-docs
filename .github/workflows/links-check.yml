name: Internal Links Check

on:
  pull_request:
    paths:
      - 'src/pages/**'
      - 'src/constants/navigations.js'
  push:
    branches: ['main']
    paths:
      - 'src/pages/**'
      - 'src/constants/navigations.js'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check internal links
        run: npm run check:links
