openapi: 3.1.0
info:
  title: Placetopay PAR API
  description: |
    API para integrar a comercios y emisores con PAR, el portal en el que los tarjetahabientes inscriben
    sus tarjetas y gestionan sus autopagos.

    Tu servidor solicita un token de un solo uso y el navegador del tarjetahabiente lo presenta a PAR
    para iniciar la sesión en la que inscribe el autopago.
  version: 1.0.0

servers:
  - url: '{urlBase}'
    description: Ambiente de trabajo
    variables:
      urlBase:
        default: https://par.example.com
        description: |
          URL base del ambiente. Se entrega junto con las credenciales, y una credencial de un ambiente
          no funciona en otro.

tags:
  - name: Comercios
    description: Inscripción de autopagos desde un comercio.
  - name: Emisores
    description: Sesiones de tarjetahabientes iniciadas desde un emisor.
  - name: Administración
    description: Configuración de comercios, sitios y socios en PAR.

paths:
  /restpatpass/v1/services/patInscription:
    post:
      tags:
        - Comercios
      summary: Solicitar el token de inscripción
      operationId: merchant-inscription
      description: |
        Valida los datos del servicio y del tarjetahabiente y devuelve un token de un solo uso con la URL
        de inicio de sesión a la que el navegador del tarjetahabiente debe enviarlo.
      parameters:
        - $ref: '#/components/parameters/MerchantAuthorization'
        - $ref: '#/components/parameters/MerchantCommerceCode'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantInscriptionRequest'
            example:
              commerceCode: '1234567890'
              url: https://www.example.com/par/return
              finalUrl: https://www.example.com/par/final
              correoPersona: john.doe@example.com
              serviceId: CONTRACT-0001
      responses:
        '200':
          description: El token se emitió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantInscriptionResponse'
        '401':
          description: Faltan los headers de autenticación (`-110`) o la llave secreta no es válida (`-111`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '422':
          description: Algún dato no es válido. El `code` señala el campo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '429':
          description: Superaste el límite de peticiones. Responde con el código `-1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '500':
          description: Error inesperado en PAR. Responde con el código `-1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'

  /restpatpass/v1/services/status:
    post:
      tags:
        - Comercios
      summary: Consultar el estado de la inscripción
      operationId: merchant-inscription-status
      description: |
        Indica si el tarjetahabiente inició la sesión con el token y completó la inscripción de un
        autopago en el sitio del código de comercio.
      parameters:
        - $ref: '#/components/parameters/MerchantAuthorization'
        - $ref: '#/components/parameters/MerchantCommerceCode'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantStatusRequest'
            example:
              token: '{TOKEN}'
      responses:
        '200':
          description: |
            Resultado de la consulta. Responde `200` tanto si la inscripción quedó autorizada como si no.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStatusResponse'
        '401':
          description: Faltan los headers de autenticación (`-110`) o la llave secreta no es válida (`-111`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '422':
          description: El código de comercio no pertenece a un sitio activo de tu comercio (`-108`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '429':
          description: Superaste el límite de peticiones. Responde con el código `-1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '500':
          description: Error inesperado en PAR. Responde con el código `-1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'

  /restpatpass/login:
    post:
      tags:
        - Comercios
      summary: Iniciar la sesión de inscripción
      operationId: merchant-login
      description: |
        La llama el **navegador del tarjetahabiente** con un formulario `POST`, nunca tu servidor. PAR
        consume el token, abre la sesión y lleva al tarjetahabiente a inscribir el autopago.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantTokenForm'
      responses:
        '200':
          description: |
            Página de PAR que entrega la sesión al navegador y continúa con la inscripción. Si el inicio
            de sesión falla, la página informa al tarjetahabiente que no se pudo iniciar.
        '403':
          description: El token falta, no existe, ya se usó, venció o fue revocado.
        '429':
          description: Se superó el límite de intentos de inicio de sesión.

  /nuevo-ic-rest/tokenVoucherLogin:
    post:
      tags:
        - Comercios
      summary: Mostrar el comprobante del autopago
      operationId: merchant-voucher
      description: |
        La llama el **navegador del tarjetahabiente** con un formulario `POST`. Muestra el comprobante del
        autopago inscrito con el token y se puede abrir más de una vez mientras la inscripción siga
        autorizada.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantTokenForm'
      responses:
        '200':
          description: Página de PAR con el comprobante del autopago.
        '403':
          description: El token falta o no corresponde a una inscripción autorizada de un comercio.
        '429':
          description: Se superó el límite de consultas del comprobante.

  /nuevopat/SolicitaTkn:
    post:
      tags:
        - Emisores
      summary: Solicitar el token del tarjetahabiente
      operationId: issuer-create-token
      description: |
        Valida las credenciales del emisor, el documento del tarjetahabiente y sus tarjetas, y devuelve
        un token de un solo uso en un mensaje XML.

        Los errores también responden HTTP `200`: lee siempre `Coderror`. Solo el límite de peticiones
        responde HTTP `429`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssuerTokenForm'
            example:
              TBKPatData: '<TBKPatData><Perfil><NombreUsuario>{USERNAME}</NombreUsuario><ContrasenaUsuario>{PASSWORD}</ContrasenaUsuario></Perfil><DatosUsuario><RutUsuario>11.111.111-1</RutUsuario></DatosUsuario><DatosTarjetas><NumeroTarjeta>4111111111111111</NumeroTarjeta></DatosTarjetas><IP>203.0.113.10</IP></TBKPatData>'
      responses:
        '200':
          description: |
            Resultado de la solicitud. `Coderror` vale `0` y trae `Token` si se emitió; cualquier otro valor
            es un error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/IssuerTokenResponse'
        '429':
          description: Superaste el límite de peticiones. Responde con `Coderror` `1000`.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/IssuerTokenResponse'

  /nuevopat/tokenLogin:
    post:
      tags:
        - Emisores
      summary: Iniciar la sesión del tarjetahabiente
      operationId: issuer-login
      description: |
        La llama el **navegador del tarjetahabiente** con un formulario `POST`, nunca tu servidor. PAR
        consume el token y abre una sesión limitada a las tarjetas que el emisor envió.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssuerLoginForm'
      responses:
        '200':
          description: |
            Página de PAR que entrega la sesión al navegador. Si el inicio de sesión falla y no se envió una
            `direccionError` válida, la página informa al tarjetahabiente que no se pudo iniciar.
        '302':
          description: El inicio de sesión falló y PAR redirige al tarjetahabiente a la `direccionError`.
        '403':
          description: El token falta, no existe, ya se usó, venció o fue revocado.
        '429':
          description: Se superó el límite de intentos de inicio de sesión.

  /api/merchants/{coreId}:
    parameters:
      - name: coreId
        in: path
        required: true
        description: Identificador del comercio. Debe ser numérico y coincidir con `merchant.coreId` del cuerpo.
        schema:
          type: integer
          minimum: 1
          example: 10
    put:
      tags:
        - Administración
      summary: Sincronizar un comercio
      operationId: admin-sync-merchant
      description: |
        Crea el comercio en PAR o actualiza el que ya existe con ese `coreId`, junto con su socio de tipo
        comercio. La operación es idempotente: enviar el mismo contenido varias veces deja el mismo
        resultado.

        El comercio queda activo solo si `merchant.status` es `ACTIVE` **y** `settings.enabled` es
        `true`. Si queda inactivo, o si cambia su `authorizationCode`, PAR revoca las sesiones abiertas de
        su socio.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMerchantRequest'
            example:
              issuer: operator@example.com
              locale: es
              merchant:
                coreId: 10
                name: Comercio de prueba
                authorizationCode: MerchantSecret123
                documentType: NIT
                document: '900123456'
                city: Santiago
                country: CL
                status: ACTIVE
              settings:
                enabled: true
                requiresAutopayApproval: true
                notificationEmail: notifications@example.com
      responses:
        '200':
          description: El comercio quedó sincronizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMerchantResponse'
        '401':
          description: El token falta o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: El token no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: Algún dato no es válido. `status.errors` indica cuáles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'

  /api/sites/{coreId}:
    parameters:
      - name: coreId
        in: path
        required: true
        description: Identificador del sitio. Debe ser numérico y coincidir con `site.coreId` del cuerpo.
        schema:
          type: integer
          minimum: 1
          example: 20
    put:
      tags:
        - Administración
      summary: Sincronizar un sitio
      operationId: admin-sync-site
      description: |
        Crea el sitio en PAR o actualiza el que ya existe con ese `coreId`. El comercio al que pertenece
        (`site.merchantId`) debe estar sincronizado antes.

        El sitio queda activo solo si `site.status` es `ACTIVE` **y** `settings.enabled` es `true`.
        Si no envías `site.commerceCode`, PAR conserva el del sitio o genera uno nuevo, y lo devuelve en la
        respuesta. Ese es el código que el comercio envía en el header `Commercecode`.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSiteRequest'
            example:
              issuer: operator@example.com
              locale: es
              site:
                coreId: 20
                merchantId: 10
                commerceCode: COM-000123
                login: aabbccdd1234567890aabbccdd123456
                tranKey: exampleTranKey16
                name: Sitio de prueba
                currency: CLP
                status: ACTIVE
              settings:
                enabled: true
                paymentMode: TOTAL_BALANCE
                allowedCurrencies:
                  - CLP
                frequency: M
                allowedIntervals:
                  - 1
                allowedDays:
                  - 5
                  - 15
                expirationRules:
                  editable: true
      responses:
        '200':
          description: El sitio quedó sincronizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSiteResponse'
        '401':
          description: El token falta o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: El token no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: Algún dato no es válido, o el comercio del sitio no existe. `status.errors` indica cuáles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'

  /api/partners:
    post:
      tags:
        - Administración
      summary: Listar socios
      operationId: admin-list-partners
      description: |
        Devuelve los socios paginados, del más reciente al más antiguo. Es un `POST` porque los filtros
        viajan en el cuerpo; no modifica nada. Sin filtros, devuelve todos los socios.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPartnerListRequest'
            example:
              filters:
                status:
                  - ACTIVE
                type: issuer
                name: Banco
              page: 1
              perPage: 20
      responses:
        '200':
          description: Página de socios que cumplen los filtros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerListResponse'
        '401':
          description: El token falta o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: El token no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: Algún filtro no es válido. `status.errors` indica cuáles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'

  /api/partners/store:
    post:
      tags:
        - Administración
      summary: Crear un socio emisor
      operationId: admin-create-partner
      description: |
        Crea un socio de tipo `issuer`. Los socios de tipo comercio no se crean aquí: nacen al
        [sincronizar el comercio](/par/api/reference/administration#sync-merchant).

        Si no envías `code` ni `secretKey`, PAR los genera y los devuelve en la respuesta.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPartnerRequest'
            example:
              name: Banco de prueba
              type: issuer
              userDocumentType: CLRUT
              enabled: true
              allowedIps:
                - 192.0.2.10
              allowedFrameOrigins:
                - https://www.example.com
      responses:
        '201':
          description: El socio quedó creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerResponse'
        '401':
          description: El token falta o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: El token no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: Algún dato no es válido. `status.errors` indica cuáles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'

  /api/partners/{partnerId}:
    parameters:
      - name: partnerId
        in: path
        required: true
        description: Identificador del socio, tal como lo devuelve `data.id`. Debe ser numérico.
        schema:
          type: integer
          minimum: 1
          example: 7
    get:
      tags:
        - Administración
      summary: Consultar un socio
      operationId: admin-show-partner
      description: Devuelve la configuración de un socio, incluida su llave secreta.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: El socio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerResponse'
        '401':
          description: El token falta o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: El token no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '404':
          description: No existe un socio con ese identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
    post:
      tags:
        - Administración
      summary: Actualizar un socio emisor
      operationId: admin-update-partner
      description: |
        Reemplaza la configuración de un socio de tipo `issuer`: envía siempre todos los campos
        obligatorios, no solo los que cambian. Los socios de tipo comercio no se actualizan aquí, sino al
        [sincronizar el comercio](/par/api/reference/administration#sync-merchant).

        PAR revoca las sesiones abiertas del socio si cambias su `secretKey`, o si lo desactivas con
        `enabled: false`.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPartnerRequest'
            example:
              name: Banco de prueba
              type: issuer
              userDocumentType: CLRUT
              enabled: true
              allowedIps:
                - 192.0.2.10
              allowedFrameOrigins:
                - https://www.example.com
              secretKey: NewSecret123456
      responses:
        '200':
          description: El socio quedó actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerResponse'
        '401':
          description: El token falta o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: El token no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '404':
          description: No existe un socio con ese identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: |
            Algún dato no es válido, o el socio es de tipo comercio. `status.errors` indica los campos
            inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'
    delete:
      tags:
        - Administración
      summary: Eliminar un socio
      operationId: admin-delete-partner
      description: |
        Elimina el socio y revoca todas sus sesiones abiertas. A partir de ese momento sus credenciales
        dejan de funcionar.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: El socio quedó eliminado. La respuesta no trae cuerpo.
        '401':
          description: El token falta o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: El token no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '404':
          description: No existe un socio con ese identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'

components:
  parameters:
    MerchantAuthorization:
      name: Authorization
      in: header
      required: true
      description: Llave secreta de tu comercio, tal como la recibiste y sin ningún prefijo.
      schema:
        type: string
        example: '{TU_LLAVE_SECRETA}'
    MerchantCommerceCode:
      name: Commercecode
      in: header
      required: true
      description: Código de comercio del sitio con el que se inscriben los autopagos.
      schema:
        type: string
        example: '1234567890'
    AdminAuthorization:
      name: Authorization
      in: header
      required: true
      description: |
        Token de acceso que te entregó Placetopay, enviado como _bearer token_.
      schema:
        type: string
        example: Bearer 1|tu-token-de-acceso
    ContentType:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        example: application/json
    Accept:
      name: Accept
      in: header
      required: false
      schema:
        type: string
        example: application/json

  schemas:
    MerchantInscriptionRequest:
      type: object
      required:
        - commerceCode
        - url
        - finalUrl
        - correoPersona
        - serviceId
      properties:
        commerceCode:
          type: string
          description: Código de comercio de tu sitio. Debe ser idéntico al header `Commercecode`.
          example: '1234567890'
        url:
          type: string
          format: uri
          description: |
            URL de retorno. Al terminar la inscripción, PAR envía a esta dirección un formulario `POST` con
            el token en el campo `j_token`. Debe ser una URL pública.
          example: https://www.example.com/par/return
        finalUrl:
          type: string
          format: uri
          description: |
            URL final. Al salir del comprobante, PAR envía a esta dirección un formulario `POST` con el
            token en el campo `j_token`. Debe ser una URL pública.
          example: https://www.example.com/par/final
        correoPersona:
          type: string
          format: email
          description: |
            Correo electrónico del tarjetahabiente. Si ya tiene una cuenta en PAR con ese correo, la sesión
            se abre con su cuenta.
          example: john.doe@example.com
        serviceId:
          type: string
          maxLength: 32
          description: |
            Identificador del servicio que se cobrará. La persona no puede tener otro autopago activo con
            el mismo identificador en tu sitio.
          example: CONTRACT-0001
        rut:
          type: string
          maxLength: 10
          description: Documento de identidad del tarjetahabiente. Prellena el formulario.
          example: 11111111-1
        nombre:
          type: string
          maxLength: 60
          description: Nombre del tarjetahabiente. Prellena el formulario.
          example: John
        pApellido:
          type: string
          maxLength: 60
          description: Primer apellido del tarjetahabiente. Prellena el formulario.
          example: Doe
        sApellido:
          type: string
          maxLength: 60
          description: Segundo apellido del tarjetahabiente. Prellena el formulario.
          example: Smith
        montoMaximo:
          type: number
          minimum: 0
          description: Monto máximo que el autopago podrá cobrar. Prellena el formulario.
          example: 50000
        telefonoCelular:
          type: string
          maxLength: 50
          description: |
            Teléfono celular del tarjetahabiente. Prellena el formulario. Si no es un número válido, PAR lo
            ignora.
          example: '+56912345678'
        telefonoFijo:
          type: string
          maxLength: 50
          description: Teléfono fijo del tarjetahabiente. Si no es un número válido, PAR lo ignora.
          example: '+56221234567'
        nombrePatPass:
          type: string
          maxLength: 100
          description: Nombre con el que el tarjetahabiente reconocerá el autopago. Prellena el formulario.
          example: Plan mensual
        correoComercio:
          type: string
          maxLength: 100
          description: Correo de contacto del comercio.
          example: billing@example.com
        direccion:
          type: string
          maxLength: 100
          description: Dirección asociada a la inscripción.
          example: 123 Main Street
        ciudad:
          type: string
          maxLength: 100
          description: Ciudad asociada a la inscripción.
          example: Santiago

    MerchantInscriptionResponse:
      type: object
      required:
        - token
        - url
      properties:
        token:
          type: string
          description: |
            Token de un solo uso. Consérvalo: lo necesitas para la consulta de estado y el comprobante.
          example: '{TOKEN}'
        url:
          type: string
          format: uri
          description: URL de inicio de sesión a la que el navegador del tarjetahabiente debe enviar el token.
          example: https://par.example.com/restpatpass/login

    MerchantStatusRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: El token que recibiste al solicitar la inscripción y que PAR te devolvió en `j_token`.
          example: '{TOKEN}'

    MerchantStatusResponse:
      type: object
      required:
        - authorized
        - voucherUrl
      properties:
        authorized:
          type: boolean
          description: |
            `true` si el tarjetahabiente completó la inscripción con ese token en tu sitio. Confirma que el
            autopago se inscribió, no su estado actual.
          example: true
        voucherUrl:
          type:
            - string
            - 'null'
          format: uri
          description: URL del comprobante del autopago. Solo viene cuando `authorized` es `true`.
          example: https://par.example.com/nuevo-ic-rest/tokenVoucherLogin

    MerchantTokenForm:
      type: object
      required:
        - tokenComercio
      properties:
        tokenComercio:
          type: string
          description: El token que recibiste al solicitar la inscripción.
          example: '{TOKEN}'

    MerchantError:
      type: object
      required:
        - code
        - description
      properties:
        code:
          type: integer
          description: |
            Código del error. Es el valor que debes usar para decidir qué hacer; el catálogo completo está
            en la guía de errores para comercios.
          enum:
            - -1
            - -101
            - -102
            - -103
            - -104
            - -105
            - -106
            - -107
            - -108
            - -109
            - -110
            - -111
            - -112
            - -113
            - -114
            - -115
            - -116
            - -117
            - -900
          example: -107
        description:
          type: string
          description: Texto informativo que acompaña al código. Puede cambiar; no lo uses para tomar decisiones.
          example: Id de Servicio incorrecto

    IssuerTokenForm:
      type: object
      required:
        - TBKPatData
      properties:
        TBKPatData:
          type: string
          description: |
            Mensaje XML con el elemento raíz `TBKPatData`. Incluye `Perfil` (`NombreUsuario` y
            `ContrasenaUsuario`), `DatosUsuario.RutUsuario`, `DatosTarjetas` con hasta 5 `NumeroTarjeta`,
            `IP` y, opcionalmente, `DuracionToken` y `DataAuditoriaUsuario`. El detalle de cada campo está
            en la guía para solicitar el token.
          example: '<TBKPatData><Perfil><NombreUsuario>{USERNAME}</NombreUsuario><ContrasenaUsuario>{PASSWORD}</ContrasenaUsuario></Perfil><DatosUsuario><RutUsuario>11.111.111-1</RutUsuario></DatosUsuario><DatosTarjetas><NumeroTarjeta>4111111111111111</NumeroTarjeta></DatosTarjetas><IP>203.0.113.10</IP></TBKPatData>'

    IssuerTokenResponse:
      type: object
      xml:
        name: Mensaje
      required:
        - Coderror
        - Descerror
      properties:
        Coderror:
          type: string
          description: Código del resultado. `0` indica éxito.
          enum:
            - '0'
            - '1'
            - '100'
            - '1000'
            - '1001'
            - '1007'
          example: '0'
        Descerror:
          type: string
          maxLength: 80
          description: Texto informativo que acompaña al código, de hasta 80 caracteres. Puede cambiar.
          example: EXITO
        Token:
          type: string
          description: Token de un solo uso. Solo viene cuando `Coderror` es `0`.
          example: '{TOKEN}'

    IssuerLoginForm:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: El token de un solo uso que PAR devolvió en `Token`.
          example: '{TOKEN}'
        direccionRegreso:
          type: string
          format: uri
          description: URL de retorno que PAR ofrece al tarjetahabiente. Debe pertenecer a un origen autorizado para el emisor.
          example: https://www.example.com/par/return
        direccionError:
          type: string
          format: uri
          description: URL a la que PAR envía al tarjetahabiente si el inicio de sesión falla. Debe pertenecer a un origen autorizado para el emisor.
          example: https://www.example.com/par/error
        style:
          type: string
          format: uri
          description: URL de una hoja de estilos del emisor.
          example: https://www.example.com/par/styles.css
        imagen:
          type: string
          format: uri
          description: URL de una imagen del emisor.
          example: https://www.example.com/par/logo.png

    AdminStatus:
      type: object
      required:
        - status
        - reason
        - message
        - date
      properties:
        status:
          type: string
          description: Resultado de la petición. `OK` si se procesó y `FAILED` si no.
          enum:
            - OK
            - FAILED
          example: OK
        reason:
          type: string
          description: |
            Código del motivo. `00` es una petición procesada; `BR`, una petición no válida; `86`, un
            problema de autenticación o permisos; y `X3`, un recurso que no existe.
          example: '00'
        message:
          type: string
          description: Texto informativo que acompaña al código. Puede cambiar; no lo uses para tomar decisiones.
          example: La petición se ha procesado correctamente
        date:
          type: string
          format: date-time
          description: Fecha y hora de la respuesta.
          example: '2026-01-15T10:30:00-05:00'

    AdminFailure:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'

    AdminValidationFailure:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/AdminStatus'
            - type: object
              required:
                - errors
              properties:
                errors:
                  type: object
                  description: |
                    Los mensajes de validación agrupados por campo. La clave es la ruta del campo, por
                    ejemplo `merchant.name` o `allowedIps.0`, y el valor, la lista de sus mensajes.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  example:
                    merchant.name:
                      - El campo merchant.name es obligatorio.

    AdminMerchantRequest:
      type: object
      required:
        - issuer
        - merchant
        - settings
      properties:
        issuer:
          type: string
          maxLength: 255
          description: Identifica a quien hace el cambio.
          example: operator@example.com
        locale:
          type:
            - string
            - 'null'
          maxLength: 10
          description: Idioma del comercio.
          example: es
        merchant:
          type: object
          required:
            - coreId
            - name
            - status
          properties:
            coreId:
              type: integer
              description: Identificador del comercio. Debe ser igual al de la ruta.
              example: 10
            name:
              type: string
              maxLength: 80
              description: Nombre del comercio.
              example: Comercio de prueba
            authorizationCode:
              type:
                - string
                - 'null'
              maxLength: 255
              description: |
                Llave secreta del socio del comercio, la que envía en el header `Authorization`. Si no la
                envías en la primera sincronización, PAR genera una. Si ya existe, solo la cambia si la
                envías con otro valor, y cambiarla revoca las sesiones abiertas. No puede estar en uso por
                otro socio.
              example: MerchantSecret123
            documentType:
              type:
                - string
                - 'null'
              maxLength: 10
              description: Tipo de documento del comercio.
              example: NIT
            document:
              type:
                - string
                - 'null'
              maxLength: 20
              description: Número de documento del comercio.
              example: '900123456'
            city:
              type:
                - string
                - 'null'
              maxLength: 30
              description: Ciudad del comercio.
              example: Santiago
            country:
              type:
                - string
                - 'null'
              minLength: 2
              maxLength: 2
              description: País del comercio, con el código ISO de 2 letras.
              example: CL
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
              description: Estado del comercio.
              example: ACTIVE
        settings:
          type: object
          required:
            - enabled
          properties:
            enabled:
              type: boolean
              description: |
                Habilita al comercio en PAR. Para que quede activo también debe llegar
                `merchant.status` en `ACTIVE`.
              example: true
            requiresAutopayApproval:
              type: boolean
              description: Indica si los autopagos nuevos del comercio requieren aprobación antes de activarse.
              example: true
            notificationEmail:
              type:
                - string
                - 'null'
              format: email
              maxLength: 80
              description: Correo al que PAR envía los avisos del comercio.
              example: notifications@example.com
            logoUrl:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
              description: URL del logo que PAR muestra al tarjetahabiente.
              example: https://www.example.com/logo.png
            termsDocumentUrl:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
              description: URL del documento de términos y condiciones del comercio.
              example: https://www.example.com/terms.pdf

    AdminMerchantResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        data:
          type: object
          required:
            - coreId
            - status
            - authorizationCode
          properties:
            coreId:
              type: integer
              description: Identificador del comercio.
              example: 10
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
              description: Estado en que quedó el comercio en PAR.
              example: ACTIVE
            authorizationCode:
              type: string
              description: Llave secreta del socio del comercio. Entrégasela al comercio para su header `Authorization`.
              example: MerchantSecret123

    AdminSiteRequest:
      type: object
      required:
        - issuer
        - site
        - settings
      properties:
        issuer:
          type: string
          maxLength: 255
          description: Identifica a quien hace el cambio.
          example: operator@example.com
        locale:
          type:
            - string
            - 'null'
          maxLength: 10
          description: Idioma del sitio.
          example: es
        site:
          type: object
          required:
            - coreId
            - merchantId
            - login
            - tranKey
            - name
            - currency
            - status
          properties:
            coreId:
              type: integer
              description: Identificador del sitio. Debe ser igual al de la ruta.
              example: 20
            merchantId:
              type: integer
              description: '`coreId` del comercio al que pertenece el sitio. El comercio debe existir en PAR.'
              example: 10
            commerceCode:
              type:
                - string
                - 'null'
              maxLength: 20
              description: |
                Código de comercio del sitio, el que el comercio envía en el header `Commercecode`. Si no
                lo envías, PAR conserva el actual o genera uno. No puede estar en uso por otro sitio.
              example: COM-000123
            login:
              type: string
              maxLength: 32
              description: Credencial `login` del sitio en Placetopay.
              example: aabbccdd1234567890aabbccdd123456
            tranKey:
              type: string
              maxLength: 32
              description: Credencial `tranKey` del sitio en Placetopay.
              example: exampleTranKey16
            name:
              type: string
              maxLength: 128
              description: Nombre del sitio.
              example: Sitio de prueba
            displayName:
              type:
                - string
                - 'null'
              maxLength: 128
              description: Nombre con el que PAR muestra el sitio al tarjetahabiente.
              example: Mi tienda
            currency:
              type: string
              minLength: 3
              maxLength: 3
              description: Moneda del sitio, con el código ISO de 3 letras.
              example: CLP
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
              description: Estado del sitio.
              example: ACTIVE
        settings:
          type: object
          required:
            - enabled
            - paymentMode
            - allowedCurrencies
            - frequency
            - allowedIntervals
            - expirationRules
          properties:
            enabled:
              type: boolean
              description: |
                Habilita el sitio en PAR. Para que quede activo también debe llegar `site.status` en
                `ACTIVE`.
              example: true
            requiresApproval:
              type: boolean
              description: Indica si los autopagos nuevos del sitio requieren aprobación antes de activarse.
              example: false
            paymentMode:
              type: string
              enum:
                - FIXED
                - TOTAL_BALANCE
                - MINIMUM_BALANCE
              description: |
                Cómo se calcula cada cobro: `FIXED` cobra un monto fijo, `TOTAL_BALANCE` el saldo total y
                `MINIMUM_BALANCE` el saldo mínimo.
              example: TOTAL_BALANCE
            maxAmountEnabled:
              type:
                - boolean
                - 'null'
              description: Permite al tarjetahabiente definir un monto máximo por cobro. No se puede enviar con `paymentMode` `FIXED`.
              example: true
            maxAmountLabel:
              type:
                - string
                - 'null'
              maxLength: 60
              description: Texto con el que PAR pide el monto máximo. No se puede enviar con `paymentMode` `FIXED`.
              example: Monto máximo por cobro
            allowedCurrencies:
              type: array
              minItems: 1
              description: Monedas en las que se pueden cobrar los autopagos, con códigos ISO de 3 letras en mayúscula.
              items:
                type: string
                pattern: '^[A-Z]{3}$'
              example:
                - CLP
            frequency:
              type: string
              enum:
                - D
                - W
                - M
                - Y
              description: Frecuencia de los cobros. `D` es diaria, `W` semanal, `M` mensual y `Y` anual.
              example: M
            allowedIntervals:
              type: array
              minItems: 1
              description: |
                Cada cuántos períodos de `frequency` se cobra. Por ejemplo, `[1, 3]` con frecuencia mensual
                permite cobrar cada mes o cada tres meses.
              items:
                type: integer
                minimum: 1
              example:
                - 1
            allowedDays:
              type:
                - array
                - 'null'
              minItems: 1
              description: |
                Días del mes en los que se puede cobrar. Solo se envía con `paymentMode` `FIXED` y
                `frequency` `M`; en cualquier otro caso no se puede enviar.
              items:
                type: integer
                minimum: 1
              example:
                - 5
                - 15
            expirationRules:
              type: object
              required:
                - editable
              description: Cuándo vence el autopago.
              properties:
                editable:
                  type: boolean
                  description: |
                    Si es `true`, el tarjetahabiente elige el vencimiento y no se envían `type` ni `value`.
                    Si es `false`, el vencimiento lo define el sitio y `type` es obligatorio.
                  example: false
                type:
                  type:
                    - string
                    - 'null'
                  enum:
                    - QUANTITY
                    - DATE
                    - UNLIMITED
                    - null
                  description: |
                    `QUANTITY` vence tras un número de cobros, `DATE` en una fecha y `UNLIMITED` no vence.
                  example: QUANTITY
                value:
                  type:
                    - integer
                    - string
                    - 'null'
                  description: |
                    Obligatorio con `QUANTITY`, como el número de cobros, y con `DATE`, como una fecha
                    futura en formato `YYYY-MM-DD`. Con `UNLIMITED` no se envía.
                  example: 12
            category:
              type:
                - string
                - 'null'
              maxLength: 80
              description: Categoría del servicio que cobra el sitio.
              example: Servicios
            subcategory:
              type:
                - string
                - 'null'
              maxLength: 80
              description: Subcategoría del servicio que cobra el sitio.
              example: Suscripciones
            referenceRules:
              type:
                - string
                - 'null'
              maxLength: 100
              description: Expresión regular que debe cumplir la referencia del autopago. Debe ser una expresión válida.
              example: '^[0-9]{8}$'
            referenceGuideUrl:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
              description: URL de una guía que explica al tarjetahabiente dónde encontrar su referencia.
              example: https://www.example.com/reference-guide
            allowCaptureDetainer:
              type: boolean
              description: Permite capturar el retenedor del autopago.
              example: false
            detainerTag:
              type:
                - string
                - 'null'
              maxLength: 100
              description: Texto con el que PAR pide el retenedor.
              example: Código de retenedor
            termsAndConditions:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 255
              description: URL de los términos y condiciones del sitio.
              example: https://www.example.com/terms

    AdminSiteResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        data:
          type: object
          required:
            - coreId
            - status
            - commerceCode
          properties:
            coreId:
              type: integer
              description: Identificador del sitio.
              example: 20
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
              description: Estado en que quedó el sitio en PAR.
              example: ACTIVE
            commerceCode:
              type: string
              description: Código de comercio del sitio. Entrégaselo al comercio para su header `Commercecode`.
              example: COM-000123

    AdminPartnerListRequest:
      type: object
      properties:
        filters:
          type: object
          description: Filtros opcionales. No se admiten otras claves.
          properties:
            status:
              type: array
              description: Estados a incluir.
              items:
                type: string
                enum:
                  - ACTIVE
                  - INACTIVE
              example:
                - ACTIVE
            type:
              type: string
              enum:
                - issuer
                - merchant
              description: Tipo de socio.
              example: issuer
            name:
              type: string
              maxLength: 128
              description: Texto que debe contener el nombre del socio.
              example: Banco
            code:
              type: string
              maxLength: 20
              description: Código exacto del socio.
              example: PARTNER-0001
        page:
          type: integer
          minimum: 1
          description: Número de la página. Por defecto, la primera.
          example: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
          description: Socios por página, hasta 100. Si no lo envías, PAR usa el valor por defecto del ambiente.
          example: 20

    AdminPartnerRequest:
      type: object
      required:
        - name
        - type
        - userDocumentType
        - enabled
        - allowedIps
      properties:
        name:
          type: string
          maxLength: 128
          description: Nombre del socio.
          example: Banco de prueba
        type:
          type: string
          enum:
            - issuer
          description: Tipo de socio. Solo se admite `issuer`.
          example: issuer
        userDocumentType:
          type: string
          description: Tipo de documento de los tarjetahabientes del emisor, como `CLRUT`. Debe ser un tipo de documento soportado.
          example: CLRUT
        enabled:
          type: boolean
          description: Indica si el socio está activo. Un socio inactivo no puede solicitar tokens.
          example: true
        allowedIps:
          type: array
          minItems: 1
          description: |
            Direcciones IP desde las que el socio puede solicitar tokens. Debe incluir al menos una,
            sin repetidas.
          items:
            type: string
            format: ip
          example:
            - 192.0.2.10
        allowedFrameOrigins:
          type:
            - array
            - 'null'
          description: |
            Orígenes de los sitios del socio autorizados para mostrar PAR en un `iframe`. Cada uno lleva solo
            esquema, host y puerto opcional, sin ruta.
          items:
            type: string
            format: uri
            maxLength: 2048
          example:
            - https://www.example.com
        code:
          type: string
          maxLength: 20
          description: Código único del socio. Si no lo envías al crearlo, PAR genera uno; al actualizar, solo se cambia si lo envías.
          example: PARTNER-0001
        secretKey:
          type: string
          minLength: 15
          maxLength: 15
          pattern: '^[A-Za-z0-9]{15}$'
          description: |
            Llave secreta única del socio, de exactamente 15 letras y números. Si no la envías al crearlo,
            PAR genera una; al actualizar, solo se cambia si la envías, y cambiarla revoca las sesiones
            abiertas.
          example: NewSecret123456

    AdminPartner:
      type: object
      required:
        - id
        - merchantId
        - name
        - code
        - secretKey
        - type
        - userDocumentType
        - allowedIps
        - allowedFrameOrigins
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          description: Identificador del socio.
          example: 7
        merchantId:
          type:
            - integer
            - 'null'
          description: Identificador interno del comercio, solo en socios de tipo comercio.
          example: null
        name:
          type: string
          description: Nombre del socio.
          example: Banco de prueba
        code:
          type: string
          description: Código del socio.
          example: PARTNER-0001
        secretKey:
          type: string
          description: Llave secreta del socio.
          example: NewSecret123456
        type:
          type: string
          enum:
            - issuer
            - merchant
          description: Tipo de socio.
          example: issuer
        userDocumentType:
          type:
            - string
            - 'null'
          description: Tipo de documento de los tarjetahabientes del emisor.
          example: CLRUT
        allowedIps:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Direcciones IP autorizadas.
          example:
            - 192.0.2.10
        allowedFrameOrigins:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Orígenes autorizados para mostrar PAR en un `iframe`.
          example:
            - https://www.example.com
        enabled:
          type: boolean
          description: Indica si el socio está activo.
          example: true
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación.
          example: '2026-01-15T10:30:00.000000Z'
        updatedAt:
          type: string
          format: date-time
          description: Fecha de la última actualización.
          example: '2026-01-15T10:30:00.000000Z'

    AdminPartnerResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        data:
          $ref: '#/components/schemas/AdminPartner'

    AdminPartnerListResponse:
      type: object
      required:
        - status
        - data
        - meta
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminPartner'
        meta:
          type: object
          required:
            - page
