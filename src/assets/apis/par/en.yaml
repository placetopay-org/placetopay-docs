openapi: 3.1.0
info:
  title: Placetopay PAR API
  description: |
    API to integrate merchants and issuers with PAR, the portal where cardholders enroll their cards
    and manage their autopays.

    Your server requests a single-use token and the cardholder's browser presents it to PAR to start
    the session in which they enroll the autopay.
  version: 1.0.0

servers:
  - url: '{urlBase}'
    description: Working environment
    variables:
      urlBase:
        default: https://par.example.com
        description: |
          Base URL of the environment. It is delivered with the credentials, and a credential from one
          environment does not work in another.

tags:
  - name: Merchants
    description: Autopay enrollment from a merchant.
  - name: Issuers
    description: Cardholder sessions started from an issuer.
  - name: Administration
    description: Configuration of merchants, sites and partners in PAR.

paths:
  /restpatpass/v1/services/patInscription:
    post:
      tags:
        - Merchants
      summary: Request the enrollment token
      operationId: merchant-inscription
      description: |
        Validates the service and cardholder data and returns a single-use token with the login URL where
        the cardholder's browser must send it.
      parameters:
        - $ref: '#/components/parameters/MerchantAuthorization'
        - $ref: '#/components/parameters/MerchantCommerceCode'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantInscriptionRequest'
            example:
              commerceCode: '1234567890'
              url: https://www.example.com/par/return
              finalUrl: https://www.example.com/par/final
              correoPersona: john.doe@example.com
              serviceId: CONTRACT-0001
      responses:
        '200':
          description: The token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantInscriptionResponse'
        '401':
          description: The authentication headers are missing (`-110`) or the secret key is invalid (`-111`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '422':
          description: Some data is invalid. The `code` points to the field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '429':
          description: You exceeded the request limit. It answers with code `-1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '500':
          description: Unexpected error in PAR. It answers with code `-1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'

  /restpatpass/v1/services/status:
    post:
      tags:
        - Merchants
      summary: Check the enrollment status
      operationId: merchant-inscription-status
      description: |
        Tells whether the cardholder started the session with the token and completed the enrollment of
        an autopay on the site of the commerce code.
      parameters:
        - $ref: '#/components/parameters/MerchantAuthorization'
        - $ref: '#/components/parameters/MerchantCommerceCode'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantStatusRequest'
            example:
              token: '{TOKEN}'
      responses:
        '200':
          description: |
            Result of the check. It answers `200` whether the enrollment was authorized or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStatusResponse'
        '401':
          description: The authentication headers are missing (`-110`) or the secret key is invalid (`-111`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '422':
          description: The commerce code does not belong to an active site of your merchant (`-108`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '429':
          description: You exceeded the request limit. It answers with code `-1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'
        '500':
          description: Unexpected error in PAR. It answers with code `-1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantError'

  /restpatpass/login:
    post:
      tags:
        - Merchants
      summary: Start the enrollment session
      operationId: merchant-login
      description: |
        Called by the **cardholder's browser** with a `POST` form, never by your server. PAR consumes the
        token, opens the session and takes the cardholder to enroll the autopay.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantTokenForm'
      responses:
        '200':
          description: |
            PAR page that hands the session over to the browser and continues with the enrollment. If the
            login fails, the page tells the cardholder it could not be started.
        '403':
          description: The token is missing, does not exist, was already used, expired or was revoked.
        '429':
          description: The login attempt limit was exceeded.

  /nuevo-ic-rest/tokenVoucherLogin:
    post:
      tags:
        - Merchants
      summary: Show the autopay voucher
      operationId: merchant-voucher
      description: |
        Called by the **cardholder's browser** with a `POST` form. It shows the voucher of the autopay
        enrolled with the token and can be opened more than once as long as the enrollment remains
        authorized.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantTokenForm'
      responses:
        '200':
          description: PAR page with the autopay voucher.
        '403':
          description: The token is missing or does not match an authorized merchant enrollment.
        '429':
          description: The voucher request limit was exceeded.

  /nuevopat/SolicitaTkn:
    post:
      tags:
        - Issuers
      summary: Request the cardholder token
      operationId: issuer-create-token
      description: |
        Validates the issuer credentials, the cardholder's document and their cards, and returns a
        single-use token in an XML message.

        Errors also answer HTTP `200`: always read `Coderror`. Only the request limit answers HTTP
        `429`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssuerTokenForm'
            example:
              TBKPatData: '<TBKPatData><Perfil><NombreUsuario>{USERNAME}</NombreUsuario><ContrasenaUsuario>{PASSWORD}</ContrasenaUsuario></Perfil><DatosUsuario><RutUsuario>11.111.111-1</RutUsuario></DatosUsuario><DatosTarjetas><NumeroTarjeta>4111111111111111</NumeroTarjeta></DatosTarjetas><IP>203.0.113.10</IP></TBKPatData>'
      responses:
        '200':
          description: |
            Result of the request. `Coderror` is `0` and includes `Token` if it was issued; any other value
            is an error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/IssuerTokenResponse'
        '429':
          description: You exceeded the request limit. It answers with `Coderror` `1000`.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/IssuerTokenResponse'

  /nuevopat/tokenLogin:
    post:
      tags:
        - Issuers
      summary: Start the cardholder session
      operationId: issuer-login
      description: |
        Called by the **cardholder's browser** with a `POST` form, never by your server. PAR consumes the
        token and opens a session limited to the cards the issuer sent.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssuerLoginForm'
      responses:
        '200':
          description: |
            PAR page that hands the session over to the browser. If the login fails and no valid
            `direccionError` was sent, the page tells the cardholder it could not be started.
        '302':
          description: The login failed and PAR redirects the cardholder to the `direccionError`.
        '403':
          description: The token is missing, does not exist, was already used, expired or was revoked.
        '429':
          description: The login attempt limit was exceeded.

  /api/merchants/{coreId}:
    parameters:
      - name: coreId
        in: path
        required: true
        description: Identifier of the merchant. It must be numeric and match `merchant.coreId` in the body.
        schema:
          type: integer
          minimum: 1
          example: 10
    put:
      tags:
        - Administration
      summary: Sync a merchant
      operationId: admin-sync-merchant
      description: |
        Creates the merchant in PAR or updates the one that already exists with that `coreId`, together with
        its merchant partner. The operation is idempotent: sending the same content several times leaves
        the same result.

        The merchant is active only if `merchant.status` is `ACTIVE` **and** `settings.enabled` is
        `true`. If it ends up inactive, or if its `authorizationCode` changes, PAR revokes the open
        sessions of its partner.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMerchantRequest'
            example:
              issuer: operator@example.com
              locale: en
              merchant:
                coreId: 10
                name: Test merchant
                authorizationCode: MerchantSecret123
                documentType: NIT
                document: '900123456'
                city: Santiago
                country: CL
                status: ACTIVE
              settings:
                enabled: true
                requiresAutopayApproval: true
                notificationEmail: notifications@example.com
      responses:
        '200':
          description: The merchant was synced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMerchantResponse'
        '401':
          description: The token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: The token does not have access to this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: Some data is not valid. `status.errors` says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'

  /api/sites/{coreId}:
    parameters:
      - name: coreId
        in: path
        required: true
        description: Identifier of the site. It must be numeric and match `site.coreId` in the body.
        schema:
          type: integer
          minimum: 1
          example: 20
    put:
      tags:
        - Administration
      summary: Sync a site
      operationId: admin-sync-site
      description: |
        Creates the site in PAR or updates the one that already exists with that `coreId`. The merchant it
        belongs to (`site.merchantId`) must be synced beforehand.

        The site is active only if `site.status` is `ACTIVE` **and** `settings.enabled` is `true`.
        If you do not send `site.commerceCode`, PAR keeps the site's current one or generates a new one, and
        returns it in the response. That is the code the merchant sends in the `Commercecode` header.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSiteRequest'
            example:
              issuer: operator@example.com
              locale: en
              site:
                coreId: 20
                merchantId: 10
                commerceCode: COM-000123
                login: aabbccdd1234567890aabbccdd123456
                tranKey: exampleTranKey16
                name: Test site
                currency: CLP
                status: ACTIVE
              settings:
                enabled: true
                paymentMode: TOTAL_BALANCE
                allowedCurrencies:
                  - CLP
                frequency: M
                allowedIntervals:
                  - 1
                allowedDays:
                  - 5
                  - 15
                expirationRules:
                  editable: true
      responses:
        '200':
          description: The site was synced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSiteResponse'
        '401':
          description: The token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: The token does not have access to this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: Some data is not valid, or the site's merchant does not exist. `status.errors` says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'

  /api/partners:
    post:
      tags:
        - Administration
      summary: List partners
      operationId: admin-list-partners
      description: |
        Returns the partners in pages, from newest to oldest. It is a `POST` because the filters travel in
        the body; it does not modify anything. Without filters, it returns every partner.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPartnerListRequest'
            example:
              filters:
                status:
                  - ACTIVE
                type: issuer
                name: Bank
              page: 1
              perPage: 20
      responses:
        '200':
          description: Page of partners that match the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerListResponse'
        '401':
          description: The token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: The token does not have access to this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: Some filter is not valid. `status.errors` says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'

  /api/partners/store:
    post:
      tags:
        - Administration
      summary: Create an issuer partner
      operationId: admin-create-partner
      description: |
        Creates a partner of type `issuer`. Merchant partners are not created here: they are born when
        you [sync the merchant](/en/par/api/reference/administration#sync-merchant).

        If you do not send `code` or `secretKey`, PAR generates them and returns them in the response.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPartnerRequest'
            example:
              name: Test bank
              type: issuer
              userDocumentType: CLRUT
              enabled: true
              allowedIps:
                - 192.0.2.10
              allowedFrameOrigins:
                - https://www.example.com
      responses:
        '201':
          description: The partner was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerResponse'
        '401':
          description: The token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: The token does not have access to this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: Some data is not valid. `status.errors` says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'

  /api/partners/{partnerId}:
    parameters:
      - name: partnerId
        in: path
        required: true
        description: Identifier of the partner, as returned in `data.id`. It must be numeric.
        schema:
          type: integer
          minimum: 1
          example: 7
    get:
      tags:
        - Administration
      summary: Get a partner
      operationId: admin-show-partner
      description: Returns the configuration of a partner, including its secret key.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: The partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerResponse'
        '401':
          description: The token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: The token does not have access to this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '404':
          description: No partner exists with that identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
    post:
      tags:
        - Administration
      summary: Update an issuer partner
      operationId: admin-update-partner
      description: |
        Replaces the configuration of a partner of type `issuer`: always send all the required fields, not
        just the ones that change. Merchant partners are not updated here, but when you
        [sync the merchant](/en/par/api/reference/administration#sync-merchant).

        PAR revokes the partner's open sessions if you change its `secretKey`, or if you deactivate it
        with `enabled: false`.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPartnerRequest'
            example:
              name: Test bank
              type: issuer
              userDocumentType: CLRUT
              enabled: true
              allowedIps:
                - 192.0.2.10
              allowedFrameOrigins:
                - https://www.example.com
              secretKey: NewSecret123456
      responses:
        '200':
          description: The partner was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerResponse'
        '401':
          description: The token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: The token does not have access to this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '404':
          description: No partner exists with that identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '422':
          description: |
            Some data is not valid, or the partner is a merchant partner. `status.errors` lists the invalid
            fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminValidationFailure'
    delete:
      tags:
        - Administration
      summary: Delete a partner
      operationId: admin-delete-partner
      description: |
        Deletes the partner and revokes all its open sessions. From that moment on, its credentials stop
        working.
      parameters:
        - $ref: '#/components/parameters/AdminAuthorization'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: The partner was deleted. The response has no body.
        '401':
          description: The token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '403':
          description: The token does not have access to this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'
        '404':
          description: No partner exists with that identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFailure'

components:
  parameters:
    MerchantAuthorization:
      name: Authorization
      in: header
      required: true
      description: Your merchant's secret key, exactly as you received it and without any prefix.
      schema:
        type: string
        example: '{YOUR_SECRET_KEY}'
    MerchantCommerceCode:
      name: Commercecode
      in: header
      required: true
      description: Commerce code of the site where autopays are enrolled.
      schema:
        type: string
        example: '1234567890'
    AdminAuthorization:
      name: Authorization
      in: header
      required: true
      description: |
        Access token that Placetopay gave you, sent as a _bearer token_.
      schema:
        type: string
        example: Bearer 1|your-access-token
    ContentType:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        example: application/json
    Accept:
      name: Accept
      in: header
      required: false
      schema:
        type: string
        example: application/json

  schemas:
    MerchantInscriptionRequest:
      type: object
      required:
        - commerceCode
        - url
        - finalUrl
        - correoPersona
        - serviceId
      properties:
        commerceCode:
          type: string
          description: Your site's commerce code. It must be identical to the `Commercecode` header.
          example: '1234567890'
        url:
          type: string
          format: uri
          description: |
            Return URL. When the enrollment finishes, PAR submits a `POST` form to this address with the
            token in the `j_token` field. It must be a public URL.
          example: https://www.example.com/par/return
        finalUrl:
          type: string
          format: uri
          description: |
            Final URL. When the cardholder leaves the voucher, PAR submits a `POST` form to this address
            with the token in the `j_token` field. It must be a public URL.
          example: https://www.example.com/par/final
        correoPersona:
          type: string
          format: email
          description: |
            The cardholder's email. If they already have a PAR account with that email, the session opens
            with their account.
          example: john.doe@example.com
        serviceId:
          type: string
          maxLength: 32
          description: |
            Identifier of the service to be charged. The person cannot have another active autopay with the
            same identifier on your site.
          example: CONTRACT-0001
        rut:
          type: string
          maxLength: 10
          description: The cardholder's identity document. Prefills the form.
          example: 11111111-1
        nombre:
          type: string
          maxLength: 60
          description: The cardholder's first name. Prefills the form.
          example: John
        pApellido:
          type: string
          maxLength: 60
          description: The cardholder's first surname. Prefills the form.
          example: Doe
        sApellido:
          type: string
          maxLength: 60
          description: The cardholder's second surname. Prefills the form.
          example: Smith
        montoMaximo:
          type: number
          minimum: 0
          description: Maximum amount the autopay can charge. Prefills the form.
          example: 50000
        telefonoCelular:
          type: string
          maxLength: 50
          description: |
            The cardholder's mobile phone. Prefills the form. If it is not a valid number, PAR ignores it.
          example: '+56912345678'
        telefonoFijo:
          type: string
          maxLength: 50
          description: The cardholder's landline phone. If it is not a valid number, PAR ignores it.
          example: '+56221234567'
        nombrePatPass:
          type: string
          maxLength: 100
          description: Name the cardholder will recognize the autopay by. Prefills the form.
          example: Monthly plan
        correoComercio:
          type: string
          maxLength: 100
          description: The merchant's contact email.
          example: billing@example.com
        direccion:
          type: string
          maxLength: 100
          description: Address associated with the enrollment.
          example: 123 Main Street
        ciudad:
          type: string
          maxLength: 100
          description: City associated with the enrollment.
          example: Santiago

    MerchantInscriptionResponse:
      type: object
      required:
        - token
        - url
      properties:
        token:
          type: string
          description: |
            Single-use token. Keep it: you need it for the status check and the voucher.
          example: '{TOKEN}'
        url:
          type: string
          format: uri
          description: Login URL where the cardholder's browser must send the token.
          example: https://par.example.com/restpatpass/login

    MerchantStatusRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The token you received when requesting the enrollment and that PAR returned to you in `j_token`.
          example: '{TOKEN}'

    MerchantStatusResponse:
      type: object
      required:
        - authorized
        - voucherUrl
      properties:
        authorized:
          type: boolean
          description: |
            `true` if the cardholder completed the enrollment with that token on your site. It confirms that
            the autopay was enrolled, not its current status.
          example: true
        voucherUrl:
          type:
            - string
            - 'null'
          format: uri
          description: URL of the autopay voucher. Only present when `authorized` is `true`.
          example: https://par.example.com/nuevo-ic-rest/tokenVoucherLogin

    MerchantTokenForm:
      type: object
      required:
        - tokenComercio
      properties:
        tokenComercio:
          type: string
          description: The token you received when requesting the enrollment.
          example: '{TOKEN}'

    MerchantError:
      type: object
      required:
        - code
        - description
      properties:
        code:
          type: integer
          description: |
            Error code. It is the value to use to decide what to do; the full catalog is in the merchant
            errors guide.
          enum:
            - -1
            - -101
            - -102
            - -103
            - -104
            - -105
            - -106
            - -107
            - -108
            - -109
            - -110
            - -111
            - -112
            - -113
            - -114
            - -115
            - -116
            - -117
            - -900
          example: -107
        description:
          type: string
          description: Informative text that accompanies the code. It may change; do not use it to make decisions.
          example: Invalid service ID

    IssuerTokenForm:
      type: object
      required:
        - TBKPatData
      properties:
        TBKPatData:
          type: string
          description: |
            XML message with the `TBKPatData` root element. It includes `Perfil` (`NombreUsuario` and
            `ContrasenaUsuario`), `DatosUsuario.RutUsuario`, `DatosTarjetas` with up to 5 `NumeroTarjeta`,
            `IP` and, optionally, `DuracionToken` and `DataAuditoriaUsuario`. Each field is detailed in the
            guide to request the token.
          example: '<TBKPatData><Perfil><NombreUsuario>{USERNAME}</NombreUsuario><ContrasenaUsuario>{PASSWORD}</ContrasenaUsuario></Perfil><DatosUsuario><RutUsuario>11.111.111-1</RutUsuario></DatosUsuario><DatosTarjetas><NumeroTarjeta>4111111111111111</NumeroTarjeta></DatosTarjetas><IP>203.0.113.10</IP></TBKPatData>'

    IssuerTokenResponse:
      type: object
      xml:
        name: Mensaje
      required:
        - Coderror
        - Descerror
      properties:
        Coderror:
          type: string
          description: Result code. `0` means success.
          enum:
            - '0'
            - '1'
            - '100'
            - '1000'
            - '1001'
            - '1007'
          example: '0'
        Descerror:
          type: string
          maxLength: 80
          description: Informative text that accompanies the code, up to 80 characters. It may change.
          example: SUCCESS
        Token:
          type: string
          description: Single-use token. Only present when `Coderror` is `0`.
          example: '{TOKEN}'

    IssuerLoginForm:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The single-use token PAR returned in `Token`.
          example: '{TOKEN}'
        direccionRegreso:
          type: string
          format: uri
          description: Return URL PAR offers to the cardholder. It must belong to an origin authorized for the issuer.
          example: https://www.example.com/par/return
        direccionError:
          type: string
          format: uri
          description: URL PAR sends the cardholder to if the login fails. It must belong to an origin authorized for the issuer.
          example: https://www.example.com/par/error
        style:
          type: string
          format: uri
          description: URL of a stylesheet of the issuer.
          example: https://www.example.com/par/styles.css
        imagen:
          type: string
          format: uri
          description: URL of an image of the issuer.
          example: https://www.example.com/par/logo.png

    AdminStatus:
      type: object
      required:
        - status
        - reason
        - message
        - date
      properties:
        status:
          type: string
          description: Result of the request. `OK` if it was processed and `FAILED` if it was not.
          enum:
            - OK
            - FAILED
          example: OK
        reason:
          type: string
          description: |
            Reason code. `00` is a processed request; `BR`, an invalid request; `86`, an authentication or
            permissions problem; and `X3`, a resource that does not exist.
          example: '00'
        message:
          type: string
          description: Informational text that accompanies the code. It may change; do not use it to make decisions.
          example: The request was processed successfully
        date:
          type: string
          format: date-time
          description: Date and time of the response.
          example: '2026-01-15T10:30:00-05:00'

    AdminFailure:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'

    AdminValidationFailure:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/AdminStatus'
            - type: object
              required:
                - errors
              properties:
                errors:
                  type: object
                  description: |
                    The validation messages grouped by field. The key is the path of the field, for example
                    `merchant.name` or `allowedIps.0`, and the value is the list of its messages.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  example:
                    merchant.name:
                      - The merchant.name field is required.

    AdminMerchantRequest:
      type: object
      required:
        - issuer
        - merchant
        - settings
      properties:
        issuer:
          type: string
          maxLength: 255
          description: Identifies who makes the change.
          example: operator@example.com
        locale:
          type:
            - string
            - 'null'
          maxLength: 10
          description: Language of the merchant.
          example: en
        merchant:
          type: object
          required:
            - coreId
            - name
            - status
          properties:
            coreId:
              type: integer
              description: Identifier of the merchant. It must be equal to the one in the path.
              example: 10
            name:
              type: string
              maxLength: 80
              description: Name of the merchant.
              example: Test merchant
            authorizationCode:
              type:
                - string
                - 'null'
              maxLength: 255
              description: |
                Secret key of the merchant's partner, the one it sends in the `Authorization` header. If you
                do not send it in the first sync, PAR generates one. If it already exists, it only changes
                if you send a different value, and changing it revokes the open sessions. It cannot be in
                use by another partner.
              example: MerchantSecret123
            documentType:
              type:
                - string
                - 'null'
              maxLength: 10
              description: Document type of the merchant.
              example: NIT
            document:
              type:
                - string
                - 'null'
              maxLength: 20
              description: Document number of the merchant.
              example: '900123456'
            city:
              type:
                - string
                - 'null'
              maxLength: 30
              description: City of the merchant.
              example: Santiago
            country:
              type:
                - string
                - 'null'
              minLength: 2
              maxLength: 2
              description: Country of the merchant, with the 2-letter ISO code.
              example: CL
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
              description: Status of the merchant.
              example: ACTIVE
        settings:
          type: object
          required:
            - enabled
          properties:
            enabled:
              type: boolean
              description: |
                Enables the merchant in PAR. For it to end up active, `merchant.status` must also be
                `ACTIVE`.
              example: true
            requiresAutopayApproval:
              type: boolean
              description: Indicates whether the merchant's new autopays require approval before they are activated.
              example: true
            notificationEmail:
              type:
                - string
                - 'null'
              format: email
              maxLength: 80
              description: Email to which PAR sends the merchant's notices.
              example: notifications@example.com
            logoUrl:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
              description: URL of the logo that PAR shows to the cardholder.
              example: https://www.example.com/logo.png
            termsDocumentUrl:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
              description: URL of the merchant's terms and conditions document.
              example: https://www.example.com/terms.pdf

    AdminMerchantResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        data:
          type: object
          required:
            - coreId
            - status
            - authorizationCode
          properties:
            coreId:
              type: integer
              description: Identifier of the merchant.
              example: 10
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
              description: Status the merchant ended up with in PAR.
              example: ACTIVE
            authorizationCode:
              type: string
              description: Secret key of the merchant's partner. Hand it to the merchant for its `Authorization` header.
              example: MerchantSecret123

    AdminSiteRequest:
      type: object
      required:
        - issuer
        - site
        - settings
      properties:
        issuer:
          type: string
          maxLength: 255
          description: Identifies who makes the change.
          example: operator@example.com
        locale:
          type:
            - string
            - 'null'
          maxLength: 10
          description: Language of the site.
          example: en
        site:
          type: object
          required:
            - coreId
            - merchantId
            - login
            - tranKey
            - name
            - currency
            - status
          properties:
            coreId:
              type: integer
              description: Identifier of the site. It must be equal to the one in the path.
              example: 20
            merchantId:
              type: integer
              description: '`coreId` of the merchant the site belongs to. The merchant must exist in PAR.'
              example: 10
            commerceCode:
              type:
                - string
                - 'null'
              maxLength: 20
              description: |
                Commerce code of the site, the one the merchant sends in the `Commercecode` header. If you do
                not send it, PAR keeps the current one or generates one. It cannot be in use by another site.
              example: COM-000123
            login:
              type: string
              maxLength: 32
              description: '`login` credential of the site in Placetopay.'
              example: aabbccdd1234567890aabbccdd123456
            tranKey:
              type: string
              maxLength: 32
              description: '`tranKey` credential of the site in Placetopay.'
              example: exampleTranKey16
            name:
              type: string
              maxLength: 128
              description: Name of the site.
              example: Test site
            displayName:
              type:
                - string
                - 'null'
              maxLength: 128
              description: Name with which PAR shows the site to the cardholder.
              example: My store
            currency:
              type: string
              minLength: 3
              maxLength: 3
              description: Currency of the site, with the 3-letter ISO code.
              example: CLP
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
              description: Status of the site.
              example: ACTIVE
        settings:
          type: object
          required:
            - enabled
            - paymentMode
            - allowedCurrencies
            - frequency
            - allowedIntervals
            - expirationRules
          properties:
            enabled:
              type: boolean
              description: |
                Enables the site in PAR. For it to end up active, `site.status` must also be
                `ACTIVE`.
              example: true
            requiresApproval:
              type: boolean
              description: Indicates whether the site's new autopays require approval before they are activated.
              example: false
            paymentMode:
              type: string
              enum:
                - FIXED
                - TOTAL_BALANCE
                - MINIMUM_BALANCE
              description: |
                How each charge is calculated: `FIXED` charges a fixed amount, `TOTAL_BALANCE` the total
                balance and `MINIMUM_BALANCE` the minimum balance.
              example: TOTAL_BALANCE
            maxAmountEnabled:
              type:
                - boolean
                - 'null'
              description: Lets the cardholder set a maximum amount per charge. It cannot be sent with `paymentMode` `FIXED`.
              example: true
            maxAmountLabel:
              type:
                - string
                - 'null'
              maxLength: 60
              description: Text with which PAR asks for the maximum amount. It cannot be sent with `paymentMode` `FIXED`.
              example: Maximum amount per charge
            allowedCurrencies:
              type: array
              minItems: 1
              description: Currencies in which autopays can be charged, with uppercase 3-letter ISO codes.
              items:
                type: string
                pattern: '^[A-Z]{3}$'
              example:
                - CLP
            frequency:
              type: string
              enum:
                - D
                - W
                - M
                - Y
              description: Frequency of the charges. `D` is daily, `W` weekly, `M` monthly and `Y` yearly.
              example: M
            allowedIntervals:
              type: array
              minItems: 1
              description: |
                Every how many periods of `frequency` a charge is made. For example, `[1, 3]` with monthly
                frequency allows charging every month or every three months.
              items:
                type: integer
                minimum: 1
              example:
                - 1
            allowedDays:
              type:
                - array
                - 'null'
              minItems: 1
              description: |
                Days of the month on which a charge can be made. Only sent with `paymentMode` `FIXED` and
                `frequency` `M`; in any other case it cannot be sent.
              items:
                type: integer
                minimum: 1
              example:
                - 5
                - 15
            expirationRules:
              type: object
              required:
                - editable
              description: When the autopay expires.
              properties:
                editable:
                  type: boolean
                  description: |
                    If `true`, the cardholder chooses the expiration and `type` and `value` are not sent.
                    If `false`, the site defines the expiration and `type` is required.
                  example: false
                type:
                  type:
                    - string
                    - 'null'
                  enum:
                    - QUANTITY
                    - DATE
                    - UNLIMITED
                    - null
                  description: |
                    `QUANTITY` expires after a number of charges, `DATE` on a date and `UNLIMITED` never expires.
                  example: QUANTITY
                value:
                  type:
                    - integer
                    - string
                    - 'null'
                  description: |
                    Required with `QUANTITY`, as the number of charges, and with `DATE`, as a future date in
                    `YYYY-MM-DD` format. It is not sent with `UNLIMITED`.
                  example: 12
            category:
              type:
                - string
                - 'null'
              maxLength: 80
              description: Category of the service the site charges.
              example: Services
            subcategory:
              type:
                - string
                - 'null'
              maxLength: 80
              description: Subcategory of the service the site charges.
              example: Subscriptions
            referenceRules:
              type:
                - string
                - 'null'
              maxLength: 100
              description: Regular expression that the autopay reference must meet. It must be a valid expression.
              example: '^[0-9]{8}$'
            referenceGuideUrl:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
              description: URL of a guide that explains to the cardholder where to find their reference.
              example: https://www.example.com/reference-guide
            allowCaptureDetainer:
              type: boolean
              description: Allows capturing the autopay's detainer.
              example: false
            detainerTag:
              type:
                - string
                - 'null'
              maxLength: 100
              description: Text with which PAR asks for the detainer.
              example: Detainer code
            termsAndConditions:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 255
              description: URL of the site's terms and conditions.
              example: https://www.example.com/terms

    AdminSiteResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        data:
          type: object
          required:
            - coreId
            - status
            - commerceCode
          properties:
            coreId:
              type: integer
              description: Identifier of the site.
              example: 20
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
              description: Status the site ended up with in PAR.
              example: ACTIVE
            commerceCode:
              type: string
              description: Commerce code of the site. Hand it to the merchant for its `Commercecode` header.
              example: COM-000123

    AdminPartnerListRequest:
      type: object
      properties:
        filters:
          type: object
          description: Optional filters. Other keys are not accepted.
          properties:
            status:
              type: array
              description: Statuses to include.
              items:
                type: string
                enum:
                  - ACTIVE
                  - INACTIVE
              example:
                - ACTIVE
            type:
              type: string
              enum:
                - issuer
                - merchant
              description: Type of partner.
              example: issuer
            name:
              type: string
              maxLength: 128
              description: Text that the partner's name must contain.
              example: Bank
            code:
              type: string
              maxLength: 20
              description: Exact code of the partner.
              example: PARTNER-0001
        page:
          type: integer
          minimum: 1
          description: Number of the page. The first one by default.
          example: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
          description: Partners per page, up to 100. If you do not send it, PAR uses the environment's default value.
          example: 20

    AdminPartnerRequest:
      type: object
      required:
        - name
        - type
        - userDocumentType
        - enabled
        - allowedIps
      properties:
        name:
          type: string
          maxLength: 128
          description: Name of the partner.
          example: Test bank
        type:
          type: string
          enum:
            - issuer
          description: Type of partner. Only `issuer` is accepted.
          example: issuer
        userDocumentType:
          type: string
          description: Document type of the issuer's cardholders, such as `CLRUT`. It must be a supported document type.
          example: CLRUT
        enabled:
          type: boolean
          description: Indicates whether the partner is active. An inactive partner cannot request tokens.
          example: true
        allowedIps:
          type: array
          minItems: 1
          description: |
            IP addresses from which the partner can request tokens. It must include at least one, with no
            repeats.
          items:
            type: string
            format: ip
          example:
            - 192.0.2.10
        allowedFrameOrigins:
          type:
            - array
            - 'null'
          description: |
            Origins of the partner's sites authorized to display PAR in an `iframe`. Each one carries only
            scheme, host and optional port, with no path.
          items:
            type: string
            format: uri
            maxLength: 2048
          example:
            - https://www.example.com
        code:
          type: string
          maxLength: 20
          description: Unique code of the partner. If you do not send it on creation, PAR generates one; on update, it only changes if you send it.
          example: PARTNER-0001
        secretKey:
          type: string
          minLength: 15
          maxLength: 15
          pattern: '^[A-Za-z0-9]{15}$'
          description: |
            Unique secret key of the partner, of exactly 15 letters and digits. If you do not send it on
            creation, PAR generates one; on update, it only changes if you send it, and changing it revokes
            the open sessions.
          example: NewSecret123456

    AdminPartner:
      type: object
      required:
        - id
        - merchantId
        - name
        - code
        - secretKey
        - type
        - userDocumentType
        - allowedIps
        - allowedFrameOrigins
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          description: Identifier of the partner.
          example: 7
        merchantId:
          type:
            - integer
            - 'null'
          description: Internal identifier of the merchant, only on merchant partners.
          example: null
        name:
          type: string
          description: Name of the partner.
          example: Test bank
        code:
          type: string
          description: Code of the partner.
          example: PARTNER-0001
        secretKey:
          type: string
          description: Secret key of the partner.
          example: NewSecret123456
        type:
          type: string
          enum:
            - issuer
            - merchant
          description: Type of partner.
          example: issuer
        userDocumentType:
          type:
            - string
            - 'null'
          description: Document type of the issuer's cardholders.
          example: CLRUT
        allowedIps:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Authorized IP addresses.
          example:
            - 192.0.2.10
        allowedFrameOrigins:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Origins authorized to display PAR in an `iframe`.
          example:
            - https://www.example.com
        enabled:
          type: boolean
          description: Indicates whether the partner is active.
          example: true
        createdAt:
          type: string
          format: date-time
          description: Creation date.
          example: '2026-01-15T10:30:00.000000Z'
        updatedAt:
          type: string
          format: date-time
          description: Date of the last update.
          example: '2026-01-15T10:30:00.000000Z'

    AdminPartnerResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        data:
          $ref: '#/components/schemas/AdminPartner'

    AdminPartnerListResponse:
      type: object
      required:
        - status
        - data
        - meta
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminPartner'
        meta:
          type: object
          required:
            - page
            - perPage
            - total
          properties:
            page:
              type: integer
              description: Page returned.
              example: 1
            perPage:
              type: integer
              description: Partners per page.
              example: 20
            total:
              type: integer
              description: Total partners that match the filters.
              example: 42
