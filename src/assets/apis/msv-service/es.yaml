openapi: 3.1.0
info:
  title: MSV Service
  version: '1.0'
  description: |
    ## Descripción:
    Este servicio permite enviar mensajes de notificación o validación empleando canales como whatsapp, sms o email.

    ## Webhook:
    Para el uso del **webhook** debes configurar un tu servidor una URL que reciba la notificación mediante **POST** con la siguiente estructura:

    ~~~ json
    {
      "status": {
        "status": "APPROVED",
        "reason": null,
        "message": "El usuario ha respondido",
        "date": "2022-08-08T17:23:49+00:00"
      },
      "token": "d5d67dcb",
      "reference": "0122333444455555",
      "kind": "horus",
      "signature": "c1c0a085837b4042ab6cce604d5a51e665aa038c2eab58a6212037b459612ca1"
    }
    ~~~

    Puedes validar que se trate de una respuesta de PlacetoPay haciendo un SHA-256 con los datos **token + status.status + status.date + secret_token**. Para el caso del ejemplo y si el **secret_token** del user fuera ABCD1234 sería:
    ~~~
    hash('sha256',"d5d67dcbAPPROVED2022-08-08T17:23:49+00:00ABCD1234")
    ~~~

    Si este valor coincide con el valor proporcionado por el **signature**, puedes autenticar la respuesta y proceder a persistir el registro en la base de datos.


    Bajo ninguna circunstancia reveles exponiendo tu **secret_token** en ninguna parte accesible a los clientes o usuarios de su aplicación.
  contact:
    name: ''
    email: ''
    url: ''
  termsOfService: ''
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
