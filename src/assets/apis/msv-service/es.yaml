components:
  schemas:
    ValidationErrors:
      type: object
      description: Estructura de errores
      properties:
        key:
          type: array
          description: Campo que no supera la validación
          items:
            type: string
    Channels:
      type: object
      description: Estructura requerida para definir el detalle del canal a utilizar
      properties:
        sms:
          type: object
          required:
            - phone_number
            - short_message
          properties:
            phone_number:
              type: string
              description: Número telefónico en formato E.164
              example: "+573124567890"
            short_message:
              type: string
              description: mensaje corto que se visualizará en sms
        whatsapp:
          type: object
          required:
            - phone_number
            - template
          properties:
            phone_number:
              type: string
              description: Número telefónico en formato E.164
              example: "+573124567890"
            template:
              type: object
              description: plantilla mensaje whatsapp
              required:
                - name
                - parameters
              properties:
                name:
                  type: string
                  example: hello_world
                lang:
                  type: string
                  example: en_US
                  description: El idioma esta definido por la plantilla creada en meta
                parameters:
                  type: array
                  description: |-
                    Para establecer la posición del enlace en la plantilla usar [URL_VALIDATION] ejemplo:

                    ["Name","Price","Merchant","[URL_VALIDATION]"]
                  items:
                    type: string
        email:
          type: object
          required:
            - email
            - subject
          properties:
            email:
              type: string
              description: Dirección de correo electrónico
              format: email
              example: john.wick@example.com
            subject:
              type: string
              description: Asunto del correo electrónico
              example: Asunto correo
  responses: {}
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
