                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: The message was sent successfully
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2022-08-12T15:44:17+00:00'
              examples:
                OK:
                  value:
                    status:
                      status: OK
                      reason: null
                      message: The message was sent successfully
                      date: '2022-08-12T15:44:17+00:00'
        '401':
