          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason:
                      message: The message field is required.
                      date: '2022-08-12T14:50:01+00:00'
                    errors:
                      message:
                        - The message field is required.
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: The message field is required.
                      date:
                        type: string
                        format: date-time
                        description: Response date and time
                        example: '2022-08-12T14:50:01+00:00'
                  errors:
                    $ref: '#/components/schemas/ValidationErrors'
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
                      reason: null
                      message: The message field is required.
                      date: '2022-08-12T14:50:01+00:00'
                    errors:
                      message:
                        - The message field is required.
      description: This service creates a notification request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  locale: es
                  reference: '994887395'
                  message: this is a very long and generic message
                  kind: Horus
                  webhook_url: https://domain.com/
                  minutes_by_expire: 15
                  buttons:
                    approve: approved option
                    reject: reject option
                  channels:
                    sms:
                      phone_number: "+571234567890"
                      short_message: this is a short message used on sms channel
                    whatsapp:
                      phone_number: "+571234567890"
                      template:
                        name: msv_transaction
                        lang: en
                        parameters:
                          - Name
