                  type: string
                  description: Message that will be displayed in the email.
                  example: this is a very long and generic message
                kind:
                  type: string
                  description: Field used to classify a request
                  example: Horus
                  maxLength: 50
                channels:
                  $ref: '#/components/schemas/Channels'
                site_id:
                  type: integer
                  x-stoplight:
                    id: 2c8tpihdr5e35
                  description: >
                    ID of the site associated with the tenant. Only applies when using SMS or WhatsApp
                    channels and the tenant has SiteMiddleware configured; otherwise it is ignored.
                  example: 123
            examples:
              All:
                value:
                  locale: en
                  message: this is a very long and generic message
                  kind: Horus
                  channels:
                    whatsapp:
                      phone_number: "+573124567890"
                      template:
                        name: hello_world
                        lang: en_US
                        parameters:
                          - name
                    sms:
                      phone_number: "+573124567890"
                      short_message: sms message
                    email:
                      email: mail@test.com
                      subject: email subject
              Email:
                value:
                  locale: en
                  message: this is a very long and generic message
                  kind: Horus
                  channels:
                    email:
                      email: test@email.com
                      subject: Email subject
              Whatsapp:
                value:
                  locale: en
                  message: this is a very long and generic message
                  kind: Horus
                  channels:
                    whatsapp:
                      phone_number: "+573124567890"
                      template:
                        name: hello_world
                        lang: en_US
                        parameters:
                          - name
              SMS:
                value:
                  locale: en
                  message: this is a very long and generic message
                  kind: Horus
                  channels:
                    sms:
                      phone_number: "+573124567890"
                      short_message: sms message
        description: ''
      security:
        - Bearer: []
      parameters: []
components:
  schemas:
    ValidationErrors:
      type: object
      description: Error structure
      properties:
        key:
          type: array
          description: Field that did not pass validation
          items:
            type: string
    Channels:
      type: object
      description: Structure required to define the channel details to use
      properties:
        sms:
          type: object
          required:
            - phone_number
            - short_message
          properties:
            phone_number:
              type: string
              description: Phone number in E.164 format
              example: "+573124567890"
            short_message:
              type: string
              description: Short message displayed in SMS
        whatsapp:
          type: object
          required:
            - phone_number
            - template
          properties:
            phone_number:
              type: string
              description: Phone number in E.164 format
              example: "+573124567890"
            template:
              type: object
              description: WhatsApp message template
              required:
                - name
                - parameters
              properties:
                name:
                  type: string
                  example: hello_world
                lang:
                  type: string
                  example: en_US
                  description: Language of the template registered with Meta; if omitted, the request's locale is used.
                parameters:
                  type: array
                  description: |-
                    To define the position of the link in the template, use [URL_VALIDATION]. Example:

                    ["Name","Price","Merchant","[URL_VALIDATION]"]
                    
                    Note: URL_VALIDATION is only useful for validations.
                  items:
                    type: string
        email:
          type: object
          required:
            - email
            - subject
          properties:
            email:
              type: string
              description: Email address
              format: email
              example: john.wick@example.com
            subject:
              type: string
              description: Email subject
              example: Email subject
  responses: {}
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
