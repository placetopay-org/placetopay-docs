            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: APPROVED
                      message: Status validation is APPROVED
                      date: '2022-08-08T16:25:45+00:00'
                    token: d5d67dcb
                    reference: '0122333444455555'
                    kind: horus
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Validation status
                        enum:
                          - PENDING
                          - APPROVED
                          - REJECTED
                          - PARTIAL_EXPIRED
                        example: PENDING
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: Status validation is PENDING
                      date:
                        type: string
                        description: Response date and time
                        example: '2022-08-16T15:06:36+00:00'
                        format: date-time
                  token:
                    type: string
                    description: Request identifier (8 hexadecimal characters)
                    example: d5d67dcb
                  reference:
                    type: string
                    description: Identifier of the item to validate
                    example: '0122333444455555'
                  kind:
                    type: string
                    description: Field used to classify a request
                    example: horus
        '401':
          description: The request is unauthenticated. Bearer token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason: null
                      message: Unauthenticated.
                      date: '2026-08-13T15:10:55+00:00'
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: Unauthenticated.
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2026-08-13T15:10:55+00:00'
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
                      reason: null
                      message: Unauthenticated.
                      date: '2026-08-13T15:10:55+00:00'
        '404':
          description: The validation request was not found.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: UNKNOWN
                      reason: null
                      message: Make sure token is valid, validation request not found.
                      date: '2022-08-12T14:50:01+00:00'
                    token: d5d67dcb
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: UNKNOWN
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: Make sure token is valid, validation request not found.
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2022-08-12T14:50:01+00:00'
                  token:
                    type: string
                    description: Request identifier (8 hexadecimal characters)
                    example: d5d67dcb
        '422':
          description: The application data did not pass validation.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason: null
                      message: The token field is required.
                      date: '2022-08-12T14:50:01+00:00'
                    errors:
                      token:
                        - The token field is required.
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: The token field is required.
                      date:
                        type: string
                        description: Response date and time
                        example: '2022-08-12T14:50:01+00:00'
                  errors:
                    $ref: '#/components/schemas/ValidationErrors'
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
                      reason: null
                      message: The token field is required.
                      date: '2022-08-12T14:50:01+00:00'
                    errors:
                      token:
                        - The token field is required.
      description: Query a previously created validation request.
      security:
        - Bearer: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 8
                  example: d5d67dcb
                  description: Token returned by `/api/validations` upon creating the validation
                locale:
                  type: string
                  description: Define the language to use in ISO 639-1 format.
                  enum: [ es, en, pt, it ]
                  example: es
              required:
                - token
  "/api/notifications":
    parameters: []
    post:
      summary: Notification
      operationId: postapi-requests
      responses:
        '200':
          description: The message was sent successfully.
          content:
            application/json:
              schema:
                type: object
