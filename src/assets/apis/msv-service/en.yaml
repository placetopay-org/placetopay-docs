                example-1:
                  locale: es
                  reference: '994887395'
                  action: notification
                  message: this is a very long and generic message
                  kind: Horus
                  webhook_url: https://domain.com/
                  minutes_by_expire: 15
                  buttons:
                    approve: approved option
                    reject: reject option
                  channels:
                    sms:
                      phone_number: "+571234567890"
                      short_message: this is a short message used on sms channel
                    whatsapp:
                      phone_number: "+571234567890"
                      short_message: this is a short message used on whatsapp channel
                    email:
                      email: example@email.com
                      subject: an example subject for email
              required:
                - reference
                - message
                - webhook_url
                - channels
              properties:
                locale:
                  type: string
                  example: es
                  description: Defines the language to use in ISO 639-1 format
                  minLength: 2
                  maxLength: 2
                reference:
                  type: string
                  description: Identifier of the item to validate
                  example: ref-12548
                message:
                  type: string
                  description: Message displayed in the email and in the approval view.
                kind:
                  type: string
                  description: Field used to classify a request
                  example: Horus
                webhook_url:
                  type: string
                  description: URL where the request response will be sent
                  example: https://example-url.com/
                minutes_by_expire:
                  type: integer
                  example: 20
                  minimum: 1
                  maximum: 60
                  description: 'Number of minutes before a request expires. (Default value: 30, minimum: 1, maximum: 60)'
                buttons:
                  type: object
                  description: Structure that defines the text for the approval and rejection options
                  minProperties: 2
                  maxProperties: 2
                  required:
                    - approve
                    - reject
                  properties:
                    approve:
                      type: string
                      description: Text shown for the approval option
                      example: yes, accept, approved
                    reject:
                      type: string
                      description: Text shown for the rejection option
                      example: no, reject, rejected
                channels:
                  type: object
                  description: Structure required to define the channel details to use
                  properties:
                    sms:
                      type: object
                      required:
                        - phone_number
                        - short_message
                      properties:
                        phone_number:
                          type: string
                          description: Phone number in E.164 format
                          example: "+573124567890"
                          pattern: "^\\+?[1-9]\\d{11,14}$"
                        short_message:
                          type: string
                          description: Short message displayed in SMS
                    whatsapp:
                      type: object
                      required:
                        - phone_number
                        - template
                      properties:
                        phone_number:
                          type: string
                          description: Phone number in E.164 format
                          example: "+573124567890"
                          pattern: "^\\+?[1-9]\\d{11,14}$"
                        template:
                          type: object
                          description: WhatsApp message template
                          required:
                            - name
                            - parameters
                          properties:
                            name:
                              type: string
                              example: hello_world
                            lang:
                              type: string
                              example: en_US
                              description: Language defined by the template created in Meta
                            parameters:
                              type: array
                              description: |-
                                To define the position of the link in the template, use [URL_VALIDATION]. Example:

                                ["Name","Price","Merchant","[URL_VALIDATION]"]
                              items:
                                type: string
                    email:
                      type: object
                      required:
                        - email
                        - subject
                      properties:
                        email:
                          type: string
                          description: Email address
                          format: email
                          example: dnetix@yopmail.com
                        subject:
                          type: string
                          description: Email subject
                          example: Email subject
            examples:
              Email:
                value:
                  locale: en
                  reference: ref-12548
                  message: Example Validation
                  kind: Horus
                  webhook_url: https://example-url.com/
                  minutes_by_expire: 10
                  buttons:
                    approve: yes, accept, approved
                    reject: no, reject, rejected
                  channels:
                    email:
                      email: dnetix@yopmail.com
                      subject: Email subject
              Whatsapp:
                value:
                  locale: en
                  reference: ref-12548
                  message: Example Validation
                  kind: Horus
                  webhook_url: https://example-url.com/
                  minutes_by_expire: 10
                  buttons:
                    approve: yes, accept, approved
                    reject: no, reject, rejected
                  channels:
                    whatsapp:
                      phone_number: "+573124567890"
                      template:
                        name: msv_transaction
                        lang: en
                        parameters:
                          - Name
                          - Price
                          - Merchant
                          - "[URL_VALIDATION]"
              SMS:
                value:
                  locale: en
                  reference: ref-12548
                  message: Example Validation
                  kind: Horus
                  webhook_url: https://example-url.com/
                  minutes_by_expire: 10
                  buttons:
                    approve: Accept
                    reject: Reject
                  channels:
                    sms:
                      phone_number: "+573124567890"
                      short_message: SMS Message
              All:
                value:
                  locale: en
                  reference: ref-12548
                  message: Example Validation
                  kind: Horus
                  webhook_url: https://example-url.com/
                  minutes_by_expire: 20
                  buttons:
                    approve: yes, accept, approved
                    reject: no, reject, rejected
                  channels:
                    sms:
                      phone_number: "+573124567890"
                      short_message: SMS Message
                    whatsapp:
                      phone_number: "+573124567890"
                      template:
                        name: hello_world
                        lang: en_US
                        parameters:
                          - Name
                          - Price
                          - Merchant
                          - "[URL_VALIDATION]"
                    email:
                      email: dnetix@yopmail.com
                      subject: Asunto correo
          application/xml:
            schema:
              type: object
              properties: {}
        description: ''
      parameters: []
      security:
        - Bearer: []
