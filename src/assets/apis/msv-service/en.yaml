                      date: '2022-08-08 17:23:49'
                    token: d996b93d-4e81-4896-8f73-aa21010d08de
                    reference: '0122333444455555'
                    kind: horus
                    signature: feb3e7cc76939c346f9640573a208662f30704ab
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        enum:
                          - PENDING
                          - APPROVED
                          - REJECTED
                          - EXPIRED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: The user has responded.
                      date:
                        type: string
                        format: date-time
                        description: Response date and time
                        example: '2022-08-12T22:27:27+00:00'
                  reference:
                    type: string
                    description: Identifier of the item to validate
                    example: '0122333444455555'
                  token:
                    type: string
                    description: UUID request identifier
                    example: d996b93d-4e81-4896-8f73-aa21010d08de
                  kind:
                    type: string
                    description: Request classification
                    example: horus
                  signature:
                    type: string
                    description: Request signature, composed of hash('sha256',
                      token + status.status + status.date + secret_token)
                    example: feb3e7cc76939c346f9640573a208662f30704ab
        '201':
          description: Validation Response
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: PENDING
                      message: Pending
                      date: '2022-07-08T09:34:48-05:00'
                    token: 89f2b2dc-27a6-498d-a94b-578ab0e82a05
                    reference: '994887395'
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        enum:
                          - PENDING
                          - APPROVED
                          - REJECTED
                          - EXPIRED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: '200'
                      message:
                        type: string
                        description: Response description
                        example: Transaction pending approval
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2022-08-08 17:23:49'
                  reference:
                    type: string
                    description: Identifier of the item to validate
                    example: '0122333444455555'
                  token:
                    type: string
                    description: UUID request identifier
                    example: d996b93d-4e81-4896-8f73-aa21010d08de
                  kind:
                    type: string
                    description: Request classification
                    example: horus
        '400':
          description: Exception
          content:
