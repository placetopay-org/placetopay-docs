                      message: These credentials do not match our records.
                      date: '2022-08-16T13:27:04+00:00'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason:
                      message: The username field is required.
                      date: '2022-08-16T13:22:18+00:00'
                    errors:
                      username:
                        - The username field is required.
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type: string
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: The username field is required.
                      date:
                        type: string
                        description: Response date and time
                        example: '2022-08-16T13:22:18+00:00'
                  errors:
                    type: object
                    description: Error structure
                    properties:
                      key:
                        type: array
                        description: Field that did not pass validation
                        items:
                          type: string
                          example: username
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
                      reason:
                      message: The username field is required.
                      date: '2022-08-16T13:22:18+00:00'
                    errors:
                      username:
                        - The username field is required.
      description: Obtain a token to authenticate requests to the API.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  username: RestService
                  password: password
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Application username
                  example: RestService
                password:
                  type: string
                  description: User-defined password
                  example: password
            examples: {}
        description: ''
      parameters: []
  "/api/validations":
    parameters: []
    post:
      summary: Validation
      operationId: postapi-request
      responses:
