openapi: 3.1.0
info:
  title: MSV Service
  version: '1.0'
  description: |
    Service for creating notification and validation requests through channels such as WhatsApp, SMS, or Email.
    It also allows querying the status of previously submitted requests.
  contact:
    name: ''
    email: ''
    url: ''
  termsOfService: ''
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://msv-service.placetopay.com/
    description: Prod
paths:
  "/api/login":
    post:
      summary: Login
      operationId: post-api-login
      responses:
        '200':
          description: Successful authentication; returns the access_token and secret_token
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: OK
                      reason:
                      message:
                      date: '2022-08-16T13:12:18+00:00'
                    access_token: 5d791fa9-91c2-401a-a20e-8e9569e5edec|gYs7WRqfd2NEgiJHOWbaXmyESa1JH4Gs98FDfXBE
                    secret_token: DYJKxUKzgzFaXK2UYkqOy6xd7X1suCnn
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: OK
                      reason:
                        type: string
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: 'null'
                      date:
                        type: string
                        format: date-time
                        description: Response date and time
                        example: '2022-08-16T13:12:18+00:00'
                  access_token:
                    type: string
                    description: User access token
                    example: 5d791fa9-91c2-401a-a20e-8e9569e5edec|gYs7WRqfd2NEgiJHOWbaXmyESa1JH4Gs98FDfXBE
                  secret_token:
                    type: string
                    description: User secret token
                    example: DYJKxUKzgzFaXK2UYkqOy6xd7X1suCnn
              examples:
                example-1:
                  value:
                    status:
                      status: OK
                      reason:
                      message:
                      date: '2022-08-16T13:12:18+00:00'
                    access_token: 5d791fa9-91c2-401a-a20e-8e9569e5edec|gYs7WRqfd2NEgiJHOWbaXmyESa1JH4Gs98FDfXBE
                    secret_token: DYJKxUKzgzFaXK2UYkqOy6xd7X1suCnn
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason:
                      message: These credentials do not match our records.
                      date: '2022-08-16T13:27:04+00:00'
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type: string
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: These credentials do not match our records.
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2022-08-16T13:27:04+00:00'
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
                      reason:
                      message: These credentials do not match our records.
                      date: '2022-08-16T13:27:04+00:00'
        '422':
          description: The application data did not pass validation.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason:
                      message: The username field is required.
                      date: '2022-08-16T13:22:18+00:00'
                    errors:
                      username:
                        - The username field is required.
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type: string
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: The username field is required.
                      date:
                        type: string
                        description: Response date and time
                        example: '2022-08-16T13:22:18+00:00'
                  errors:
                    $ref: '#/components/schemas/ValidationErrors'
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
                      reason:
                      message: The username field is required.
                      date: '2022-08-16T13:22:18+00:00'
                    errors:
                      username:
                        - The username field is required.
      description: Obtain a token to authenticate requests to the API.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  username: RestService
                  password: password
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Application username
                  example: RestService
                password:
                  type: string
                  description: User-defined password
                  example: password
            examples: {}
        description: ''
      parameters: []
  "/api/validations":
    parameters: []
    post:
      summary: Validation
      operationId: postapi-request
      responses:
        '201':
          description: The validation request was created and the messages were sent.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: OK
                      reason: null
                      message: The message was sent successfully
                      date: '2022-08-12T15:44:17+00:00'
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        enum:
                          - PENDING
                          - APPROVED
                          - REJECTED
                          - PARTIAL_EXPIRED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: Transaction pending approval
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2022-08-08T17:23:49+00:00'
                  reference:
                    type: string
                    description: Identifier of the item to validate
                    example: '0122333444455555'
                  token:
                    type: string
                    description: Request identifier (8 hexadecimal characters)
                    example: d5d67dcb
                  kind:
                    type: string
                    description: Request classification
                    example: horus
        '401':
          description: The request is unauthenticated. Bearer token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason: null
                      message: Unauthenticated.
                      date: '2026-08-13T15:10:55+00:00'
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: Unauthenticated.
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2026-08-13T15:10:55+00:00'
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
                      reason: null
                      message: Unauthenticated.
                      date: '2026-08-13T15:10:55+00:00'
        '400':
          description: It was not possible to deliver the message through one of the indicated channels.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason: null
                      message: 'The message could not be sent via the channel: SMS'
                      date: '2022-08-08T17:23:49+00:00'
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: 'The message could not be sent via the channel: SMS'
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2022-08-08T17:23:49+00:00'
        '422':
          description: The application data did not pass validation.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason:
                      message: The message field is required.
                      date: '2022-08-12T14:50:01+00:00'
                    errors:
                      message:
                        - The message field is required.
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type:
                          - string
                          - 'null'
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: The message field is required.
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2022-08-12T14:50:01+00:00'
                  errors:
                    $ref: '#/components/schemas/ValidationErrors'
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
                      reason:
                      message: The message field is required.
                      date: '2022-08-12T14:50:01+00:00'
                    errors:
                      message:
                        - The message field is required.
      description: This service creates a validation request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  locale: es
                  reference: '994887395'
                  message: this is a very long and generic message
                  kind: Horus
                  webhook_url: https://domain.com/
                  minutes_by_expire: 15
                  buttons:
                    approve: approved option
                    reject: reject option
                  channels:
                    sms:
                      phone_number: "+571234567890"
                      short_message: this is a short message used on sms channel
                    whatsapp:
                      phone_number: "+571234567890"
                      template:
                        name: msv_transaction
                        lang: en
                        parameters:
                          - Name
                          - Price
                          - Merchant
                          - "[URL_VALIDATION]"
                    email:
                      email: example@email.com
                      subject: an example subject for email
              required:
                - reference
                - message
                - webhook_url
                - channels
              properties:
                locale:
                  type: string
                  example: es
                  description: Defines the language to use in ISO 639-1 format
                  minLength: 2
                  maxLength: 2
                  enum:
                    - es
                    - en
                    - pt
                    - it
                reference:
                  type: string
                  description: Identifier of the item to validate
                  example: ref-12548
                  maxLength: 50
                message:
                  type: string
                  description: Message displayed in the email and in the approval view.
                kind:
                  type: string
                  description: Field used to classify a request
                  example: Horus
                  maxLength: 50
                webhook_url:
                  type: string
                  description: URL of your server where msv-service will send the result via POST when the user responds or when the request expires.
                  example: https://example-url.com/
                  maxLength: 255
                minutes_by_expire:
                  type: integer
                  example: 20
                  minimum: 1
                  maximum: 60
                  default: 30
                  description: Minutes the user has to respond. When expired, the request changes to PARTIAL_EXPIRED and the webhook is sent with that status (minimum 1, maximum 60).
                buttons:
                  type: object
                  description: Structure that defines the text for the approval and rejection options
                  minProperties: 2
                  maxProperties: 2
                  required:
                    - approve
                    - reject
                  properties:
                    approve:
                      type: string
                      description: Text shown for the approval option
                      example: Approve
                      default: Approve
                    reject:
                      type: string
                      description: Text shown for the rejection option
                      example: Reject
                      default: Reject
                channels:
                  $ref: '#/components/schemas/Channels'
            examples:
              Email:
                value:
                  locale: en
                  reference: ref-12548
                  message: Example Validation
                  kind: Horus
                  webhook_url: https://example-url.com/
                  minutes_by_expire: 10
                  buttons:
                    approve: Approve
                    reject: Reject
                  channels:
                    email:
                      email: john.wick@example.com
                      subject: Email subject
              Whatsapp:
                value:
                  locale: en
                  reference: ref-12548
                  message: Example Validation
                  kind: Horus
                  webhook_url: https://example-url.com/
                  minutes_by_expire: 10
                  buttons:
                    approve: yes, accept, approved
                    reject: no, reject, rejected
                  channels:
                    whatsapp:
                      phone_number: "+573124567890"
                      template:
                        name: msv_transaction
                        lang: en
                        parameters:
                          - Name
                          - Price
                          - Merchant
                          - "[URL_VALIDATION]"
              SMS:
                value:
                  locale: en
                  reference: ref-12548
                  message: Example Validation
                  kind: Horus
                  webhook_url: https://example-url.com/
                  minutes_by_expire: 10
                  buttons:
                    approve: Accept
                    reject: Reject
                  channels:
                    sms:
                      phone_number: "+573124567890"
                      short_message: SMS Message
              All:
                value:
                  locale: en
                  reference: ref-12548
                  message: Example Validation
                  kind: Horus
                  webhook_url: https://example-url.com/
                  minutes_by_expire: 20
                  buttons:
                    approve: yes, accept, approved
                    reject: no, reject, rejected
                  channels:
                    sms:
                      phone_number: "+573124567890"
                      short_message: SMS Message
                    whatsapp:
                      phone_number: "+573124567890"
                      template:
                        name: hello_world
                        lang: en_US
                        parameters:
                          - Name
                          - Price
                          - Merchant
                          - "[URL_VALIDATION]"
                    email:
                      email: john.wick@example.com
                      subject: Email subject
        description: ''
      parameters: []
      security:
        - Bearer: []
  "/api/validation-query":
    post:
      summary: Validation query
      operationId: post-api-validation-query
      responses:
        '200':
          description: The validation request has been successfully retrieved.
