openapi: 3.1.0
info:
  title: MSV Service
  version: '1.0'
  description: |
    ## Description:
    This service allows you to send notification or validation messages using channels such as WhatsApp, SMS, or email.

    ## Webhook:
    To use the **webhook**, you must configure a URL on your server that receives the notification through **POST** with the following structure:

    ~~~ json
    {
      "status": {
        "status": "APPROVED",
        "reason": null,
        "message": "The user has responded",
        "date": "2022-08-08 17:23:49"
      },
      "token": "d996b93d-4e81-4896-8f73-aa21010d08de",
      "reference": "0122333444455555",
      "kind": "horus"
      "signature": "feb3e7cc76939c346f9640573a208662f30704ab"
    }
    ~~~

    You can validate that this is a PlacetoPay response by generating a HASH256 with **token + status.status + status.date + secret_token**. For the example above, if the user's **secret_token** were ABCD1234, it would be:
    ~~~
    hash('sha256',"d996b93d-4e81-4896-8f73-aa21010d08deAPPROVED2022-08-08 17:23:49ABCD1234")
    ~~~

    If this value matches the value provided by **signature**, you can authenticate the response and proceed to persist the record in your database.


    Under no circumstances should you expose your **secret_token** in any location accessible to clients or users of your application.
  contact:
    name: Andrés Vidal
    email: andres.vidal@evertecinc.com
    url: https://69fnf1fnzg.execute-api.us-east-1.amazonaws.com/
  termsOfService: https://69fnf1fnzg.execute-api.us-east-1.amazonaws.com/
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://msv-service.placetopay.com/
    description: Prod
paths:
  "/api/login":
    post:
      summary: Login
      operationId: post-api-login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: OK
                      reason:
                      message:
                      date: '2022-08-16T13:12:18+00:00'
                    access_token: 5d791fa9-91c2-401a-a20e-8e9569e5edec|gYs7WRqfd2NEgiJHOWbaXmyESa1JH4Gs98FDfXBE
                    secret_token: DYJKxUKzgzFaXK2UYkqOy6xd7X1suCnn
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: OK
                      reason:
                        type: string
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: 'null'
                      date:
                        type: string
                        format: date-time
                        description: Response date and time
                        example: '2022-08-16T13:12:18+00:00'
                  access_token:
                    type: string
                    description: User access token
                    example: 5d791fa9-91c2-401a-a20e-8e9569e5edec|gYs7WRqfd2NEgiJHOWbaXmyESa1JH4Gs98FDfXBE
                  secret_token:
                    type: string
                    description: User secret token
                    example: DYJKxUKzgzFaXK2UYkqOy6xd7X1suCnn
              examples:
                example-1:
                  value:
                    status:
                      status: OK
                      reason:
                      message:
                      date: '2022-08-16T13:12:18+00:00'
                    access_token: 5d791fa9-91c2-401a-a20e-8e9569e5edec|gYs7WRqfd2NEgiJHOWbaXmyESa1JH4Gs98FDfXBE
                    secret_token: DYJKxUKzgzFaXK2UYkqOy6xd7X1suCnn
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status:
                      status: FAILED
                      reason:
                      message: These credentials do not match our records.
                      date: '2022-08-16T13:27:04+00:00'
                properties:
                  status:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Response status
                        example: FAILED
                      reason:
                        type: string
                        description: Response code
                        example: 'null'
                      message:
                        type: string
                        description: Response description
                        example: These credentials do not match our records.
                      date:
                        type: string
                        description: Response date and time
                        format: date-time
                        example: '2022-08-16T13:27:04+00:00'
              examples:
                example-1:
                  value:
                    status:
                      status: FAILED
