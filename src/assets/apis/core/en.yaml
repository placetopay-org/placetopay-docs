  "/core/site/integration/search":
    post:
      summary: Query of site integrations
      operationId: post-core-site-integration-search
      description:
        "This service allows querying the integrations associated with a site. \nIt is possible to filter using the parameters: \"id\" and \"type\".\n\n\n> ### Note \n>\n> *It is not required to enter all parameters for the filter.*\n\nIf you need custom pagination, you must send the 'pagination' parameter along with the search filters."
      tags:
        - Site integration actions
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  "$ref": "#/components/schemas/Autentication"
                siteId:
                  type: integer
                  description: Site identifier.
                  example: 1
                id:
                  type: integer
                  description: Identifier of the integration to query.
                  example: 100
                type:
                  type: string
                  description: Code of the integration to query.
                  example: paygate
                  enum:
                    - paygate
                    - invoice_settle
                    - kount
                    - account_validator
                    - push_notification
                    - brand_tokenization
                    - notifier
                    - clicktopay
                    - azure_notification
                    - open_finance
                pagination:
                  type: object
                  x-stoplight:
                    id: wxhz4lda0ctcl
                  description: Object containing the pagination parameters.
                  properties:
                    perPage:
                      type: integer
                      x-stoplight:
                        id: a2orsqh7asj4k
                      example: 10
                      description: Number of records per page
                    currentPage:
                      type: integer
                      x-stoplight:
                        id: zonkjska50t7d
                      example: 1
                      description: Current page
              required:
                - auth
                - siteId
            examples:
              Busqueda de integraciones asociadas a un sitio.:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjE1MWQ4MDE5YWViMw==
                    seed: "2021-09-27T09:41:05-05:00"
                  siteId: 1
                  id: 100
                  type: paygate
                  pagination:
                    perPage: 10
                    currentPage: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
                  data:
                    type: array
                    properties:
                      siteId:
                        type: integer
                        example: 1
                        minimum: 1
                        description: Site identifier.
                      type:
                        type: string
                        example: "paygate"
                        description: Integration identifier code.
                      settings:
                        type: object
                        description: Object containing the integration parameters.
                        properties:
                          return_url:
                            type: string
                            example: "https://someurl.com/example"
                          md5_hash:
                            type: string
                            maxLength: 255
                            example: "SiTe"
                          soap_username:
                            type: string
                            maxLength: 255
                            example: "soap_test"
                          soap_password:
                            type: string
                            maxLength: 255
                            example: "soap_password"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
              examples:
                Respuesta exitosa:
                  value:
                    status:
                      status: OK
                      reason: "00"
                      message: The request has been processed successfully.
                      date: "2021-09-21T09:34:48-05:00"
                    data:
                      - id: 1
                        siteId: 1
                        type: paygate
                        settings:
                          return_url: https://google.com.co
                          md5_hash: SiTe
                          soap_username: soap_test
                          soap_password: soap_password
                    pagination:
                      total: 1
                      perPage: 10
                      currentPage: 1
                      lastPage: 1
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed response:
                  value:
                    Status:
                      status: FAILED
                      reason: BR
                      message: El campo siteId es obligatorio.
                      date: "2021-09-21T09:34:48-05:00"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed authentication:
                  value:
                    status:
                      status: FAILED
                      reason: "401"
                      message: the authentication does not contain all required parameters (login, tranKey, seed, nonce)
                      date: "2021-09-21T09:34:48-05:00"
components:
  schemas:
    Person:
      title: Person
      type: object
      description: 'Structure reflecting the information of a person involved in a transaction.'
      properties:
        documentType:
          type: string
          description: "Identification document type\\n. https://docs-gateway.placetopay.com/docs/webcheckout-docs/71046995c46b3-tipos-de-documento"
          enum:
            - CC
            - NIT
            - RUT
            - TI
            - PNN
          example: CC
          maxLength: 3
        Document:
          type: string
          description: Identification document number.
        name:
          type: string
          description: 'Nombre '
        surname:
          type: string
          description: Apellidos
        company:
          type: string
          description: Company
        email:
          type: string
          description: Email.
        address:
          "$ref": "#/components/schemas/Address"
          description: "Object containing a person's address information."
        mobile:
          type: string
          description: Mobile phone
          Autentication:
            title: Autentication
            type: object
            properties:
              login:
                type: string
              tranKey:
                type: string
              nonce:
                type: string
              seed:
                type: string
            description: |-
              Structure containing the site authentication information generated according to WSSE
              UsernameToken Profile 1.1
            examples: []
    Autentication:
      title: "Authentication"
      type: "object"
      description: "Authentication object. See more in **[Authentication](/token-requestor/integration/authentication)**. 
        Structure containing the site’s authentication information generated according to the WSSE UsernameToken Profile 1.1."
      properties:
        login:
          type: "string"
          description: "Login used for authentication."
          minLength: "1"
          example: "1441d14df19ec88431e513bb990326e1"
        tranKey:
          type: "string"
          description: "Transaction key."
          minLength: "1"
          example: "DGYymv6ohpYwtLWon/iADE/COoo9JXt4jqyk6D006PY="
        nonce:
          type: "string"
          description: "Random value for each request, encoded in Base64."
          minLength: "1"
          example: "enQ4dXh3YWhkMWM="
        seed:
          type: "string"
          description: "Current date, generated in ISO 8601 format."
          minLength: "1"
          example: "2023-06-21T09:56:06-05:00"
      required:
        - "login"
        - "tranKey"
        - "nonce"
        - "seed"
    Status:
      title: "Status"
      type: "object"
      description: "Structure that contains information about a request, indicating its current state."
      properties:
        status:
          type: "string"
          description: "Operation status."
          enum:
            - OK
            - FAILED
            - APPROVED
            - REJECTED
            - PENDING
            - MANUAL
            - REFUNDED
          example: "OK"
        reason:
          type: "string"
          description: "Reason for the operation status."
          maxLength: "2"
          example: "00"
        message:
          type: "string"
          description: "Description of the status."
          example: "The request has been successfully processed"
        date:
          type: "string"
          description: "Date and time when the operation was executed."
          format: "date-time"
          example: '2025-03-17T22:45:27+00:00'
      required:
        - "status"
        - "reason"
        - "message"
        - "date"
    Customer-create:
      title: Customer create
      type: object
      description: Structure containing the information to create a merchant.
      x-examples:
      required:
        - name
        - brand
        - languages
        - currencies
        - document
        - address
        - legalRepresentative
      properties:
        name:
          type: string
          example: Merchant name
          maxLength: 80
          description: Merchant name
        brand:
          type: string
          example: Merchant brand
          maxLength: 60
          description: Brand name
        mcc:
          type: string
          maxLength: 4
          minLength: 4
          example: "0742"
          description: Merchant category code according to ISO 18245.
        active:
          type: boolean
          default: true
          description: Merchant status
        timezone:
          type: string
          example: America/Bogota
          description: "Time zone of the merchant's location.

            "
        size:
          type: string
          enum:
            - XS
            - S
            - M
            - L
          example: XS
          maxLength: 2
          description: |-
            Company size based on employees [XS<10, S<50, M<250, L>250].
        url:
          type: string
          maxLength: 255
          example: http://www.example.com
          description: "Merchant's website URL."
        incrementType:
          type: string
          enum:
            - SMLMV
            - IPC
          example: IPC
          description: Plan increment type
        languages:
          type: array
          uniqueItems: true
          minItems: 1
          description: Idioma de acuerdo a ISO 631-1.
          items:
            type: string
            maxLength: 2
            example: ES
            minLength: 2
        currencies:
          type: array
          minItems: 1
          uniqueItems: true
          description: Moneda de acuerdo a ISO 4217.
          items:
            type: string
            maxLength: 3
            example: COP
        document:
          "$ref": "#/components/schemas/Document"
        address:
          "$ref": "#/components/schemas/Address"
        legalRepresentative:
          "$ref": "#/components/schemas/LegalRepresentative"
        billing:
          type: object
          description: Structure with billing information
          properties:
            contact:
              type: string
              description: Name of the person who receives the electronic invoice.
              maxLength: 128
            mail:
              type: string
              format: email
              maxLength: 128
              description: Email address to which the electronic invoice will be sent.
            registrationNumber:
              type: string
              maxLength: 20
              example: "123456789"
              description: Commercial registration number.
            taxType:
              type: integer
              example: 5
              description: Merchant regime type (depends on the country).
            taxRegime:
              type: integer
              example: 2
              description: Merchant fiscal regime (depends on the country).
            organizationType:
              type: integer
              example: 1
              description: Organization type (depends on the country).
            ciiu:
              type: string
              example: "1224"
              description: Full economic activity code according to ISIC Rev4.
              minLength: 4
              maxLength: 4
        travelAgency:
          type: object
          properties:
            dispersion:
              type: boolean
              default: false
              description: Indicator of ticket sales acceptance and own sales (funds dispersion with airlines)
            iata:
              type: string
              description: IATA code assigned to the travel agency.
              minLength: 4
              maxLength: 10
        control:
          type: object
          required:
            - reseller
          properties:
            seller:
              type: integer
              example: 1
              description: Name of the commercial consultant assigned at Placetopay.
            reseller:
              type: integer
              example: 1
              description: Banco adquirente.
            paymentFacilitator:
              type: integer
              x-stoplight:
                id: c8hdgzy5pb0le
              description: Payment facilitator id.
              example: 1
    Customer-update:
      title: Customer update
      type: object
      description: Structure containing the information to update a merchant.
      x-examples:
        Estructura-comercio:
          id: 1
          name: Merchant name
          brand: Merchant brand
          mcc: "0742"
          active: true
          timezone: America/Bogota
          size: XS
          url: http://www.example.com
          incrementType: SMLMV
          languages:
            - ES
          currencies:
            - COP
          document:
            type: NIT
            number: "123456123"
          address:
            street: Street address
            city: Medellin
            state: "1"
            postalCode: "417030"
            country: CO
            phone: "3203201320"
          legalRepresentative:
            type: NIT
            Document: "1234568"
