                      message: the authentication does not contain all required parameters (login, tranKey, seed, nonce)
                      date: "2021-09-21T09:34:48-05:00"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                auth:
                  "$ref": "#/components/schemas/Autentication"
                customerId:
                  type: integer
                  description: Merchant identifier
                siteId:
                  type: integer
                  description: Site identifier
                documentName:
                  type: string
                  maxLength: 30
                  description: Document name
                documentType:
                  type: integer
                  description: Document type identifier
                documentDescription:
                  type: string
                  maxLength: 60
                  description: Document description
                file:
                  type: string
                  format: binary
                  description: Binary file of the document
              required:
                - auth
                - customerId
                - documentName
                - documentType
                - file
      tags:
        - Merchant actions
        - Document administration
      x-internal: false
