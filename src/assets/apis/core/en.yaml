openapi: 3.0.0
info:
  title: Core
  version: "1.0"
  license:
    name: Privative
  description: description
  contact:
    name: Evertec Placetopay
    email: servicioposventa@placetopay.com
servers:
  - url: https://test.placetopay.com/rest
    description: Pruebas Colombia
  - url: https://test.placetopay.ec/rest
    description: Pruebas Ecuador
tags:
  - name: Merchant actions
    description: Actions on merchant administration.
  - name: Whitelist actions
    description: Actions on whitelist administration.
  - name: Site payment method actions
    description: Actions on site payment method administration.
  - name: Payment method actions
    description: Actions on payment methods associated with a merchant.
  - name: Site actions
    description: Actions on site administration.
  - name: Document administration
    description: Actions on document administration.
  - name: Procedimientos adicionales
    description: Actions on additional entity administration.
  - name: User actions
    description: Actions on user administration.
  - name: Plan actions
    description: Actions on plan administration.
  - name: Invoice actions
    description: Actions on invoice administration.
  - name: Merchant integration actions
    description: Actions on integrations associated with a merchant.
  - name: Site integration actions
    description: Actions on integrations associated with a site.
paths:
  "/core/merchant/create":
    post:
      summary: Merchant creation
      operationId: post-core-merchant-create
      description: This service allows creating a merchant. If the process is successful, it returns the merchant identifier and its status.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
                  id:
                    type: integer
                    example: 1
                    description: Identifier of the created merchant.
                  active:
                    type: boolean
                    description: Merchant status.
              examples:
                Successful creation:
                  value:
                    status:
                      status: OK
                      reason: "00"
                      message: The request has been processed successfully
                      date: "2021-09-21T09:34:48-05:00"
                    id: 1
                    active: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed response:
                  value:
                    Status:
                      status: FAILED
                      reason: BR
                      message: El campo name es obligatorio
                      date: "2021-09-21T09:34:48-05:00"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed authentication:
                  value:
                    status:
                      status: FAILED
                      reason: "401"
                      message: the authentication does not contain all required parameters (login, tranKey, seed, nonce)
                      date: "2021-09-21T09:34:48-05:00"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  "$ref": "#/components/schemas/Autentication"
                data:
                  "$ref": "#/components/schemas/Customer-create"
              required:
                - auth
                - data
            examples:
              Merchant creation request:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjE1MWQ4MDE5YWViMw==
                    seed: "2021-09-27T09:41:05-05:00"
                  data:
                    name: Merchant name
                    brand: Merchant brand
                    mcc: "0742"
                    active: true
                    timezone: America/Bogota
                    size: XS
                    url: "http://www.example.com"
                    incrementType: IPC
                    languages:
                      - ES
                    currencies:
                      - COP
                    document:
                      type: NIT
                      number: "123456123"
                    address:
                      street: Direccion del customer
                      city: Medellin
                      state: 1
                      country: CO
                      postalCode: "050031"
                      phone: "3111111111"
                    legalRepresentative:
                      name: legal representative name
                      surname: legal representative surname
                    billing:
                      contact: billing contact name
                      mail: user_email@example.com
                      registrationNumber: "123456789"
                      taxType: 5
                      taxRegime: 2
                      organizationType: 1
                      ciiu: "1224"
                    travelAgency:
                      dispersion: true
                      iata: "123456"
                    control:
                      seller: 1
                      reseller: 1
                      paymentFacilitator: 1
      tags:
        - Merchant actions
      x-internal: false
  "/core/merchant/update":
    post:
      summary: Edit a merchant
      operationId: post-core-merchant-update
      description: This service allows updating the data of an existing merchant. If the process is successful, it returns the merchant identifier and its activation status.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
                  id:
                    type: integer
                    example: 1
                    description: Identifier of the edited merchant.
                  active:
                    type: boolean
                    description: Merchant status.
              examples:
                Successful update:
                  value:
                    status:
                      status: OK
                      reason: "00"
                      message: The request has been processed successfully
                      date: "2021-09-21T09:34:48-05:00"
                    id: 1
                    active: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed process:
                  value:
                    Status:
                      status: FAILED
                      reason: BR
                      message: El campo id es obligatorio
                      date: "2021-09-21T09:34:48-05:00"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed authentication:
                  value:
                    status:
                      status: FAILED
                      reason: "401"
                      message: the authentication does not contain all required parameters (login, tranKey, seed, nonce)
                      date: "2021-09-21T09:34:48-05:00"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  "$ref": "#/components/schemas/Autentication"
                id:
                  type: integer
                  description: Identifier of the merchant to edit.
                data:
                  "$ref": "#/components/schemas/Customer-update"
              required:
                - auth
                - id
                - data
            examples:
              Merchant update:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjE1MWQ4MDE5YWViMw==
                    seed: "2021-09-27T09:41:05-05:00"
                  id: 1
                  data:
                    name: Merchant update name
                    brand: Merchant update brand
                    mcc: "0763"
                    active: false
                    timezone: America/Costa_Rica
                    size: M
                    document:
                      type: NIT
                      number: "32145632"
                    incrementType: SMLMV
                    languages:
                      - EN
                    currencies:
                      - USD
        description: ""
      parameters: []
      tags:
        - Merchant actions
    parameters: []
  "/core/merchant/search":
    post:
      summary: Merchant query
      operationId: post-core-merchant-search
      description:
        "This service allows querying existing merchants filtering by the parameters: identifier, name, brand, and merchant status.\n\n> ### Note \n>\n> *It is not required to enter all parameters for the filter.*\n\nIf you need custom pagination, you must send the 'pagination' parameter along with the search filters."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
                  data:
                    type: array
                    description: Array containing the information of queried merchants.
                    items:
                      "$ref": "#/components/schemas/Customer"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                    x-stoplight:
                      id: phhs2nzdvtbvk
              examples:
                Respuesta exitosa:
                  value:
                    status:
                      status: OK
                      reason: "00"
                      message: The request has been processed successfully
                      date: "2021-09-21T09:34:48-05:00"
                    data:
                      - name: Merchant name
                        brand: Merchant brand
                        mcc: "0742"
                        active: true
                        timezone: America/Bogota
                        size: XS
                        url: http://www.example.com
                        incrementType: IPC
                        languages:
                          - ES
                        currencies:
                          - COP
                        document:
                          type: NIT
                          number: "123456123"
                        address:
                          street: Customer address
                          city: Medellin
                          state: 1
                          country: CO
                          phone: "3111111111"
                        legalRepresentative:
                          name: legal representative name
                          surname: legal representative surname
                        billing:
                          contact: billing contact name
                          mail: user_email@example.com
                          registrationNumber: "123456789"
                          taxType: 5
                          taxRegime: 2
                          organizationType: 1
                          ciiu: "1224"
                        travelAgency:
                          dispersion: true
                          iata: "1234"
                        control:
                          seller: 1
                          reseller: 1
                          paymentFacilitator: 1
                    pagination:
                      total: 30
                      perPage: 10
                      currentPage: 1
                      lastPage: 1
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed response:
                  value:
                    Status:
                      status: FAILED
                      reason: BR
                      message: The id field must be an integer
                      date: "2021-09-21T09:34:48-05:00"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed authentication:
                  value:
                    status:
                      status: FAILED
                      reason: "401"
                      message: the authentication does not contain all required parameters (login, tranKey, seed, nonce)
                      date: "2021-09-21T09:34:48-05:00"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  "$ref": "#/components/schemas/Autentication"
                id:
                  type: integer
                  example: 1
                  description: Merchant identifier.
                name:
                  type: string
                  maxLength: 80
                  example: Merchant name
                  description: Merchant name.
                  minLength: 3
                brand:
                  type: string
                  maxLength: 60
                  example: Merchant brand
                  description: Marca del comercio.
                  minLength: 3
                active:
                  type: boolean
                  default: true
                  description: Merchant status.
                pagination:
                  type: object
                  x-stoplight:
                    id: ir0ueruqp05mr
                  description: "Object containing the pagination parameters "
                  properties:
                    perPage:
                      type: integer
                      x-stoplight:
                        id: 81vffigq5jsc3
                      default: 15
                      example: 15
                      minimum: 1
                      description: Number of records per page to query
                    currentPage:
                      type: integer
                      x-stoplight:
                        id: 8uaglau4sgnpu
                      default: 1
                      example: 1
                      minimum: 1
                      description: Current page to query
              required:
                - auth
            examples:
              Merchant query:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjE1MWQ4MDE5YWViMw==
                    seed: "2021-09-27T09:41:05-05:00"
                  id: 1
                  name: Merchant name
                  brand: Merchant brand
                  active: true
                  pagination:
                    perPage: 15
                    currentPage: 1
        description: ""
      tags:
        - Merchant actions
    parameters: []
