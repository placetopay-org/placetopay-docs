        description: ""
      description: This service allows updating a site with the supplied information. If the response is successful, it returns the site identifier and its status.
      tags:
        - Site actions
    parameters: []
  "/core/site/update":
    post:
      summary: Update site branding
      operationId: post-core-site-update
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Site identifier
                    example: 1
                  name:
                    type: string
                    description: Site name
                    example: Site CO
                  displayName:
                    type: string
                    description: Site display name
                    example: Site display Name
                  document:
                    type: string
                    description: Merchant document
                    example: 123596822
                  documentType:
                    type: string
                    description: Merchant document type
                    example: CC
                  merchant:
                    type: string
                    description: Merchant name
                    example: Customer CO
                  merchantBrand:
                    type: string
                    description: Merchant brand
                    example: Customer brand CO
                  email:
                    type: string
                    description: Site email
                  supportEmail:
                    type: string
                    nullable: true
                    description: Site support email
                  allowedIP:
                    type: string
                    nullable: true
                    description: Ips autorizadas para ingresar al sistema
                    example: '127.0.0.1'
                  allowPartial:
                    type: boolean
                    description: Indicates whether the merchant allows partial payment
                    example: false
                  allowMulticredit:
                    type: boolean
                    description: Indicates whether payments to different destinations are allowed, only for PSE payment method
                  state:
                    type: string
                    description: Indicates whether the site is ACTIVE or INACTIVE
                    example: ACTIVE
                  currency:
                    type: string
                    description: Site currency
                    example: COP
                  country:
                    type: string
                    description: Merchant country
                    example: CO
                  locale:
                    type: string
                    description: Language selected for the site
                    example: 'EN'
                  locales:
                    type: array
                    description: Languages supported by the merchant
                    example: ['EN', 'ES']
                  expireOn:
                    type: string
                    nullable: true
                    description: Site expiration date
                    example: '2030-05-19 17:59:55'
                  logoUrl:
                    type: string
                    description: Site logo URL
                  cssUrl:
                    type: string
                    description: Styles file URL
                  analyticsCode:
                    type: string
                    nullable: true
                    description: "Google Analytics or Tag Manager code; if both, they are separated by comma ','."
                    example: 'UA-171315311-4, GTM-123422'
                  notificationUrl:
                    type: string
                    nullable: true
                    description: URL for notification of changes in transactions in redirection requests
                  inlineJs:
                    type: string
                    nullable: true
                    description: HTML code added to the redirection pages
                  allowedCurrencies:
                    type: array
                    description: Currencies supported by the merchant
                    example: ['COP', 'USD', 'CRC']
                  kount:
                    type: object
                    description: Contains information about the integration with Kount
                    properties:
                      apiKey:
                        type: string
                        description: Integration key
                        example: 'fakeAPIKey'
                      sandbox:
                        type: boolean
                        description: Indicates whether the site is in testing mode
                      website:
                        type: string
                        description: Category or activity with which the information will travel to Kount
                        example: DEFAULT
                      merchant:
                        type: string
                        description: Gateway code to identify itself in Kount
                  md5Hash:
                    type: string
                    description: Algoritmo de enmascaramiento de datos
                  onboardingToken:
                    type: string
                    nullable: true
                    description: Access token for the onBoarding system
                    example: 'FakeToken_cS44IiK58uganjnor5ksl3anjdc5sdas4fcavsn4xas8qD4TCbE5J1jIr'
                  credentials:
                    type: object
                    properties:
                      login:
                        type: string
                        description: Site login
                        example: 'fake_login_942f5d58306357c8f6272'
                      tranKey:
                        type: string
                        description: Site transaction key
                        example: 'fake_traneky_zgo6HQRp'
                      expireOn:
                        type: string
                        nullable: true
                        description: Site expiration date
                    description: Object containing site credential information
                  integrations:
                    type: object
                    description: Structure containing the integrations.
                    properties:
                      paygate:
                        type: object
                        properties:
                          return_url:
                            type: string
                            format: uri
                          md5_hash:
                            type: string
                            maxLength: 255
                          soap_username:
                            type: string
                            maxLength: 255
                          soap_password:
                            type: string
                            maxLength: 255

                      invoice_settle:
                        type: object
                        properties:
                          handler:
                            type: string
                            maxLength: 200
                          url:
                            type: string
                            maxLength: 255
                          username:
