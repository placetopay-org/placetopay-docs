        description: ""
      description: This service allows creating a site with the supplied information. If the response is successful, it returns the identifier, status, login, and transaction key of the site.
      tags:
        - Site actions
    parameters: []
  "/core/site/update-all":
    post:
      summary: Update a site
      operationId: post-core-site-update-all
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
                  id:
                    type: integer
                    example: 15
                    description: Identifier of the updated site.
                  active:
                    type: boolean
                    default: true
                    description: Site status indicator.
              examples:
                Respuesta exitosa:
                  value:
                    status:
                      status: OK
                      reason: "00"
                      message: The request has been processed successfully.
                      date: "2021-09-21T09:34:48-05:00"
                    id: 15
                    active: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed response:
                  value:
                    Status:
                      status: FAILED
                      reason: BR
                      message: El campo id es obligatorio.
                      date: "2021-09-21T09:34:48-05:00"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    "$ref": "#/components/schemas/Status"
              examples:
                Failed authentication:
                  value:
                    status:
                      status: FAILED
                      reason: "401"
                      message: the authentication does not contain all required parameters (login, tranKey, seed, nonce)
                      date: "2021-09-21T09:34:48-05:00"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - auth
                - id
                - data
              properties:
                auth:
                  "$ref": "#/components/schemas/Autentication"
                id:
                  type: integer
                  example: 15
                  description: Site identifier.
                data:
                  type: object
                  description: Information of the site to update.
                  properties:
                    login:
                      type: string
                      maxLength: 32
                      example: aabbccdd1234567890aabbccdd123456
                      description: Login del sitio.
                    tranKey:
                      type: string
                      description: Llave transaccional de sitio.
                      maxLength: 32
                      example: ABC123example456trankey+789abc012def3456ABC=
                    md5Hash:
                      type: string
                      description: Algoritmo de enmascaramiento de datos.
                      maxLength: 32
                      example: e0xy799SGB3zj689
                    name:
                      type: string
                      description: Site name.
                      maxLength: 128
                      example: Updated name
                    displayName:
                      type: string
                      example: Update display name
                      maxLength: 128
                      description: Site display name.
                    type:
                      type: string
                      description: Transaction origin.
                      enum:
                        - INT
                        - POS
                        - IVR
                        - REC
                        - ONE
                        - AIR
                      example: INT
                      maxLength: 3
                    category:
                      type: string
                      description: Categoria del sitio.
                      enum:
                        - ECOMMERCE
                        - COLLECT
                      example: ECOMMERCE
                    email:
                      type: string
                      format: email
                      maxLength: 80
                      example: test@test.com
                      description: Notification email.
                    currency:
                      type: string
                      description: Moneda predeterminada.
                      maxLength: 3
                      example: USD
                    language:
                      type: string
                      description: Idioma predeterminado.
                      maxLength: 2
                      example: ES
                    active:
                      type: boolean
                      description: Indicador del estado del sitio.
                    customBatch:
                      type: number
                      example: 1235665
                    " expiration":
                      type: string
                      format: date-time
                      description: Expiration date.
                    onTest:
                      type: boolean
                      description: Test site indicator.
                    productionDate:
                      type: string
                      description: Production release date.
                      default: null
                      nullable: true
                      format: date
                      example: 2024-01-01
                    integration:
                      type: object
                      description: Object with site integration information.
                      properties:
                        allowPartial:
                          type: boolean
                          description: Indicador de pago parcial.
