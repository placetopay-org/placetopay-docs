    Invoice-create:
      title: Invoice create
      type: object
      description: Structure containing the information to create an invoice.
      x-examples:
      properties:
        payment:
          type: object
          description: Information about the invoice payment.
          properties:
            reference:
              type: string
              description: Invoice reference.
              minLength: 1
              maxLength: 30
            description:
              type: string
              description: Payment description.
              maxLength: 255
            amount:
              type: object
              description: Structure containing the information about the invoice amount.
              properties:
                total:
                  type: number
                  description: Total invoice amount.
                  format: decimal
                  maximum: 9999999999.99
                currency:
                  type: string
                  description: Moneda acorde al ISO 4217 (alphabetic code).
                  maxLength: 3
                  example: COP
                taxes:
                  type: object
                  description: Structure containing the information about invoice taxes.
                  properties:
                    kind:
                      type: string
                      description: Tax classification type.
                    amount:
                      type: number
                      description: Valor del impuesto.
                      format: decimal
                    base:
                      type: number
                      description: Base value to calculate the tax.
                      format: decimal
                  required:
                    - kind
                    - amount
                    - base
              required:
                - total
                - currency
            modifiers:
              type: object
              description: Structure containing the information about the invoice payment modifiers.
              properties:
                type:
                  type: string
                  description: Tipo de modificador.
                  enum:
                    - FEDERAL_GOVERNMENT
                code:
                  type: string
                  description: Modifier code.
                  enum:
                    - 17934
                    - 18083
                    - 18910
                    - 18999
                    - 19210
                additional:
                  type: object
                  description: Additional modifier information.
              required:
                - type
                - code
          required:
            - reference
            - amount
        debtor:
          type: object
          description: Invoice debtor information.
          properties:
            document:
              type: string
              description: "Debtor's document number."
              maxLength: 16
            documentType:
              type: string
              description: "Debtor's document type."
            name:
              type: string
              description: Debtor name.
            surname:
              type: string
              description: Apellidos del deudor.
          required:
            - document
            - documentType
        altReference:
          type: string
          description: Invoice alternate reference.
          minLength: 1
          maxLength: 30
        date:
          type: string
          description: Invoice creation date.
          format: date
          example: 2025-01-01
        dueType:
          type: number
          description: "Increment type at due date. Indicates whether the increment at due date is a daily value [0], fixed value [1], or daily generation [2]."
          enum:
            - 0
            - 1
            - 2
        dueDate:
          type: string
          description: Invoice due date and time.
          format: date-time
        dueRate:
          type: number
          description: Valor a acrecentar a la factura vencida.
          format: decimal
        secondDueDate:
          type: string
          description: Second due date of the invoice.
          format: date
          example: 2025-02-02
        secondDueRate:
          type: number
          description: Charge after the second due date. Required if secondDueDate is sent
          format: decimal
        expiration:
          type: string
          description: Invoice expiration date and time.
          format: date-time
        serviceCode:
          type: number
          description: Code of the invoiced service or product.
          maxLength: 13
          minLength: 1
        siteId:
          type: integer
          description: Site identifier. Required if the site parameter is not sent.
      required:
        - payment
        - debtor
        - serviceCode
        - expiration
    Invoice:
      title: "Invoice"
      type: "object"
      description: "Structure that contains information about a payment order."
      properties:
        id:
          type: integer
          description: "Unique identifier of the payment order generated by the system."
          example: 675978
        status:
          type: string
          description: "Status of the payment order."
          enum:
            - PAYED
            - EXPIRED
            - ACTIVE
            - INACTIVE
            - HOLD
          example: "EXPIRED"
        debtor:
          $ref: "#/components/schemas/Debtor"
        payment:
          $ref: "#/components/schemas/Payment"
        altReference:
          type: string
          description: "Alternate code of the payment order."
          maxLength: 30
          example: "02019039"
          pattern: '^[0-9A-Za-z_\-\s]+$'
        createdAt:
          type: string
          format: date-time
          description: "Date and time when the payment order was created."
          example: "2020-07-28T08:00:47-05:00"
        expirationDate:
          type: string
          format: date-time
          description: "Date and time when the payment order expires in the system."
          example: "2021-03-25T10:14:24-05:00"
        finalDate:
          type: string
          format: date-time
          description: "Final date and time allowed for payment."
          example: "2020-07-28T23:59:59-05:00"
        dueType:
          type: integer
          enum:
            - 0
            - 1
            - 2
          description: |
            Type of increment after due date

            1 = fixed

            0 = daily. 

            The way the surcharge will be applied.
            If daily, it is calculated according to the number of days after the due date;
            if fixed, the same amount is applied regardless of the number of days overdue.
          example: 1
        dueRate:
          type: number
          format: float
          description: "Amount added to the overdue payment order."
          example: 5.5
        dueDate:
          type: string
          format: date-time
          description: "Due date and time of the payment order."
          example: "2021-03-25T10:14:24-05:00"
        expiration:
          type: string
          format: date-time
          description: "Expiration date and time of the payment order."
          example: "2021-03-25T10:14:24-05:00"
        serviceCode:
          type: integer
          description: "Code of the billed service or product."
          example: 999
          minLength: 1
          maxLength: 13
        siteId:
          type: integer
          description: "Site identifier."
          example: 40
      required:
        - id
        - status
        - debtor
        - payment
        - createdAt
        - expirationDate
        - finalDate
        - serviceCode
        - siteId
    Invoices:
      title: "Invoices"
      type: "array"
      description: "Structure that contains information about a payment orders."
      items:
        $ref: "#/components/schemas/Invoice"
    Debtor:
      title: "Debtor"
      type: "object"
      description: "Structure containing information about the debtor of the payment order."
      properties:
        document:
          type: string
          description: "Debtor’s document number."
          maxLength: 16
          example: "1234567899"
        documentType:
          type: string
          description: "Type of debtor document."
          enum:
            - "CC"
            - "CE"
            - "TI"
            - "NIT"
            - "RUT"
            - "PPN"
            - "TAX"
            - "LIC"
            - "SSN"
            - "CIP"
            - "CPF"
            - "CI"
            - "RUC"
            - "DNI"
            - "CLRUT"
          example: "CC"
        name:
          type: string
          description: "Debtor’s first name."
          example: "ANDREA"
        surname:
          type: string
          description: "Debtor’s last name."
          example: "VIDAL FERNANDEZ"
        email:
          type: string
          description: "Debtor’s email address."
          example: "example@mail.com"
      required:
        - document
        - documentType
        - name

    Payment:
      title: "Payment"
      type: "object"
      description: "Structure containing payment information."
      properties:
        reference:
          type: string
          description: "Reference number."
          maxLength: 32
          example: "1234567890129"
          pattern: '^[0-9A-Za-z_\-\s]+$'
        description:
          type: string
          description: "Description of the payment."
          maxLength: 255
          example: "E993"
        amount:
          $ref: "#/components/schemas/Amount"
        allowPartial:
          type: boolean
          description: "Indicates whether partial payments are allowed."
          example: false
        subscribe:
          type: boolean
          description: "Indicates whether subscription is allowed."
          example: false
      required:
        - reference
        - amount
    Amount:
      title: "Amount"
      type: "object"
      description: "Structure that contains information about the payment order amount."
      properties:
        taxes:
          type: array
          description: "Details of the applied taxes."
          items:
            $ref: "#/components/schemas/Tax"
        details:
          type: array
          description: "Additional details of the payment order."
          items:
            $ref: "#/components/schemas/AmountDetail"
        currency:
          type: string
          description: "Transaction currency (ISO 4217)."
          example: "USD"
        total:
          type: number
          format: float
          description: "Total amount of the payment order (maximum 9,999,999,999.99)."
          example: 30.12
      required:
        - currency
        - total
    Tax:
      title: "Tax"
      type: "object"
      description: "Structure containing information about an applied tax."
      properties:
        kind:
          type: string
          description: "Tax classification type."
          example: "valueAddedTax"
        amount:
          type: number
          format: float
          description: "Tax amount."
          example: 0
        base:
          type: number
          format: float
          description: "Base amount used to calculate the tax."
          example: 0
      required:
        - kind
        - amount
        - base

    AmountDetail:
      title: "AmountDetail"
      type: "object"
      description: "Structure for storing information about an additional value."
      properties:
        kind:
          type: string
          description: "Type of additional value."
          enum:
            - discount
            - additional
            - vatDevolutionBase
            - shipping
            - handlingFee
            - insurance
            - giftWrap
            - subtotal
            - fee
            - tip
          example: "subtotal"
        amount:
          type: number
          format: float
          description: "Monetary value corresponding to the type of additional value."
          example: 30.12
      required:
        - kind
        - amount

  securitySchemes:
  responses:
