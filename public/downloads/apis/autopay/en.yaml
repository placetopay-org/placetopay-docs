                        minLength: 1
                        maxLength: 60
                        description: Name of the person or company
                        example: John
                      surname:
                        type: string
                        minLength: 1
                        maxLength: 60
                        description: Last name of the person. Does not apply when the type of document corresponds to that of a company
                        example: Doe
                      company:
                        type: string
                        minLength: 1
                        maxLength: 60
                        description: |
                          Name of the company to which the person belongs

                          e.g.: `Placetopay`
                        example: Evertec
                      email:
                        type: string
                        minLength: 1
                        maxLength: 80
                        example: johndoe@app.com
                        description: |
                          Email of the user or company

                          e.g.: `juan.perez@example.com`
                      mobile:
                        type: string
                        minLength: 1
                        maxLength: 30
                        description: |
