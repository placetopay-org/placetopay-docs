                            description: 'Informative start date of the recurrence, format YYYY-MM-DD. Only used in self-pay sessions.'
                            example: '2019-08-24'
                        examples:
                          - type: TOTAL_BALANCE
                            periodicity: M
                            interval: 1
                            nextPayment: '2019-08-24'
                            dueDate: '2019-09-24'
