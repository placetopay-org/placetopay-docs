                            description: 'The country in which the address is located. [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) code.'
                            minLength: 2
                            maxLength: 2
                            example: CO
                          state:
                            type: string
                            maxLength: 3
                            description: 'State/province/department. [ISO 3166-2](https://en.wikipedia.org/wiki/ISO_3166-2) code'
