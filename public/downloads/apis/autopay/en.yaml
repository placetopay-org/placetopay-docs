              paymentMethodName:
                type: string
                description: Name of the payment method used..
                minLength: 1
                maxLength: 255
                example: Visa
              issuerName:
                type: string
                description: Name of the issuer or processor.
                minLength: 1
                maxLength: 255
                example: 'JPMORGAN CHASE BANK, N.A.'
              amount:
                title: AmountConversion
                type: object
                description: |
                  Structure to define the conversion factor and values.
                properties:
                  from:
                    $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/amount/properties/to'
                  to:
                    title: AmountBase
                    type: object
                    description: |
                      Structure that represents a quantity that defines the currency and the total.
                    properties:
                      'currency ':
                        type: string
                        minLength: 3
                        maxLength: 3
                        description: |
                          Currency according to [ISO 4217 alpha code](https://en.wikipedia.org/wiki/ISO_4217).
                        example: COP
                      'total ':
                        type:
                          - number
                        description: |
                          Total value.
                        example: 10000
                  factor:
                    type:
                      - number
                      - string
                    minLength: 1
                    maxLength: 20
                    example: 1
                    description: Conversion factor
              receipt:
                type: string
                minLength: 1
                maxLength: 255
                description: Transaction receipt number.
                example: 052617800175
              franchise:
                type: string
                minLength: 1
                maxLength: 5
                description: Franchise of the card used.
                example: PS_VS
              refunded:
                type: boolean
                description: It is used to define if the transaction has been reversed
                default: false
              authorization:
                type: string
                minLength: 1
                maxLength: 255
                description: Authorization code.
                example: '965960'
              processorFields:
                type: array
                description: 'Structure that may vary over time depending on the information available for the payment method. See more in [Processing data](/en/checkout/processor-fields)'
                items:
                  $ref: '#/components/schemas/RedirectInformation/properties/subscription/properties/instrument/items'
              dispersion:
                type: array - 'null'
                description: Structure containing dispersion information
                items:
                  title: Transaction Dispersion
                  x-stoplight:
                    id: sc9t9q5yfgeuj
                  type: object
                  description: |
                    Structure containing information about the sparse transaction process.
                  examples:
                    - status:
                        status: APPROVED
                        reason: '00'
                        message: The petition has been successfully approved
                        date: '2022-07-27T14:51:27-05:00'
                      agreement: null
                      agreementType: null
                      authorization: '965960'
                      receipt: 052617800175
                      amount:
                        from:
                          'currency ': COP
                          'total ': 10000
                        to:
                          'currency ': COP
                          'total ': 10000
                        factor: 1
                      refunded: false
                      paymentMethod: visa
                  properties:
                    status:
                      $ref: '#/components/schemas/RedirectInformation/properties/subscription/properties/status'
                    agreement:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/agreement'
                    agreementType:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/agreementType'
                    authorization:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/authorization'
                    receipt:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/receipt'
                    amount:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/amount'
                    refunded:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/refunded'
                    paymentMethod:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/paymentMethod'
              agreement:
                type:
                  - integer
                  - 'null'
                  - number
                description: Transaction recipient identifier. For the main site of the transaction.
                example: 186
              agreementType:
                type:
                  - enum
                  - 'null'
                description: Dispersion type
                enum:
                  - MERCHANT
                  - AIRLINE
                example: MERCHANT
              discount:
                type:
                  - object
                  - 'null'
                properties:
                  base:
                    type: number
                    example: 3000
                  code:
                    type: string
                    minLength: 1
                    maxLength: 255
                    example: '17934'
                  type:
                    type: string
                    example: FRANCHISE
                  amount:
                    type: number
                    example: 1000
        subscription:
          description: 'Structure that contains information for the subscription payment method. For autopays, this value is **null**.'
          title: SubscriptionResponse
          type: object
          examples:
            - status:
                status: OK
                reason: '00'
                message: The petition has been successfully approved
                date: '2022-07-27T14:51:27-05:00'
              type: token
              instrument:
                - keyword: token
                  value: faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
                  displayOn: none
                - keyword: subtoken
                  value: '8740257204881111'
                  displayOn: none
                - keyword: franchise
                  value: visa
                  displayOn: none
                - keyword: franchiseName
                  value: Visa
                  displayOn: none
                - keyword: issuerName
                  value: 'JPMORGAN CHASE BANK, N.A.'
                  displayOn: none
                - keyword: lastDigits
                  value: '1111'
                  displayOn: none
                - keyword: validUntil
                  value: '2029-12-31'
                  displayOn: none
                - keyword: installments
                  value: null
                  displayOn: none
          properties:
            status:
              title: Status
              description: |
                Structure that contains the response information about a request or payment, and reports the current status of the same.
              type: object
              properties:
                status:
                  type: enum
                  description: Status of a request or payment
                  example: APPROVED
                  enum:
                    - APPROVED
                    - PENDING
                    - PENDING_CONFIRMATION
                    - REJECTED
                    - APPROVED_PARTIAL
                    - PARTIAL_EXPIRED
                    - FAILED
                reason:
                  type:
                    - string
                    - number
                    - 'null'
                  maxLength: 255
                  description: |
                    Reason Code Provided.
                  example: '00'
                message:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                  description: |
                    Description of the reason code.
                  example: The petition has been successfully approved
                date:
                  type: string
                  maxLength: 35
                  format: date-time
                  description: |
                    Date and time when the payment status is generated. [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) Format.
                  example: '2022-07-27T14:51:27-05:00'
            type:
              type: enum
              description: Defines type of subscription that is returned
              example: token
              enum:
                - token
                - cuenta
            instrument:
              type: array
              items:
                title: NameValuePair
                description: |
                  Structure to relate additional data in the process.
                type: object
                properties:
                  keyword:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: |
                      Identifier or index of the data to be attached.   
                      e.g.: `cmsInvoiceId`
                    example: '1111'
                  value:
                    type:
                      - string
                      - object
                      - array
                      - number
                      - boolean
                    minLength: 1
                    maxLength: 255
                    description: |
                      Value of the data to be attached.   
                      e.g.: `ID_2233`
                    example: lastDigits
                  displayOn:
                    type: enum
                    description: |
                      Indicates under what conditions the attached data is displayed. See more in [Additional Fields](/en/checkout/additional-fields)

                      One of: `none`, `payment`, `receipt`, `both`, `approved`.
                    example: none
                examples:
                  - value: '468232'
                    keyword: merchantCode
                    displayOn: none
                  - value:
                      code: '1'
                      type: '03'
                      groupCode: X
                      installments: 3
                    keyword: credit
                    displayOn: none
                  - value: 2056
                    keyword: totalAmount
                    displayOn: none
                  - value: 685.33
                    keyword: installmentAmount
                    displayOn: none
