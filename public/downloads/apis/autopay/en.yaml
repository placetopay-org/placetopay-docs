                  instrument:
                    type: object
                    description: Structure containing information about the payment method associated with the AutoPay.
                    properties:
                      token:
                        title: Token
                        type: object
                        description: |-
                          Structure that contains the token information associated with the card.
                          For entry, only the token or subtoken and the cvv are necessary if it is an operation where the user is present.
                          For output if all data is returned when tokenizing.
                        properties:
                          token:
                            type: string
                            maxLength: '64'
