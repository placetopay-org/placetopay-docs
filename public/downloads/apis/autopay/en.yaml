                    - AGENT
                    - CARDHOLDER_COF
                    - CARDHOLDER_RECURRING_VARIABLE_AMOUNT
                    - CARDHOLDER_RECURRING_FIXED_AMOUNT
                    - CARDHOLDER_WITH_INSTALLMENTS
                    - MERCHANT_COF
                    - MERCHANT_RECURRING_VARIABLE_AMOUNT
                    - MERCHANT_RECURRING_FIXED_AMOUNT
                    - MERCHANT_WITH_INSTALLMENTS
                  description: Indicates that the session will be processed by an agent using the cardholder's data
                EBTDeliveryIndicator:
                  type: string
                  enum:
                    - DIRECT_DELIVERY
                    - CUSTOMER_PICKUP
                    - COMMERCIAL_SHIPPING
                    - OTHER
                    - NOT_AVAILABLE
                  description: ' (Required for EBT payments): Defines the delivery type'
                openingDate:
                  type: string
                  description: 'Account creation date (format: ''YYYY-MM-DD''). Required for PSE in merchants with “Financial Services” category.'
                beneficiaryId:
                  type: string
                  description: Beneficiary ID linked to the receiving account in a PSE transaction. Required for merchants in the “Financial Services” category
                kount:
                  type: object
                  description: Additional information about the transaction that can be used for risk analysis and fraud prevention.
                  properties:
                    account:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        creationDateTime:
                          type: string
                          format: date-time
                        username:
                          type: string
                        accountIsActive:
                          type: boolean
                    loyalty:
                      type: object
                      properties:
                        id:
                          type: string
                        description:
                          type: string
                        credit:
                          type: object
                          properties:
                            creditType:
                              type: string
                            amount:
                              type: integer
                            currency:
                              type: string
                              description: Currency code (ISO 4217)
                    promotions:
                      type: object
                      properties:
                        id:
                          type: string
                        description:
                          type: string
                        status:
                          type: string
                        statusReason:
                          type: string
                        discount:
                          type: object
                          properties:
                            percentage:
                              type: number
                            amount:
                              type: integer
                            currency:
                              type: string
                              description: Currency code (ISO 4217)
                        credit:
                          type: object
                          properties:
                            creditType:
                              type: string
                            percentage:
                              type: number
                            currency:
                              type: string
                              description: Currency code (ISO 4217)
                            amount:
                              type: integer
                    links:
                      type: object
                      properties:
                        viewOrderUrl:
                          type: string
                          format: uri
                        requestRefundUrl:
                          type: string
                          format: uri
                        buyAgainUrl:
                          type: string
                          format: uri
                        writeReviewUrl:
                          type: string
                          format: uri
                    advertising:
                      type: object
                      properties:
                        channel:
                          type: string
                        affiliate:
                          type: string
                        subAffiliate:
                          type: string
                        writeReviewUrl:
                          type: string
                          format: uri
                        events:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              value:
                                type: string
                        campaign:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                    shipping:
                      type: object
                      properties:
                        type:
                          type: string
                          description: 'Type of shipping ("SHIPPED", "DIGITAL", "STORE_PICK_UP", "LOCAL_DELIVERY", "STORE_DRIVE_UP", "IN_PERSON").'
                        provider:
                          type: string
                          description: Name of the shipping or delivery provider.
                        trackingNumber:
                          type: string
                          description: Tracking number provided by the carrier.
                        shippingMethod:
                          type: string
                          description: 'Delivery method ("STANDARD", "EXPRESS", "SAME_DAY", "NEXT_DAY", "SECOND_DAY").'
                        store:
                          type: object
                          properties:
                            address:
                              type: object
                              properties:
                                street:
                                  type: string
                                  description: Street address of the store.
                                city:
                                  type: string
                                state:
                                  type: string
                                postalCode:
                                  type: string
                                country:
                                  type: string
                                phone:
                                  type: string
                                  description: Store contact phone number.
                        accessUrl:
                          type: string
                          format: uri
                          description: URL for accessing shipping or download information.
                        digitalDownloaded:
                          type: boolean
                          description: Indicates whether the digital product has been downloaded.
                        downloadDeviceIp:
                          type: string
                          format: ipv4
                          description: IP address of the device used for download.
                    store:
                      type: object
                      description: Information about the physical store associated with the transaction.
                      properties:
                        id:
                          type: string
                          description: Store identifier.
                          example: STORE001
                        name:
                          type: string
                          description: Store name.
                          example: Sucursal centro
                        address:
                          type: object
                          description: Store address.
                          properties:
                            line1:
                              type: string
                              description: First line of the address.
                              example: calle 80
                            line2:
                              type: string
                              description: Second line of the address.
                              example: casa 3
                            city:
                              type: string
                              description: Store city.
                              example: Medellin
                            region:
                              type: string
                              description: Region or state of the store.
                              example: ANTIOQUIA
                            countryCode:
                              type: string
                              description: Country code (ISO 3166-1 alpha-2).
                              example: CO
                            postalCode:
                              type: string
                              description: Store postal code.
                              example: '10001'
                requiresConfirmation:
                  type: boolean
                  description: |
                    Indicates whether the transaction requires merchant confirmation before final processing.
                    When set to `true`, the transaction will be created in PENDING_CONFIRMATION state
                    and the merchant must call confirm or cancel via the transaction actions endpoint.
                  example: true
            autopay:
              title: AutopayRequest
              type: object
              required:
                - action
                - reference
                - description
              description: |
                Detail of the autopay to be generated. The user must register a payment method so that automatic charges are made on that payment method according to the agreed conditions. Required when `.type` is `autopay`.
              properties:
                action:
                  type: enum
                  description: |
                    Indicates the action to be performed with the autopay.
                    One of: `CREATE` to create an autopay, `EDIT` to edit an existing autopay.
                  enum:
                    - CREATE
                    - EDIT
                  example: CREATE
                reference:
                  title: Reference
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: |
                    Unique reference of the process. Maximum of 32 characters

                    e.g.: `PAYMENT_0001_ABC`
                  example: '12345'
                description:
                  title: Description
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: |
                    Description of the process to be carried out
                  example: Consumption for the month of May
                id:
                  $ref: '#/components/schemas/RedirectInformation/properties/autopay/oneOf/0/items/properties/id'
                  description: Required when `action` is `EDIT`. Identifier of the existing autopay.
                dueDay:
                  type: integer
                  minimum: 1
                  maximum: 28
                  description: |
                    For recurring payments with a monthly frequency, it corresponds to the payment cutoff day.
                    It is an informative value to indicate to the user the maximum expected day to make the payment.
                    It usually indicates that charges after this day may have surcharges or may not be available.    
                    E.g.: `15` for the fifteenth day of each month.
                  example: 15
                recurring:
                  title: AutopayRecurring
                  type: object
                  description: Required when `action` is `CREATE`. Indicates the recurrence conditions of the autopay.
                  required:
                    - type
                    - periodicity
                    - interval
                    - nextPayment
                  properties:
                    type:
                      type: string
                      description: |
                        Corresponds to the type of charge that the recurrence will have. Only used in self-pay sessions.
                        `FIXED`: The amount is fixed and was defined from the creation of the self-payment,
                        `MINIMUM_BALANCE`: The minimum amount to keep the recurrence active, defined by an external service,
                        `TOTAL_BALANCE`: The total defined in the asset, defined by an external service
                      enum:
                        - FIXED
                        - MINIMUM_BALANCE
                        - TOTAL_BALANCE
                      example: TOTAL_BALANCE
                    periodicity:
                      $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/periodicity'
                    interval:
                      $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/interval'
                    nextPayment:
                      $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/nextPayment'
                    dueDate:
                      $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/dueDate'
                  examples:
                    - type: TOTAL_BALANCE
                      periodicity: M
                      interval: 1
                      nextPayment: '2019-08-24'
                      dueDate: '2019-09-24'
                amount:
                  $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/amount'
                  description: Required when `recurring.type` is `FIXED`. Defines the fixed amount to be charged in each recurrence.
        autopay:
