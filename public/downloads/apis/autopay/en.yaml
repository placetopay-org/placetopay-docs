                            type: string
                            maxLength: 30
                            description: City of residence
                            example: Medellín
                          postalCode:
                            type: string
                            maxLength: 10
                            description: Postal code of the address
                            example: '55555'
                          street:
                            type: string
                            minLength: 1
                            maxLength: 128
                            description: Home address.
                            example: 'Calle 12 #33a-12, Apto 101'
                          phone:
                            type: string
                            maxLength: 20
                            description: Home phone number
                            example: '+573111111111'
                  buyer:
                    $ref: '#/components/schemas/RedirectInformation/properties/autopay/oneOf/0/items/properties/payer'
                  subscription:
                    type: object
                    description: Structure containing information about the subscription associated with the AutoPay.
                    properties:
                      reference:
                        $ref: '#/components/schemas/RedirectRequest/properties/autopay/properties/reference'
                      description:
                        $ref: '#/components/schemas/RedirectRequest/properties/autopay/properties/description'
                      amount:
                        $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/amount'
                      recurring:
                        title: AutopayRecurringResponse
                        type: object
                        description: Conditions of the autopay recurrence.
                        properties:
                          type:
                            $ref: '#/components/schemas/RedirectRequest/properties/autopay/properties/recurring/properties/type'
                          periodicity:
                            $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/periodicity'
                          interval:
                            $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/interval'
                          nextPayment:
                            $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/nextPayment'
                          dueDate:
                            $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/dueDate'
                          startDate:
                            type: string
