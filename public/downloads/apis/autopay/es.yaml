                    - CARDHOLDER_RECURRING_FIXED_AMOUNT
                    - CARDHOLDER_WITH_INSTALLMENTS
                    - MERCHANT_COF
                    - MERCHANT_RECURRING_VARIABLE_AMOUNT
                    - MERCHANT_RECURRING_FIXED_AMOUNT
                    - MERCHANT_WITH_INSTALLMENTS
