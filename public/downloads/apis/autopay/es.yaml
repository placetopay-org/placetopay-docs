                        `MINIMUM_BALANCE`: El monto minimo para mantener el la recurrencia activa, lo define un servicio externo,
                        `TOTAL_BALANCE`: El total definido en el activo, lo define un servicio externo
                      enum:
                        - FIXED
                        - MINIMUM_BALANCE
                        - TOTAL_BALANCE
                      example: TOTAL_BALANCE
                    periodicity:
                      $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/periodicity'
                    interval:
                      $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/interval'
                    nextPayment:
                      $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/nextPayment'
                    dueDate:
                      $ref: '#/components/schemas/RedirectInformation/properties/request/properties/payment/properties/recurring/properties/dueDate'
                  examples:
                    - type: TOTAL_BALANCE
