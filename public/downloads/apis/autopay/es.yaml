                          Estructura que contiene la información del token que asocia a la tarjeta
                          Para la entrada solo es necesario el token o el subtoken y el cvv si se trata de una operación donde el usuario está presente
                          Para la salida si se devuelven todos los datos al tokenizar 
                        properties:
                          token:
                            type: string
                            maxLength: '64'
                            minLength: '64'
                            description: Código generado para identificar la tarjeta en el sistema
                            example: faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
                          subtoken:
                            type: string
                            maxLength: '16'
                            minLength: '16'
                            description: Código alterno generado para identificar la tarjeta
                            example: '8740257204881112'
                          franchise:
                            type: string
                            minLength: 1
                            maxLength: 20
                            description: Codigo de la franquicia asociada al token (Solo como respuesta no es necesario enviarla)
                            example: '`visa`, `visa_electron`, `master`, `diners`'
                          franchiseName:
                            type: string
                            minLength: 1
                            maxLength: 20
                            example: '`Visa`,`Master`, `diners`'
                          issuerName:
                            $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/issuerName'
                          lastDigits:
                            type: string
                            maxLength: 4
                            example: '1111'
                          validUntil:
                            type: string
                            minLength: 1
                            maxLength: 10
                            format: date
                            description: Fecha de expiración de la tarjeta
                            example: 12/37
                          cvv:
                            type: string
                            minLength: 3
                            maxLength: 4
                            description: CVV solicitado al usuario en caso de que esté presente en la operación
                        x-examples:
                          Ejemplo respuesta:
                            value:
                              token: faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
                              subtoken: fakesubtoken00005
                              franchise: master
                              franchiseName: Mastercard
                              lastDigits: '0005'
                              validUntil: '2018-12-31'
                              installments: '3'
                          Ejemplo en solicitud:
                            value:
                              token: faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
                              cvv: '123'
                  additional:
                    type: object
                    description: Estructura que incluye datos adicionales del autopago.
                    properties:
                      dueDay:
                        type: string
                        $ref: '#/components/schemas/RedirectRequest/properties/autopay/properties/dueDay'
                      customerAccountNumber:
                        type: string
                        description: Dato opcional enviado al iniciar el proceso de Autopago.
                        example: '1234567890'
                  acceptedAt:
                    type: string
                    format: date-time
                    description: Fecha y hora en que se aceptó el autopago.
                    example: '2021-09-24T10:02:17-05:00'
        payment:
          description: Estructura con la información de la transacción registrada. Para autopagos este valor es **null**.
          type: array
          items:
            title: Transaction
            type: object
            description: |
              Estructura que contiene información sobre el proceso de pago de la transacción en Placetopay.
            examples:
              - status:
                  status: APPROVED
                  reason: '00'
                  message: La petición ha sido aprobada exitosamente
                  date: '2022-07-27T14:51:27-05:00'
                internalReference: 12345
                reference: '12345'
                paymentMethod: visa
                paymentMethodName: Visa
                issuerName: 'JPMORGAN CHASE BANK, N.A.'
                amount:
                  from:
                    'currency ': COP
                    'total ': 10000
                  to:
                    'currency ': COP
                    'total ': 10000
                  factor: 1
                receipt: 052617800175
                franchise: PS_VS
                refunded: false
                authorization: '965960'
                processorFields:
                  - keyword: '1111'
                    value: lastDigits
                    displayOn: none
                  - value:
                      code: '1'
                      type: '03'
                      groupCode: X
                      installments: 3
                    keyword: credit
                    displayOn: none
                  - value: 2056
                    keyword: totalAmount
                    displayOn: none
                dispersion: null
                agreement: null
                agreementType: null
                discount:
                  base: 3000
                  code: '17934'
                  type: FRANCHISE
                  amount: 1000
                subscription: null
            properties:
              status:
                $ref: '#/components/schemas/RedirectInformation/properties/subscription/properties/status'
              internalReference:
                type: integer
                description: Referencia interna única de la transacción
                example: 543423
              reference:
                $ref: '#/components/schemas/RedirectRequest/properties/autopay/properties/reference'
              paymentMethod:
                type: string
                description: Código del método de pago utilizado.
                minLength: 1
                maxLength: 255
                example: visa
              paymentMethodName:
                type: string
                description: Nombre del método de pago utilizado.
                minLength: 1
                maxLength: 255
                example: Visa
              issuerName:
                type: string
                description: Nombre del emisor o del procesador.
                minLength: 1
                maxLength: 255
                example: 'JPMORGAN CHASE BANK, N.A.'
              amount:
                title: AmountConversion
                type: object
                description: |
                  Estructura para definir el factor de conversión y los valores.
                properties:
                  from:
                    $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/amount/properties/to'
                  to:
                    title: AmountBase
                    type: object
                    description: |
                      Estructura que representa una cantidad que define la moneda y el total.
                    properties:
                      'currency ':
                        type: string
                        minLength: 3
                        maxLength: 3
                        description: |
                          Moneda acorde al [ISO 4217 alpha code](https://es.wikipedia.org/wiki/ISO_4217).
                        example: COP
                      'total ':
                        type:
                          - number
                        description: |
                          Valor total.
                        example: 10000
                  factor:
                    type:
                      - number
                      - string
                    minLength: 1
                    maxLength: 20
                    example: 1
                    description: Factor de conversión
              receipt:
                type: string
                minLength: 1
                maxLength: 255
                description: Numero de recibo de la transacción.
                example: 052617800175
              franchise:
                type: string
                minLength: 1
                maxLength: 5
                description: Franquicia de la tarjeta utilizada.
                example: PS_VS
              refunded:
                type: boolean
                description: Se utiliza para definir si la transacción ha sido reembolsada
                default: false
              authorization:
                type: string
                minLength: 1
                maxLength: 255
                description: Código de autorización.
                example: '965960'
              processorFields:
                type: array
                description: 'Estructura que  puede variar en el tiempo según la información disponible para el medio de pago.  Ver más en [Datos de procesamiento](/checkout/processor-fields)'
                items:
                  $ref: '#/components/schemas/RedirectInformation/properties/subscription/properties/instrument/items'
              dispersion:
                type: array - 'null'
                description: Estructura que contiene información de dispersión
                items:
                  title: Transaction Dispersion
                  x-stoplight:
                    id: sc9t9q5yfgeuj
                  type: object
                  description: |
                    Estructura que contiene información sobre el proceso de la transacción dispersada.
                  examples:
                    - status:
                        status: APPROVED
                        reason: '00'
                        message: La petición ha sido aprobada exitosamente
                        date: '2022-07-27T14:51:27-05:00'
                      agreement: null
                      agreementType: null
                      authorization: '965960'
                      receipt: 052617800175
                      amount:
                        from:
                          'currency ': COP
                          'total ': 10000
                        to:
                          'currency ': COP
                          'total ': 10000
                        factor: 1
                      refunded: false
                      paymentMethod: visa
                  properties:
                    status:
                      $ref: '#/components/schemas/RedirectInformation/properties/subscription/properties/status'
                    agreement:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/agreement'
                    agreementType:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/agreementType'
                    authorization:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/authorization'
                    receipt:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/receipt'
                    amount:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/amount'
                    refunded:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/refunded'
                    paymentMethod:
                      $ref: '#/components/schemas/RedirectInformation/properties/payment/items/properties/paymentMethod'
              agreement:
                type:
                  - integer
                  - 'null'
                  - number
                description: Identificador de destinatario de la transacción. Para el sitio principal de la transacción.
                example: 186
              agreementType:
                type:
                  - enum
                  - 'null'
                description: Tipo de dispersión
                enum:
                  - MERCHANT
                  - AIRLINE
                example: MERCHANT
              discount:
                type:
                  - object
                  - 'null'
                properties:
                  base:
                    type: number
                    example: 3000
                  code:
                    type: string
                    minLength: 1
                    maxLength: 255
                    example: '17934'
                  type:
                    type: string
                    example: FRANCHISE
                  amount:
                    type: number
                    example: 1000
        subscription:
          description: Estructura que contiene información para el método de pago suscripción. Para autopagos este valor es **null**.
          title: SubscriptionResponse
          type: object
          examples:
            - status:
                status: OK
                reason: '00'
                message: La petición ha sido aprobada exitosamente
                date: '2022-07-27T14:51:27-05:00'
              type: token
              instrument:
                - keyword: token
                  value: faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
                  displayOn: none
                - keyword: subtoken
                  value: '8740257204881111'
                  displayOn: none
                - keyword: franchise
                  value: visa
                  displayOn: none
                - keyword: franchiseName
                  value: Visa
                  displayOn: none
                - keyword: issuerName
                  value: 'JPMORGAN CHASE BANK, N.A.'
                  displayOn: none
                - keyword: lastDigits
                  value: '1111'
                  displayOn: none
                - keyword: validUntil
                  value: '2029-12-31'
                  displayOn: none
                - keyword: installments
                  value: null
                  displayOn: none
          properties:
            status:
              title: Status
              description: |
                Estructura que contiene el estado de una solicitud. Informa el estado actual de la sesión.
              type: object
              properties:
                status:
                  type: enum
                  description: Estado de una petición o pago
                  example: APPROVED
                  enum:
                    - APPROVED
                    - PENDING
                    - PENDING_CONFIRMATION
                    - REJECTED
                    - APPROVED_PARTIAL
                    - PARTIAL_EXPIRED
                    - FAILED
                reason:
                  type:
                    - string
                    - number
                    - 'null'
                  maxLength: 255
                  description: |
                    Código del motivo proporcionado.
                  example: '00'
                message:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                  description: |
                    Descripción del código de razón.
                  example: La petición ha sido aprobada exitosamente
                date:
                  type: string
                  maxLength: 35
                  format: date-time
                  description: |
                    Fecha y hora en que se genera el estado de pago. Formato [ISO 8601](https://es.wikipedia.org/wiki/ISO_8601).
                  example: '2022-07-27T14:51:27-05:00'
            type:
              type: enum
              description: Define tipo de suscripción que se devuelve
              example: token
              enum:
                - token
                - cuenta
            instrument:
              type: array
              items:
                title: NameValuePair
                description: |
                  Estructura para relacionar datos adicionales en el proceso.
                type: object
                properties:
                  keyword:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: |
                      Identificador o índice del dato a anexar.   
                      EJ: `cmsInvoiceId`
                    example: '1111'
                  value:
                    type:
                      - string
                      - object
                      - array
                      - number
                      - boolean
                    minLength: 1
                    maxLength: 255
                    description: |
                      Valor del dato a anexar.   
                      EJ: `ID_2233`
                    example: lastDigits
                  displayOn:
                    type: enum
                    description: |
                      Indica en qué condiciones se muestra el dato anexo. Ver más en [Campos Adicionales](/checkout/additional-fields)

                      Uno de: `none`, `payment`, `receipt`, `both`, `approved`.
                    example: none
                examples:
                  - value: '468232'
                    keyword: merchantCode
                    displayOn: none
                  - value:
                      code: '1'
                      type: '03'
                      groupCode: X
                      installments: 3
                    keyword: credit
                    displayOn: none
                  - value: 2056
                    keyword: totalAmount
                    displayOn: none
                  - value: 685.33
                    keyword: installmentAmount
                    displayOn: none
