                          type: string
                        subAffiliate:
                          type: string
                        writeReviewUrl:
                          type: string
                          format: uri
                        events:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              value:
                                type: string
                        campaign:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                    shipping:
                      type: object
                      properties:
                        type:
                          type: string
                          description: 'Tipo de envío ("SHIPPED", "DIGITAL", "STORE_PICK_UP", "LOCAL_DELIVERY", "STORE_DRIVE_UP", "IN_PERSON").'
                        provider:
                          type: string
                          description: Nombre del proveedor de envío o plataforma de entrega digital.
                        trackingNumber:
                          type: string
                          description: Numero de seguimiento del envío físico.
                        shippingMethod:
                          type: string
                          description: 'Método de envío ("STANDARD", "EXPRESS", "SAME_DAY", "NEXT_DAY", "SECOND_DAY").'
                        store:
                          type: object
