                          phone:
                            type: string
                            maxLength: 20
                            description: Número telefónico del domicilio
                            example: '+573111111111'
                  buyer:
                    $ref: '#/components/schemas/RedirectInformation/properties/autopay/oneOf/0/items/properties/payer'
                  subscription:
                    type: object
