                        minLength: 1
                        maxLength: 80
                        example: juan.perez@example.com
                        description: Correo eléctronico del usuario o empresa
                      mobile:
                        type: string
                        minLength: 1
                        maxLength: 30
                        description: Número de teléfono del usuario o empresa
