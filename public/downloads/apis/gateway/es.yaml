  /gateway/report:
    post:
      summary: Solicitar un reporte
      operationId: post-report
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
                  id:
                    type: number
                required:
                  - status
                  - id
              examples:
                example:
                  value:
                    status:
                      status: OK
                      reason: '00'
                      message: La solicitud se ha procesado exitosamente
                      date: '2020-01-18T18:00:00-05:00'
                    id: '1231'
                error:
                  value:
                    status:
                      status: FAILED
                      reason: BR
                      message: El reporte solicitado supera los 10 días
                      date: '2020-01-18T18:00:00-05:00'
                    id: '0'
      description: 'Permite solicitar que se genere un reporte de transacciones y retorna un identificador para el proceso, el cúal una vez sea llamado el callback puede ser obtenido en el endpoint siguiente'
      tags:
        - Reporte de operaciones realizadas
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                filters:
                  type: object
                  required:
                    - startDate
                    - endDate
                    - processStartDate
                    - processEndDate
                  properties:
                    startDate:
                      type: string
                      format: date-time
                      example: '2021-01-10T18:01:27-05:00'
                      description: Este campo es obligatorio cuando no se envía processStartDate
                    endDate:
                      type: string
                      format: date-time
                      example: '2021-01-12T18:01:27-05:00'
                    processStartDate:
                      type: string
                      format: date-time
                      example: '2021-01-10T18:01:27-05:00'
                      description: |-
                        Este campo es obligatorio cuando no se envía startDate.

                        Permite filtrar por la fecha de procesamiento de la transacción
                    processEndDate:
                      type: string
                      format: date-time
                      example: '2021-01-12T18:01:27-05:00'
                    state:
                      type: array
                      description: 'Permite definir el estado de las transacciones, es un arreglo: APPROVED, REJECTED, FAILED y PENDING'
                      items:
                        type: string
                        example: '[''APPROVED'', ''REJECTED'']'
                        enum:
                          - APPROVED
                          - REJECTED
                          - PENDING
                          - FAILED
                    type:
                      type: array
                      description: 'Permite definir el tipo de las transacciones, es un arreglo: AUTH_ONLY, CAPTURE_ONLY, CREDIT, REFUND, SETTLE, AUTH_CAPTURE, VOID, DISPUTE, CHARGEBACK, DISPUTE_LOSS, DISPUTE_WIN, PRE_AUTH, CHECKIN, CHECKOUT, RE_AUTH'
                      items:
                        type: string
                        example: '[''AUTH_ONLY'', ''CHARGEBACK'']'
                        enum:
                          - AUTH_ONLY
                          - CAPTURE_ONLY
                          - CREDIT
                          - REFUND
                          - SETTLE
                          - AUTH_CAPTURE
                          - VOID
                          - DISPUTE
                          - CHARGEBACK
                          - DISPUTE_LOSS
                          - DISPUTE_WIN
                          - PRE_AUTH
                          - CHECKIN
                          - CHECKOUT
                          - RE_AUTH
                callbackUrl:
                  type: string
                  format: uri
              required:
                - auth
                - filters
            examples:
              Básico:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: cV5MJlkUgPq/BLG40M1Cp2mSkJcZg7FPL4FBxKo+t5A=
                    nonce: NjQ4MjMzMjY0MDIyYw==
                    seed: '2023-06-08T14:59:34-05:00'
                  filters:
                    startDate: '2023-06-07 14:59:34'
                    endDate: '2023-06-08 14:59:34'
                  callbackUrl: 'https://dnetix.co/ping/report'
              Con estado:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: cV5MJlkUgPq/BLG40M1Cp2mSkJcZg7FPL4FBxKo+t5A=
                    nonce: NjQ4MjMzMjY0MDIyYw==
                    seed: '2023-06-08T14:59:34-05:00'
                  filters:
                    startDate: '2023-06-07 14:59:34'
                    endDate: '2023-06-08 14:59:34'
                    state:
                      - APPROVED
                      - REJECTED
                  callbackUrl: 'https://dnetix.co/ping/report'
