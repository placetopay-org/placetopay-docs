  /gateway/tokenize:
    post:
      summary: Tokenización (tokenize)
      operationId: post-gateway-tokenize
      description: |-
        Este servicio permite almacenar un instrumento de pago como: tarjetas de crédito o cuenta bancaria de manera segura, a través de una petición que contenga la información de la misma, se generará un token que puede ser usado en el servicio de procesamiento y para todos los efectos, en Placetopay equivale a una tarjeta de crédito o cuenta bancaria, la diferencia es que se envía la estructura token en vez de card o account.
        Previamente al consumo de este servicio se debe consultar el de información para saber si es necesario o no generar un OTP al cliente y en caso de ser necesario, solicitar el token a la persona y enviarlo en el consumo.
      tags:
        - Tokenización de tarjetas
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - instrument
              properties:
                locale:
                  type: string
                auth:
                  $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                payer:
                  $ref: '#/paths/~1gateway~1process/post/requestBody/content/application~1json/schema/properties/payer'
                instrument:
                  $ref: '#/components/schemas/Instrument'
                payment:
                  $ref: '#/paths/~1gateway~1process/post/requestBody/content/application~1json/schema/properties/payment'
                subscription:
                  $ref: '#/components/schemas/Subscription'
                ipAddress:
                  type: string
                userAgent:
                  type: string
            examples:
              Tarjeta de crédito:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjBjYjc3YTYwZGZhYw==
                    seed: '2021-06-17T11:26:14-05:00'
                  payer:
                    name: John
                    surname: Doe
                    email: user_email@example.com
                  instrument:
                    card:
                      number: '5180300000000005'
                      expiration: 12/18
                      cvv: '123'
                  ipAddress: 127.0.0.1
                  userAgent: Testing
              Cuenta bancaria:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjBjYjc3YTYwZGZhYw==
                    seed: '2021-06-17T11:26:14-05:00'
                  payer:
                    name: John
                    surname: Doe
                    email: user_email@example.com
                  instrument:
                    account:
                      bankName: Test Bank
                      bankCode: '0001234'
                      accountType: SAV
                      accountNumber: '4111111111111111'
                  ipAddress: 127.0.0.1
                  userAgent: Testing
              Con cobro:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjBjYjc3YTYwZGZhYw==
                    seed: '2021-06-17T11:26:14-05:00'
                  payer:
                    name: John
                    surname: Doe
                    email: user_email@example.com
                  instrument:
                    card:
                      number: '5180300000000005'
                      expiration: 12/18
                      cvv: '123'
                  payment:
                    reference: TEST_PAYMENT_12345
                    amount:
                      currency: COP
                      total: '100'
                  ipAddress: 127.0.0.1
                  userAgent: Testing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
                  provider:
                    type: string
                  instrument:
                    $ref: '#/components/schemas/Instrument'
                  additional:
                    type: object
                    description: Objeto que almacena información adicional de la respuesta de tokenización.
                    properties:
                      bin:
                        type: string
                        description: Primeros 6 dígitos del número de la tarjeta
              examples:
                Ok:
                  value:
