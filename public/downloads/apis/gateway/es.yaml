      properties:
        transactionId:
          type: string
          description: Identificador de la transacción en el servicio PinPad
        positions:
          type: string
          description: Posiciones del PinPad
        pinBlock:
          type: string
          description: PIN encriptado en formato PinBlock
        length:
          type: integer
          description: Longitud del PIN
        format:
          type: integer
          description: Formato de encriptación del PIN
    Redirection:
      title: Redirection
      type: object
      description: 'Representa un medio de pago de redirección, es decir que requiere que se envíe el usuario a otra URL para completar el proceso'
      properties:
        paymentMethod:
          type: string
          enum:
            - _PSE_
            - BTNBC
            - PGEFT
            - BTNAV
            - ATHMV
        returnURL:
          type: string
          format: uri
          maxLength: 250
          description: URL para que una vez se termine el proceso de pago se retorne el control (cuando aplica)
          example: 'http://your-site.com/your-return-route'
        processURL:
          type: string
          format: uri
          maxLength: 250
          description: 'URL a la cual se debe enviar al cliente para continuar el proceso, está es proporcionada por el servicio'
        additional:
          type: object
          description: Estructura para relacionar datos adicionales en el proceso.
          properties:
            bankCode:
              type: string
              description: Código que identifica al banco en la red.
              example: '1007'
            userType:
              type: string
              description: Define si el pagador es una persona natural o jurídica
              enum:
                - person
                - company
            skipRegister:
              type: boolean
              description: Indica si el usuario desea omitir la afiliación a Tarjeta Clave
              default: true
            dispersion:
              type: array
              description: Lista de dispersión de pagos
              items:
                type: object
                properties:
                  serviceCode:
                    type: string
                    description: Código del servicio
                  entityCode:
                    type: string
                    description: Código de la entidad
                  amountValue:
                    type: number
                    description: Valor del monto a pagar
                  taxValue:
                    type: number
                    description: Valor del impuesto aplicado
                  description:
                    type: string
                    description: Detalle sobre la dispersión
    Kount:
      title: Kount
      x-stoplight:
        id: qevzv57mju2tp
      type: object
      description: Maneja información especifica para usar con el filtro de riesgo Kount
      properties:
        session:
          type: string
          description: 'Identificador de esta operación en Kount, debe ser único por transacción'
        type:
          type: string
          description: Describe el tipo de operación que se está manejando en la sesión para definir los campos adicionales a enviar
          enum:
            - airline
            - soat
      required:
        - session
    CardType:
      title: CardType
      x-stoplight:
        id: x4y03rkspgz0b
      type: string
      enum:
        - C
        - R
        - A
      description: 'Indica el tipo de la tarjeta. C = credito, R = debito, A = ahorros'
    BankItem:
      title: BankItem
      x-stoplight:
        id: 60487hsjhovs9
      type: object
      properties:
        code:
          type: string
          description: Código de la entidad bancaria
        description:
          type: string
          description: Nombre de la entidad bancaria
    BalanceInstrument:
      title: Instrument
      type: object
      description: 'Estructura que contiene la información acerca del medio de pago a usar en una transacción, esta estructura es variable de acuerdo a la solicitud que se genere, cada servicio requiere que se usen unos u otros datos.'
      properties:
        card:
          $ref: '#/components/schemas/BalanceCard'
    BalanceCard:
      title: Card
      type: object
      description: Estructura que contiene la información de la tarjeta.
      properties:
        number:
          type: string
          maxLength: '20'
        expiration:
          type: string
          example: 12/22
          pattern: '^[01]\d\/\d{2}$'
      required:
        - number
        - expiration
    Payer:
      type: object
      properties:
        name:
          type: string
          example: John
        surname:
          type: string
          example: Doe
        email:
          type: string
          example: johnDoe@email.com
        mobile:
          type: string
          description: El numero celular puede contener el indicativo del país
          example: '+573111111111'
        address:
          title: Address
          type: object
          description: Estructura que contiene la información sobre una dirección física
          properties:
            street:
              type: string
              maxLength: '128'
              description: Calle
            city:
              type: string
              maxLength: '30'
              description: Ciudad
            state:
              type: string
              maxLength: '3'
              description: Código de la subdivisión del país que representa el estado o provincia. Formato ISO 3166-2
              example: CUN
            postalCode:
              type: string
              maxLength: '10'
              description: Código postal
              example: '110111'
            country:
              type: string
              maxLength: '2'
              example: CO
              description: País. Código ISO 3166-1 alpha-2
            phone:
              type: string
              maxLength: '20'
              description: Teléfono
              example: '3003003000'
    Buyer:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Payer/properties/address'
