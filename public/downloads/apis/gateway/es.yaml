                  $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                reference:
                  type: string
                  minLength: 1
                amount:
                  title: Amount
                  type: object
                  description: Estructura que contiene la información acerca del pago de la transacción requerida al servicio web
                  required:
                    - currency
                    - total
                  properties:
                    currency:
                      type: string
                      description: |
                        Código alfabético de la moneda a usar (ISO 4217 alpha code)
                      enum:
                        - USD
                        - COP
                        - CRC
                        - EUR
                        - CAD
                        - AUD
                        - GBP
                        - MXN
                        - CLP
                      example: COP
                      minLength: 3
                      maxLength: 3
                    total:
                      type: number
                      example: 2000
                      description: |
                        Valor total en la moneda base indicada
                    taxes:
                      type: array
                      description: |
                        Estructura para definir impuestos en el proceso de pago.
                      items:
                        $ref: '#/paths/~1gateway~1information/post/requestBody/content/application~1json/schema/oneOf/5/properties/payment/properties/amount/properties/taxes/items'
                    details:
                      type: array
                      description: |
                        Estructura para definir detalles adicionales del monto en el proceso de pago.
                      items:
                        $ref: '#/paths/~1gateway~1information/post/requestBody/content/application~1json/schema/oneOf/5/properties/payment/properties/amount/properties/details/items'
              required:
                - auth
                - reference
                - amount
            examples:
              Ejemplo:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: +FSGHsW3e6WrrHcIdBmqI+j6FFeUN4bidfPL7LeZgvE=
                    nonce: N2YzMGM1M2QxOTU3YzZmMzVlYmIzZTAyOGMwNjNkMmU=
                    seed: '2021-03-03T19:40:37+01:00'
                  reference: TEST_20171108_144400
                  amount:
                    currency: COP
                    total: 1000
