                    name: John
                    email: user_email@example.com
                  payment:
                    reference: '1234567890'
                    amount:
                      currency: USD
                      total: 3
                  instrument:
                    card:
                      number: '36545400000008'
                      expiration: 12/20
                      cvv: '123'
                    otp: '123456'
                  ipAddress: 127.0.0.1
                  userAgent: Testing
      responses:
