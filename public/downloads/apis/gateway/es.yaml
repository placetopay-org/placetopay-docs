                      type: string
                      description: Determina el idioma de la respuesta
                      example: es-CO
                    auth:
                      $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                    instrument:
                      $ref: '#/components/schemas/Instrument'
                    payment:
                      $ref: '#/paths/~1gateway~1process/post/requestBody/content/application~1json/schema/properties/payment'
                    ipAddress:
                      type: string
                    userAgent:
                      type: string
                  required:
                    - auth
                    - payment
                    - instrument
                - title: PSE
                  type: object
                  properties:
                    auth:
                      $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                    locale:
                      type: string
                    payer:
                      $ref: '#/paths/~1gateway~1process/post/requestBody/content/application~1json/schema/properties/payer'
                    payment:
