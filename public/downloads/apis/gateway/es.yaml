                      description: ID del beneficiario. Requerido en transacciones PSE para comercios en la categoría de servicios financieros.
                      example: '12345'
                    preferredPaymentMethodIndex:
                      type: integer
                      description: Índice de medio de pago a seleccionar dentro de una lista de medios de pago disponibles. Este campo es requerido solo cuando se desee emplear el flujo de orquestador de pagos.
                      example: 2
                    kount:
                      type: object
                      description: Información adicional sobre la transacción que puede ser utilizada para análisis de riesgo y prevención de fraude.
                      properties:
                        account:
                          type: object
                          properties:
                            id:
                              type: string
                            type:
                              type: string
                            creationDateTime:
                              type: string
                              format: date-time
                            username:
                              type: string
                            accountIsActive:
                              type: boolean
                        loyalty:
                          type: object
                          properties:
                            id:
                              type: string
                            description:
                              type: string
                            credit:
                              type: object
                              properties:
                                creditType:
                                  type: string
                                amount:
                                  type: integer
                                currency:
                                  type: string
                                  description: Currency code (ISO 4217)
                        promotions:
