                            - SUSPICIOUS_ACTIVITY_OBSERVED
                          description: Indica si el comercio ha experimentado actividad sospechosa (incluido fraude previo) en la cuenta del titular de la tarjeta.
                          nullable: true
                          example: NO_SUSPICIOUS_ACTIVITY_OBSERVED
