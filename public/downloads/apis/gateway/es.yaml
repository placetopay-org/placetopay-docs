                  $ref: '#/components/schemas/Instrument'
                payment:
                  $ref: '#/paths/~1gateway~1process/post/requestBody/content/application~1json/schema/properties/payment'
                subscription:
                  $ref: '#/components/schemas/Subscription'
            examples:
              Ejemplo:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: q/7k0WUshvLEpQ5gqNWqne+ZfWXSXUP/b7T80TuAUSY=
                    nonce: NjE0YTM3OGIwNjA2NA==
                    seed: '2021-09-21T14:50:35-05:00'
