                          description: 'Para una compra pre-ordenada, la fecha esperada en que la mercancía estará disponible.'
                          nullable: true
                          example: '2025-10-08'
                        preOrderPurchaseIndicator:
                          type: string
                          enum:
                            - MERCHANDISE_AVAILABLE
