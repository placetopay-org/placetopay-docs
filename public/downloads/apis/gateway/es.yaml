                  $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                user:
                  type: object
                  description: |
                    Usuario dueño de la cuenta a validar
                  required:
                    - name
                    - email
                  properties:
                    name:
                      type: string
                      description: Primer nombre o nombres del usuario propietario de la cuenta
                      maxLength: 50
                      example: John
                    surname:
                      type: string
                      description: Apellidos del usuario propietario de la cuenta
                      maxLength: 50
                      example: Doe
                    email:
                      type: email
                      description: Correo Electrónico del usuario propietario de la cuenta
                      maxLength: 80
                      example: John.doe@test.com
                returnUrl:
                  type: string
                  description: Url de retorno una vez culmine el proceso de validación de cuentas
                  maxLength: 255
                  example: 'https://www.placetopay.com/return'
                locale:
                  type: string
                  description: Determina el idioma de la respuesta
                  maxLength: 5
                  example: es_CO
                isAuthenticated:
                  type: boolean
                  description: 'Determina si ya se ha realizado un proceso de autenticación externa. La intención de no validar el correo electrónico del usuario dos veces. por defecto es false, quiere decir que se realizara envio de OTP para validar el usuario si este ya ha validado cuentas con microdepositos en el sistema'
                  example: true
      responses:
        '200':
          description: Sesión creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Estructura que contiene la respuesta a la solicitud en el caso de que el estado sea exitoso
                    properties:
                      requestId:
                        type: string
                        description: Identificador unico de la sesión que desea consultar.
                        format: regex
                        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                        maxLength: 36
                        example: 9bd89c8d-6097-4d69-8ce9-d9b5ec35d8ea
                      redirectUrl:
                        type: string
                        format: uri
                        description: URL de redireccionamiento
                        example: 'https://dev-account-validator.placetopay.ws/verification/redirect/9bd89c8d-6097-4d69-8ce9-d9b5ec35d8ea'
                      expiresAt:
                        type: string
                        description: Fecha de expiración de la sesión
                        format: date-time
                        example: '2024-04-19 17:36:57'
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
        '400':
          description: Petición inválida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
                required:
                  - status
  /gateway/account-validator/query:
    post:
      summary: Consultar estado de sesión
      description: Este endpoint te permitirá consultar el estado de la sesión creada.
      operationId: check-session-status
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              required:
                - auth
                - requestId
              properties:
                auth:
                  $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                requestId:
                  type: string
                  description: Identificador unico de la sesión que desea consultar.
                  example: 1f630ff7-9c02-4da4-82d4-d676709acb21
                  format: regex
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                  maxLength: 36
      responses:
        '200':
          description: Consulta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
                  data:
                    type: object
                    description: Estructura que contiene la respuesta a la solicitud en el caso de que el estado sea exitoso
                    properties:
                      requestId:
                        type: string
                        description: Identificador unico de la sesión que desea consultar.
                        example: 1f630ff7-9c02-4da4-82d4-d676709acb21
                        format: regex
                        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                        maxLength: 36
                      expiresAt:
                        type: string
                        description: Fecha de expiración de la sesión
                        example: '2022-08-30 15:19:33'
                        format: date-time
                      isAuthenticated:
                        type: boolean
                        description: Indica si el usuario ya ha realizado un proceso de autenticación externa
                        example: true
                      token:
                        $ref: '#/components/schemas/Token'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
                required:
                  - status
  /gateway/account-validator/validate:
    post:
      summary: Validar Cuenta existente
      description: 'Una vez realizada de manera exitosa la creación inicial de la sesión podrá realizar validaciones a la cuenta las veces que considere necesarias, solo debe tener la información de la cuenta y el código de verificación entregado en el proceso anterior.'
      operationId: validate-existing-account
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              required:
                - auth
                - instrument
              properties:
                auth:
                  $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                instrument:
                  type: object
                  description: |
                    Token a la que se le realizará la validación.
                  required:
                    - token
                  properties:
                    token:
                      type: object
                      description: |
                        Se requiere el token o subtoken de la cuenta a validar.
                      properties:
                        token:
                          type: string
                          examples:
                            - faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
                        subtoken:
                          type: string
                          examples:
                            - fakesubtoken00005
                payment:
                  type: object
                  description: |
                    Estructura que contiene la información acerca del pago de la transacción.
                  required:
                    - name
                    - email
                  properties:
                    amount:
                      type: object
                      description: |
                        Estructura que contiene la información acerca del pago de la transacción.
                      properties:
                        currency:
                          type: string
                          example: USD
                          maxLength: 3
                          minLength: 3
                        total:
                          type: number
                          example: 1000
                locale:
                  type: string
                  example: es_CO
                  default: en
      responses:
        '200':
          description: Respuesta estado de validación
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
components:
  schemas:
    Subscription:
      title: Subscription
      x-stoplight:
        id: vip3u3guypqyd
      type: object
      description: Estructura que contiene la información sobre una suscripción o transacción que no requiera un monto en específico
      properties:
        reference:
          type: string
          x-stoplight:
            id: hpkr64f4l7gwo
          maxLength: '32'
        description:
          type: string
          minLength: '1'
          x-stoplight:
            id: cc6z3gqusoy1k
          maxLength: '254'
    Document:
      title: Document
      type: object
      description: Estructura que contiene información acerca de un documento
      properties:
        type:
          type: string
          maxLength: '3'
          enum:
            - NIT
            - CC
            - CE
            - RUT
            - TI
          example: NIT
          description: 'Tipo de documento de identificación. [Para más información](/gateway/document-types)'
        number:
          type: string
          example: '123456123'
          description: Número de documento de identificación.
        expeditionDate:
          type: string
          description: 'Fecha de expedición '
        expirationDate:
          type: string
          description: Fecha de expiración
      required:
        - type
        - number
    Account:
      title: Account
      type: object
      description: Estructura que contiene la información de la cuenta bancaria.
      required:
        - bankCode
        - accountType
        - accountNumber
      properties:
        bankName:
          type: string
          maxLength: '30'
          description: Nombre del banco de la cuenta a procesar
        bankCode:
          type: string
          maxLength: '17'
          description: Código que identifica al banco en la red
        accountType:
          type: string
          description: tipo de cuenta
          enum:
            - SAV
            - DDA
            - CCD
        accountNumber:
          type: string
          maxLength: '17'
          description: Número de cuenta
        franchise:
          type: string
          x-stoplight:
            id: bhbb4cpy3me8p
          maxLength: '20'
        verificationCode:
          type: string
          x-stoplight:
            id: jpxori5mf80z2
          example: eyJhbGciOiJSUzI1NiJ9.eyJhY2NvdW50SGFzaCI6ImM5YWM2ZjFhZDhjNDA3Y2ZjNzMyNDljNTE2MTJjNTdmMWQxZGNiNTA4YjE4ZGJlYWE1MWQ0NDI5NjBjMjUwNDUyMzY4ZTg2YmUzMWQ3MDMxMDY4ZDM2MjM2NzVjYzhkYTUzNzhhODNmMTUwZjg5OTczOTBiZTEyMGU1ZmExN2RhIiwib25UZXN0Ijp0cnVlLCJzZXJ2aWNlIjoibW9jayIsImlkIjo0MDB9.dFMY4EwCrWq9EBmERFkKCoLHExPH4vgaCgnZaqB_mf8n3Sv6Qnu6Pb79onluX1OZecmYmBuHqZ_ykKXWSD4RMZSpckYFCiO3mlcJKI4qb91COhl_c2qXxYJuLEdbLfGlzf0k8-oJgFcO9gAS1Xm0hpTP4iiXF6st1hFwlfR3fpX4rr-bTsKgMvRSReMuxa0Vs92DykfqUR_3udlc0DFCPB9ZTaSqeRNHFAPAWNniUPWURQlW5c9J9xcyKTgKGzfI1_7h2I4ALQeRifptE2nC-HZtEMwtcToNh7hn0oL9lNFXnXGK9sWKORcyWKVfpEChS8z30UfX6kOhU6fp_qUwmA
          description: El verificationCode es un JSON Web Signature (JWS). Tiene el fin de ser el instrumento verificador del estado de la cuenta.
    Instrument:
      title: Instrument
      type: object
      description: 'Estructura que contiene la información acerca del medio de pago a usar en una transacción, esta estructura es variable de acuerdo a la solicitud que se genere, cada servicio requiere que se usen unos u otros datos.'
      properties:
        card:
          $ref: '#/components/schemas/Card'
        account:
          $ref: '#/components/schemas/Account'
        token:
          $ref: '#/components/schemas/Token'
        credit:
          $ref: '#/components/schemas/Credit'
        threeDS:
          type: object
          properties:
            version:
              type: string
              enum:
                - v2
                - v2x
            id:
              type: number
              description: Este valor solo aplica si la validación se hizo con el servicio de 3DS de Placetopay
            enrolled:
              type: string
              minLength: 1
              enum:
                - 'Y'
                - 'N'
                - U
              description: Informa si la tarjeta se encuentra registrada en 3DS
            authenticated:
              type: string
              minLength: 1
              enum:
                - 'Y'
                - 'N'
                - U
                - A
                - I
                - C
                - D
                - R
              maxLength: 1
            eci:
              type: string
              minLength: 1
              description: Indicador del resultado de la autenticación generado por el comercio electrónico.
              enum:
                - '02'
                - '01'
                - '00'
                - '05'
                - '06'
                - '07'
            cavv:
              type: string
              minLength: 28
              maxLength: 28
              nullable: true
              description: Valor de autenticación para la franquicia generado por el ACS. (3DS campo `authenticationValue`).
              example: AJkBABIWcQAAAAM5FwIzdGiYeHM
            xid:
              type: string
              minLength: 1
              description: ID de Transacción DS (3DS campo `dsTransID`).
            extra:
              type: object
              properties:
                transStatusReason:
                  type: string
                  description: Proporciona información sobre el estado de la transacción.
                  nullable: true
                acsTransId:
                  type: string
                  description: Identificador único de transacción generado por el ACS.
                  example: 37a7b6e0-fd58-4e38-98de-79c70c526a47
                threeDSServerTransID:
                  type: string
                  description: Identificador único de transacción generado por el 3DS Server.
                  example: eadd3a60-b870-41d0-977f-921b3dbe6323/MkGJDl2Y5E=
                deviceChannel:
                  type: string
                  description: Canal a través del cual se realiza la transacción.
                  enum:
                    - APP
                    - BRW
                    - RI
                messageCategory:
                  type: string
                  description: Indica la categoría del mensaje.
                  enum:
                    - PA
                    - NPA
                authMethod:
                  type: string
                  description: Indica si la transacción tuvo o no desafío.
                  example: FRICTIONLESS_AUTHENTICATION
                authTimestamp:
                  type: string
                  description: Indica el timestamp de la autenticación.
                  example: '2020-04-21T01:44:54.000Z'
                authInd:
                  type: string
                  description: Define el tipo de autenticación aplicada según el canal utilizado.
                  example: RECURRING_TRANSACTION
            validSignature:
              type: boolean
          required:
            - enrolled
            - authenticated
            - eci
            - cavv
            - xid
            - version
        otp:
          type: string
        pinPad:
          $ref: '#/components/schemas/PinPad'
        pin:
          type: string
          example: 0B880E2326F6409E
          minLength: '2'
          maxLength: '20'
          description: Recibe el código PIN cuando es plano o cuando se trata de un PinBlock
        redirection:
          $ref: '#/components/schemas/Redirection'
        kount:
          $ref: '#/components/schemas/Kount'
        pocket:
          type: string
          description: Bolsillo de la tarjeta utilizado para el pago
    Card:
      title: Card
      type: object
      description: Estructura que contiene la información de la tarjeta.
      properties:
        number:
          type: string
          maxLength: '20'
        expiration:
          type: string
          example: 12/22
          pattern: '^[01]\d\/\d{2}$'
        cvv:
          type: string
      required:
        - number
    Token:
      title: Token
      type: object
      description: |-
        Estructura que contiene la información del token que asocia a la tarjeta
        Para la entrada solo es necesario el token o el subtoken y el cvv si se trata de una operación donde el usuario está presente
        Para la salida si se devuelven todos los datos al tokenizar 
      properties:
        id:
          type: number
          description: 'Identificador del token en el sistema, aplica solo si el sitio cuenta con URL de notificación para token configurada'
        token:
          type: string
          maxLength: '64'
          minLength: '64'
          description: Código generado para identificar la tarjeta en el sistema
        subtoken:
          type: string
          maxLength: '16'
          minLength: '16'
          description: Código alterno generado para identificar la tarjeta
        franchise:
          type: string
          enum:
            - visa
            - visa_electron
            - amex
            - master
            - codensa
            - diners
            - jbc
            - discover
            - ris
            - credencial
            - comfama
            - colsubsidio
            - falabella
            - elo
            - somos
            - tuya
            - exito
            - alkosto
            - maestro
            - mefia
            - ath_card
          description: Codigo de la franquicia asociada al token (Solo como respuesta no es necesario enviarla)
        franchiseName:
          type: string
        issuerName:
          type: string
        lastDigits:
          type: string
        validUntil:
          type: string
        cvv:
          type: string
          minLength: 3
          maxLength: 4
          description: CVV solicitado al usuario en caso de que esté presente en la operación
      x-examples:
        Ejemplo respuesta:
          value:
            token: faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
            subtoken: fakesubtoken00005
            franchise: master
            franchiseName: Mastercard
            lastDigits: '0005'
            validUntil: '2018-12-31'
            installments: '3'
        Ejemplo en solicitud:
          value:
            token: faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
            cvv: '123'
