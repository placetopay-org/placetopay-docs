                                  description: Código postal de la tienda.
                                  example: '10001'
                    requiresConfirmation:
                      type: boolean
                      description: Indica si la transacción requiere confirmación previo a su procesamiento.
                      example: true
                    interestQueryCode:
                      type: string
                      description: 'Indica si la cuota cuenta con información disponible para ser aplicada durante el procesamiento de la transacción. Este campo es válido para el servicio **PAYSTUDIO**, *flavour* **TS**, y la información debe estar disponible a través del [servicio de consulta de intereses](/gateway/interests).Si se envía este valor, pero el código proporcionado no es válido o no es retornado por dicho servicio, la transacción será rechazada.'
