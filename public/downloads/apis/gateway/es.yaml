                          properties:
                            id:
                              type: string
                            description:
                              type: string
                            status:
                              type: string
                            statusReason:
                              type: string
                            discount:
                              type: object
                              properties:
                                percentage:
                                  type: number
                                amount:
                                  type: integer
                                currency:
                                  type: string
                                  description: Currency code (ISO 4217)
                            credit:
                              type: object
                              properties:
                                creditType:
                                  type: string
                                percentage:
                                  type: number
                                currency:
                                  type: string
                                  description: Currency code (ISO 4217)
                                amount:
                                  type: integer
                        links:
