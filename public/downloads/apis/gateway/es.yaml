          example: AJkBABIWcQAAAAM5FwIzdGiYeHM
        xid:
          type: string
          minLength: 1
          description: Presente si `action` fue `continue`. ID de Transacción DS (3DS campo `dsTransID`).
        extra:
          type: object
          description: presente si `action` fue `continue`. Información adicional de la transacción.
          properties:
            transStatusReason:
              type: string
              description: Proporciona información sobre el estado de la transacción.
              nullable: true
            acsTransId:
              type: string
              description: Identificador único de transacción generado por el ACS.
              example: 37a7b6e0-fd58-4e38-98de-79c70c526a47
            threeDSServerTransID:
              type: string
              description: Identificador único de transacción generado por el 3DS Server.
              example: eadd3a60-b870-41d0-977f-921b3dbe6323/MkGJDl2Y5E=
            deviceChannel:
              type: string
              description: Canal a través del cual se realiza la transacción.
              enum:
                - APP
                - BRW
                - RI
            messageCategory:
              type: string
              description: Indica la categoría del mensaje.
              enum:
                - PA
                - NPA
            authMethod:
              type: string
              description: Indica si la transacción tuvo o no desafío.
              example: FRICTIONLESS_AUTHENTICATION
            authTimestamp:
              type: string
              description: Indica el timestamp de la autenticación.
              example: '2020-04-21T01:44:54.000Z'
            authInd:
              type: string
              description: Define el tipo de autenticación aplicada según el canal utilizado.
              example: RECURRING_TRANSACTION
            messageVersion:
              type: string
              description: Es el número de versión del protocolo 3DS que utiliza el sistema para ejecutar el flujo de autenticación.
              example: 2.2.0
              nullable: true
