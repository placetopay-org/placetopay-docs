  /security/pinpad/transaction:
    post:
      summary: Solicitud de Pinpad
      operationId: post-rest-security-transaction
      description: |-
        Un PINPAD es un dispositivo electrónico que se utiliza en una transacción de débito, crédito o tarjeta inteligente para aceptar y cifrar el número de identificación personal (PIN) del titular de la tarjeta.
        Esta API proporciona un servicio PinPad con generación de PinBlock cifrada según ISO 9564.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                instrument:
                  $ref: '#/components/schemas/Instrument'
            examples:
              Solicitud por tarjeta:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjE1MWQ4MDE5YWViMw==
                    seed: '2021-09-27T09:41:05-05:00'
                  instrument:
                    card:
                      number: '4111111111111111'
              Solicitud por token:
                value:
                  auth:
                    login: aabbccdd1234567890aabbccdd123456
                    tranKey: ABC123example456trankey+789abc012def3456ABC=
                    nonce: NjE1MWQ4MDE5YWViMw==
                    seed: '2021-09-27T09:41:05-05:00'
                  instrument:
                    token:
                      token: faketoken12f233bd8f5d42138d681bf07ea8295429df07a4af287703e30c891
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1invalidate/post/responses/200/content/application~1json/schema/properties/status'
                  data:
                    type: object
                    properties:
                      pinPad:
                        $ref: '#/components/schemas/PinPad'
              examples:
                Respuesta exitosa:
                  value:
                    status:
                      status: APPROVED
                      reason: '00'
                      message: Aprobada
                      date: '2021-09-14T17:43:48-05:00'
                    data:
                      pinPad:
                        positions: '7915864032'
                        transactionId: b0c62f97-3b06-4c33-b68f-e281e95eb4bb
                        pinLength: '4'
                Error:
                  value:
                    status:
                      status: FAILED
                      reason: '0'
                      message: ''
                      date: '2021-09-22T16:53:48-05:00'
                Rechazo:
                  value:
                    status:
                      status: REJECTED
                      reason: '05'
                      message: El servicio requerido no se encuentra disponible en el sitio
                      date: '2021-09-27T09:35:03-05:00'
                Servicio no disponible:
                  value:
                    status:
                      status: REJECTED
                      reason: SU
                      message: El servicio requerido no se encuentra disponible en el sitio
                      date: '2021-09-27T09:35:03-05:00'
      tags:
        - Operaciones con Pinpad
    parameters: null
