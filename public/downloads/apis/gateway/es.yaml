                          nullable: true
                          example: FUTURE_AVAILABILITY
                        reOrderItemsIndicator:
                          type: string
                          enum:
                            - REORDERED
                            - FIRST_TIME_ORDERED
                          description: Indica si el Titular de la tarjeta está reordenando mercancía comprada anteriormente.
                          nullable: true
                          example: REORDERED
                        shipIndicator:
                          type: string
                          enum:
                            - SHIP_TO_CARDHOLDER_BILLING_ADDR
                            - SHIP_TO_ANOTHER_VERIFIED_ADDR_ON_FILE
                            - SHIP_TO_ADDR_DIFF_CARDHOLDER_BILLING_ADDR
                            - SHIP_TO_STORE
                            - DIGITAL_GOODS
                            - TRAVEL_EVENT_TICKETS_NOT_SHIPPED
                            - OTHER
                          description: Indica el método de envío elegido para la transacción.
                          nullable: true
                          example: SHIP_TO_STORE
                    cardholderAccountInformation:
                      type: object
                      description: 'Objeto que contiene información adicional sobre la cuenta del titular de la tarjeta.  Estos datos adicionales permiten realizar una evaluación más precisa, lo que puede mejorar considerablemente la tasa de autenticaciones exitosas.'
                      properties:
                        cardholderAccountAgeIndicator:
                          type: string
                          description: Longitud del tiempo en que la cuenta fue creada en el sitio web del comercio.
                          enum:
                            - NO_ACCOUNT
                            - CREATED_DURING_TRANSACTION
                            - LESS_30_DAYS
                            - BETWEEN_30_AND_60_DAYS
                            - MORE_60_DAYS
                          nullable: true
                          example: LESS_30_DAYS
                        cardholderAccountChangeDate:
                          type: string
                          format: YYYY-MM-DD
                          description: Fecha del último cambio efectuado en la cuenta del tarjetahabiente en el sitio web del comercio.
                          nullable: true
                          example: '2025-12-29'
                        cardholderAccountChangeIndicator:
                          type: string
                          enum:
                            - CHANGED_DURING_TRANSACTION
                            - LESS_30_DAYS
                            - BETWEEN_30_AND_60_DAYS
                            - MORE_60_DAYS
                          description: Longitud del tiempo desde el último cambio efectuado en la cuenta en el sitio web del comercio.
                          nullable: true
                          example: MORE_60_DAYS
                        cardholderAccountDate:
                          type: string
                          format: YYYY-MM-DD
                          description: Fecha en la que se realizó el último cambio o recuperación de contraseña de la cuenta en el sitio web del comercio.
                          nullable: true
                          example: '2025-08-01'
                        cardholderAccountPasswordChangeIndicator:
                          type: string
                          enum:
                            - NO_CHANGE
                            - CHANGED_DURING_TRANSACTION
                            - LESS_30_DAYS
                            - BETWEEN_30_AND_60_DAYS
                            - MORE_60_DAYS
                          description: Longitud de tiempo desde el último cambio o recuperación de contraseña de la cuenta.
                          nullable: true
                          example: MORE_60_DAYS
                        cardholderPurchaseCount:
                          type: string
                          maxLength: 4
                          description: Número de compras durante los últimos 6 meses.
                          nullable: true
                          example: '1234'
                        addCardAttemptsDay:
                          type: string
                          description: Número de intentos de agregar tarjetas en las últimas 24 horas.
                          maxLength: 3
                          nullable: true
                          example: '05'
                        trxActivityDay:
                          description: Número de transacciones (exitosas y abandonadas) para la cuenta en las últimas 24 horas.
                          type: string
                          maxLength: 3
                          nullable: true
                          example: '05'
                        trxActivityYear:
                          description: Número de transacciones (exitosas y abandonadas) para la cuenta en el último año.
                          type: string
                          maxLength: 3
                          nullable: true
                          example: '123'
                        paymentAccountAge:
                          type: string
                          format: YYYY-MM-DD
                          description: Fecha en la que el método de pago se agregó a la cuenta del usuario en el sitio web del comercio.
                          nullable: true
                          example: '2025-04-04'
                        paymentAccountIndicator:
                          type: string
                          enum:
                            - NO_ACCOUNT
                            - CREATED_DURING_TRANSACTION
                            - LESS_30_DAYS
                            - BETWEEN_30_AND_60_DAYS
                            - MORE_60_DAYS
                          description: Longitud de tiempo desde que el método de pago fue enrolado en la cuenta en el sitio web del comercio.
                          nullable: true
                          example: MORE_60_DAYS
                        shipAddressUsage:
