  /gateway/process:
    post:
      summary: Procesamiento de transacción
      operationId: post-gateway-process
      description: 'Este servicio permite que se realice el cobro a la tarjeta del usuario, los parámetros del instrument son variables, si no se pide tipo de crédito ni otp no es necesario enviar esas variables, payer es siempre requerido, buyer es opcional pero recomendado.'
      tags:
        - Procesamiento de transacción
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: 'Este campo debe ser enviado únicamente cuando se realice un proceso de checkin, de lo contrario, no debe ser enviado en la solicitud'
                  enum:
                    - checkin
                locale:
                  type: string
                  example: es_CO
                auth:
                  $ref: '#/paths/~1security~1pinpad~1pinblock/post/responses/200/content/application~1xml/schema'
                payer:
                  title: Person
                  type: object
                  description: Estructura que refleja la información de una persona involucrada en una transacción.
                  properties:
                    documentType:
                      type: string
                      description: '[Tipo de documento de identificación](/gateway/document-types)'
                      example: CC
                      maxLength: '6'
                    document:
                      type: string
                      description: 'Número de documento de identificación. Debe ser un número válido de acuerdo al tipo de documento. Ver más en [Tipos de documento de identificación](/gateway/document-types)'
                      maxLength: '25'
                    name:
                      type: string
                      description: Nombre
                      maxLength: '60'
                    surname:
                      type: string
                      description: Apellidos
                      maxLength: '60'
                    company:
                      type: string
                      description: Compañia
                      maxLength: '60'
                    email:
                      type: string
                      description: Correo electrónico.
                      maxLength: '80'
                    address:
                      $ref: '#/components/schemas/Payer/properties/address'
                      description: Objeto que contiene información de la dirección de una persona.
                    mobile:
                      type: string
                      description: Teléfono movil
                buyer:
                  $ref: '#/paths/~1gateway~1process/post/requestBody/content/application~1json/schema/properties/payer'
                instrument:
                  $ref: '#/components/schemas/Instrument'
                payment:
                  title: Payment
                  type: object
                  description: Estructura que contiene la información acerca del pago de la transacción requerida al servicio web
                  properties:
                    reference:
                      type: string
                      minLength: 1
                      maxLength: 32
                    description:
                      type: string
                      maxLength: 250
                    amount:
                      $ref: '#/paths/~1gateway~1search/post/requestBody/content/application~1json/schema/properties/amount'
                    dispersion:
                      type: array
                      items:
                        title: Dispersion
                        type: object
                        description: Estructura que contiene la información requerida para un pago de dispersión
                        properties:
                          agreement:
                            type: number
                            description: 'Identificador de destinatario de la transacción. Para el sitio principal de la transacción, el valor debe ser null.'
                            nullable: true
                          agreementType:
                            type: string
                            enum:
                              - AIRLINE
                              - MERCHANT
                          amount:
                            $ref: '#/paths/~1gateway~1search/post/requestBody/content/application~1json/schema/properties/amount'
                    modifiers:
                      type: array
                      description: Estructura que contiene modificadores de pago
                      items:
                        title: PaymentModifier
                        type: object
                        description: |-
                          Estructura para almacenar información sobre un modificador de pago.
                          NOTA: Si se envia un modificador que aplica descuento, no se tomará los descuentos configurados por promociones en el sítio.
                        x-examples:
                          law-discount:
                            type: FEDERAL_GOVERNMENT
                            code: '17934'
                            additional:
                              invoice: '123456'
                        properties:
                          type:
                            type: string
                            enum:
                              - FEDERAL_GOVERNMENT
                            description: Tipo de modificador
                          code:
                            type: string
                            example: '17934'
                            description: 'Código del modificador. Cuando el tipo es FEDERAL_GOVERMENT, representa el número de ley para descuento.'
                          additional:
                            type: object
                            description: Informaciones adicionales del modificador
                            properties:
                              invoice:
                                type: string
                                description: Número de factura. Requerido cuando tipo es FEDERAL_GOVERMENT.
                    shipping:
                      $ref: '#/paths/~1gateway~1process/post/requestBody/content/application~1json/schema/properties/payer'
                      description: Estructura para relacionar información de envío.
                    items:
                      type: array
                      items:
                        description: Posee una colección de estructuras de elementos.
                        title: Item
                        type: object
                        properties:
                          sku:
                            type: string
                            minLength: 1
                            maxLength: 30
                            description: |
                              Identificador SKU del artículo.   
                              EJ: `SKU-12345`
                            example: SKU-12345
                          id:
                            type: string
                            minLength: 1
                            maxLength: 30
                            description: Id del item
                            example: '12345'
                          description:
                            type: enum
                            description: Descripción del artículo.
                            example: Descripción del artículo
                          name:
                            type: enum
                            description: |
                              Nombre del artículo.   
                              EJ: `Manta de lana`
                            example: product_1
                          category:
                            type: string
                            minLength: 1
                            maxLength: 30
                            description: |
                              Categoría del artículo. Uno de: `digital` `physical`
                            enum:
                              - digital
                              - physical
                            example: physical
                          qty:
                            type: number
                            description: |
                              Cantidad de artículos de este tipo.   
                              EJ: `23`
                            example: '1'
                          price:
                            type: number
                            description: |
                              Costo total del artículo.   
                              EJ: `1400`
                            example: 1400
                          tax:
                            type: number
                            description: |
                              Monto en impuestos del artículo.   
                              EJ: `100`
                          additional:
                            type: object
                            description: Es un objeto que permite enviar datos adicionales en formato JSON.
                            nullable: true
                      description: |
                        Estructura para relacionar productos o artículos en el proceso.
                additional:
                  type: object
                  description: |
                    Objeto dinámico clave valor de información que se desee guardar con la transacción. Las siguientes claves **NO** son permitidas: `_accountNumber`, `userAgent`, `fingerprint`, `sourcePlatform`, `tokenizationID`, `trazabilyCode`, `transactionCycle`, `RequestId`, `PartnerAuthCode`, `onTest`, `threeDSEnrolled`, `threeDSAuthenticated`.
                    Ver más en [Datos adicionales](/gateway/additional-data)
                metadata:
                  type: object
                  description: |
                    Objeto dinámico clave valor de información adicional que solicitan los servicios externos para ser ejecutados.
                  properties:
                    EBTDeliveryIndicator:
                      type: string
                      enum:
                        - DIRECT_DELIVERY
                        - CUSTOMER_PICKUP
                        - COMMERCIAL_SHIPPING
                        - OTHER
                        - NOT_AVAILABLE
                    openingDate:
                      type: string
                      description: Fecha de apertura del producto. Requerido en transacciones PSE para comercios en la categoría de servicios financieros.
                      example: '2025-04-16'
                    beneficiaryId:
